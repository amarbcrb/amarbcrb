<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Calculs Coach : calculs de laboratoire en microbiologie et biologie moléculaire. Cours, 13 calculateurs, exercices et examens. Fonctionne hors ligne.">
<title>Calculs Coach</title>
<script>
/* Applique le theme avant le premier rendu pour eviter un flash. */
(function(){try{var d=JSON.parse(localStorage.getItem('labcalc-master-v1')||'null');var t=d&&d.theme?d.theme:(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);if(d&&d.prefs&&d.prefs.transparency==='reduced')document.documentElement.setAttribute('data-transparency','reduced');}catch(e){}})();
</script>
<style>
/* =====================================================================
   Calculs Coach - feuille de style
   Direction : verre liquide translucide sur fond nacré (clair) ou
   anthracite OLED (sombre). Accent bordeaux, second accent violet.
   Mobile d'abord ; toutes les couleurs passent par des variables.
   ===================================================================== */
:root {
  color-scheme: light;
  --bg: #e9ebf1;
  --bg-2: #f6f7fa;
  --blob-1: rgba(98, 84, 214, .30);
  --blob-2: rgba(140, 35, 80, .22);
  --blob-3: rgba(38, 140, 150, .20);
  --text: #16141d;
  --text-2: #45414f;
  --text-3: #625e70;
  --accent: #8c2350;
  --accent-hover: #741a41;
  --accent-ink: #ffffff;
  --accent-soft: rgba(140, 35, 80, .10);
  --violet: #5446c9;
  --violet-soft: rgba(84, 70, 201, .10);
  --ok: #155e47; --ok-soft: rgba(21, 94, 71, .11);
  --err: #a8233b; --err-soft: rgba(168, 35, 59, .10);
  --warn: #774d08; --warn-soft: rgba(176, 118, 20, .12);
  --glass: rgba(255, 255, 255, .56);
  --glass-strong: rgba(255, 255, 255, .80);
  --glass-solid: #fbfbfd;
  --glass-border: rgba(255, 255, 255, .78);
  --glass-edge: rgba(22, 20, 29, .07);
  --hairline: rgba(22, 20, 29, .09);
  --field: rgba(255, 255, 255, .72);
  --field-border: rgba(22, 20, 29, .14);
  --shine: linear-gradient(135deg, rgba(255, 255, 255, .85) 0%, rgba(255, 255, 255, 0) 42%);
  --shadow: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 18px 40px -22px rgba(42, 30, 92, .38), 0 2px 6px -2px rgba(42, 30, 92, .10);
  --shadow-lift: 0 1px 0 rgba(255, 255, 255, .7) inset, 0 26px 50px -24px rgba(42, 30, 92, .45);
  --blur: 20px;
  --r-xl: 28px; --r-l: 22px; --r-m: 16px; --r-s: 12px; --pill: 999px;
  --sidebar: 268px;
  --maxw: 1240px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display", "Segoe UI", Inter, Roboto, sans-serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}
[data-theme="dark"] {
  color-scheme: dark;
  --bg: #050409;
  --bg-2: #0b0a11;
  --blob-1: rgba(96, 80, 220, .22);
  --blob-2: rgba(150, 40, 92, .20);
  --blob-3: rgba(30, 110, 130, .14);
  --text: #eeecf4;
  --text-2: #c3bfd1;
  --text-3: #9d98ae;
  --accent: #e08bb3;
  --accent-hover: #ec9fc3;
  --accent-ink: #1c0b14;
  --accent-soft: rgba(224, 139, 179, .14);
  --violet: #a79fff;
  --violet-soft: rgba(167, 159, 255, .13);
  --ok: #6fd3ac; --ok-soft: rgba(111, 211, 172, .12);
  --err: #ff8c9e; --err-soft: rgba(255, 140, 158, .12);
  --warn: #f0c070; --warn-soft: rgba(240, 192, 112, .12);
  --glass: rgba(26, 24, 36, .54);
  --glass-strong: rgba(32, 29, 44, .82);
  --glass-solid: #15131d;
  --glass-border: rgba(255, 255, 255, .09);
  --glass-edge: rgba(0, 0, 0, .5);
  --hairline: rgba(255, 255, 255, .08);
  --field: rgba(10, 9, 15, .55);
  --field-border: rgba(255, 255, 255, .14);
  --shine: linear-gradient(135deg, rgba(255, 255, 255, .10) 0%, rgba(255, 255, 255, 0) 40%);
  --shadow: 0 1px 0 rgba(255, 255, 255, .06) inset, 0 20px 44px -24px rgba(0, 0, 0, .9);
  --shadow-lift: 0 1px 0 rgba(255, 255, 255, .08) inset, 0 28px 54px -24px rgba(0, 0, 0, .95);
}
/* Transparence reduite (preference utilisateur) ou flou non supporte */
[data-transparency="reduced"] { --glass: var(--glass-solid); --glass-strong: var(--glass-solid); --blur: 0px; }
@supports not ((backdrop-filter: blur(2px)) or (-webkit-backdrop-filter: blur(2px))) {
  :root { --glass: var(--glass-solid); --glass-strong: var(--glass-solid); }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: var(--font); font-size: 16px; line-height: 1.55; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; overflow-x: hidden; overflow-wrap: break-word;
  transition: background-color .35s var(--ease), color .35s var(--ease);
}
img, svg { display: block; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
h1, h2, h3, h4 { font-family: var(--font-display); line-height: 1.18; margin: 0; letter-spacing: -.02em; }
h1 { font-size: clamp(1.7rem, 1.25rem + 1.8vw, 2.45rem); font-weight: 700; }
h2 { font-size: clamp(1.25rem, 1.08rem + .7vw, 1.55rem); font-weight: 680; }
h3 { font-size: 1.06rem; font-weight: 650; letter-spacing: -.01em; }
p { margin: 0 0 .8em; }
sub, sup { font-size: .72em; line-height: 0; }
.muted { color: var(--text-3); }
.small { font-size: .875rem; }
.num { font-variant-numeric: tabular-nums; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2.5px solid var(--violet); outline-offset: 2px; border-radius: 8px; }

/* -------------------------------------------------------- fond vivant */
.bg { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: radial-gradient(120% 90% at 10% 0%, var(--bg-2) 0%, var(--bg) 60%); }
.blob { position: absolute; border-radius: 50%; filter: blur(60px); opacity: 1; }
.b1 { width: 52vmax; height: 52vmax; left: -14vmax; top: -18vmax; background: var(--blob-1); }
.b2 { width: 44vmax; height: 44vmax; right: -16vmax; top: 8vmax; background: var(--blob-2); }
.b3 { width: 40vmax; height: 40vmax; left: 18vmax; bottom: -22vmax; background: var(--blob-3); }

/* -------------------------------------------------------------- verre */
.glass {
  position: relative; background: var(--glass); border: 1px solid var(--glass-border);
  -webkit-backdrop-filter: blur(var(--blur)) saturate(170%); backdrop-filter: blur(var(--blur)) saturate(170%);
  box-shadow: var(--shadow); border-radius: var(--r-l);
}
.glass::before { content: ""; position: absolute; inset: 0; border-radius: inherit; background: var(--shine); pointer-events: none; opacity: .75; }
.glass > * { position: relative; }

/* ------------------------------------------------------------- squelette */
.skip { position: absolute; left: 12px; top: -60px; z-index: 50; background: var(--accent); color: var(--accent-ink); padding: 10px 16px; border-radius: var(--pill); font-weight: 600; text-decoration: none; }
.skip:focus { top: calc(10px + var(--safe-t)); }
.shell { min-height: 100vh; min-height: 100dvh; }
.topbar {
  position: sticky; top: calc(8px + var(--safe-t)); z-index: 20; margin: calc(8px + var(--safe-t)) calc(10px + var(--safe-r)) 0 calc(10px + var(--safe-l));
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; border-radius: var(--pill);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); min-width: 0; }
.brand-mark { width: 32px; height: 32px; flex: 0 0 32px; }
.brand-name { font-family: var(--font-display); font-weight: 700; letter-spacing: -.02em; font-size: 1.06rem; white-space: nowrap; }
.brand-name span { color: var(--accent); font-weight: 700; }
.topbar .spacer { flex: 1; }
main { padding: 18px calc(14px + var(--safe-r)) calc(118px + var(--safe-b)) calc(14px + var(--safe-l)); outline: none; }
.view { max-width: var(--maxw); margin: 0 auto; }
.view-enter { animation: enter .38s var(--ease) both; }
@keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* barre d'onglets flottante (mobile, tablette) */
.tabbar {
  position: fixed; z-index: 30; left: calc(10px + var(--safe-l)); right: calc(10px + var(--safe-r)); bottom: calc(10px + var(--safe-b));
  display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px; border-radius: 26px; max-width: 640px; margin: 0 auto;
  background: var(--glass-strong);
}
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border-radius: 20px; text-decoration: none; color: var(--text-3); font-size: .68rem; font-weight: 600; letter-spacing: .01em; transition: background-color .2s var(--ease), color .2s var(--ease); }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
@media (max-width: 359px) { .tab span { display: none; } .tab { min-height: 48px; } }

/* barre laterale (ordinateur) */
.sidebar { display: none; }
@media (min-width: 1024px) {
  .topbar, .tabbar { display: none; }
  .shell { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); }
  .sidebar {
    display: flex; flex-direction: column; gap: 6px; position: sticky; top: 14px; height: calc(100vh - 28px); margin: 14px 0 14px 14px; padding: 18px 14px; border-radius: var(--r-xl); overflow-y: auto;
  }
  .sidebar .brand { padding: 4px 8px 18px; }
  .side-link { display: flex; align-items: center; gap: 12px; padding: 11px 12px; border-radius: 14px; color: var(--text-2); text-decoration: none; font-weight: 560; transition: background-color .2s var(--ease), color .2s var(--ease); }
  .side-link svg { width: 20px; height: 20px; flex: 0 0 20px; }
  .side-link:hover { background: var(--hairline); color: var(--text); }
  .side-link[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  .side-foot { margin-top: auto; display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--hairline); }
  main { padding: 26px 32px 48px 26px; }
}

/* ----------------------------------------------------------- boutons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 18px; border-radius: var(--pill);
  border: 1px solid transparent; font-weight: 620; font-size: .95rem; cursor: pointer; text-decoration: none; line-height: 1.2;
  transition: background-color .2s var(--ease), border-color .2s var(--ease), transform .15s var(--ease), color .2s var(--ease);
}
.btn svg { width: 18px; height: 18px; flex: 0 0 18px; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--accent); color: var(--accent-ink); box-shadow: 0 10px 24px -14px var(--accent); }
.btn-primary:hover { background: var(--accent-hover); }
.btn-ghost { background: var(--field); border-color: var(--field-border); color: var(--text); }
.btn-ghost:hover { border-color: var(--accent); }
.btn-quiet { background: transparent; color: var(--text-2); padding-inline: 12px; }
.btn-quiet:hover { background: var(--hairline); }
.btn-danger { background: var(--err-soft); color: var(--err); border-color: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { width: 44px; height: 44px; min-height: 44px; padding: 0; border-radius: 50%; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* theme */
.theme-btn .moon { display: none; }
[data-theme="dark"] .theme-btn .sun { display: none; }
[data-theme="dark"] .theme-btn .moon { display: block; }

/* -------------------------------------------------------- entetes de vue */
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px; margin: 6px 4px 20px; }
.page-head p { margin: 6px 0 0; color: var(--text-2); max-width: 64ch; }
.crumb { display: inline-flex; align-items: center; gap: 6px; color: var(--text-3); text-decoration: none; font-size: .9rem; margin-bottom: 8px; }
.crumb:hover { color: var(--accent); }
.crumb svg { width: 16px; height: 16px; }

/* ----------------------------------------------------------- grilles */
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.grid-2, .grid-3, .grid-4 { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 640px) { .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid-3, .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.card { padding: 18px; border-radius: var(--r-l); }
@media (min-width: 768px) { .card { padding: 22px; } }
.card h2 + p, .card h3 + p { margin-top: 6px; }
.stack > * + * { margin-top: 14px; }

/* ----------------------------------------------------------- tableau de bord */
.hero { display: grid; gap: 16px; padding: 22px; border-radius: var(--r-xl); }
@media (min-width: 768px) { .hero { grid-template-columns: auto 1fr; align-items: center; padding: 28px; gap: 28px; } }
.ring { width: 132px; height: 132px; position: relative; }
.ring svg { width: 132px; height: 132px; transform: rotate(-90deg); }
.ring .track { stroke: var(--hairline); }
.ring .bar { stroke: url(#ringGrad); stroke-linecap: round; transition: stroke-dashoffset .9s var(--ease); }
.ring-label { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring-label b { font-family: var(--font-display); font-size: 2rem; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ring-label small { color: var(--text-3); font-size: .74rem; }
.stat { padding: 16px 18px; border-radius: var(--r-m); }
.stat b { display: block; font-family: var(--font-display); font-size: 1.7rem; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.stat span { color: var(--text-3); font-size: .86rem; }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.hero > * { min-width: 0; }
@media (min-width: 1100px) { .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.reco { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--hairline); }
.reco:first-of-type { border-top: 0; }
.reco .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 7px; flex: 0 0 10px; }
.empty { padding: 14px; border-radius: var(--r-m); background: var(--hairline); color: var(--text-2); }

/* tuiles de calculateurs */
.tiles { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 359px) { .tiles { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 640px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1100px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.tile { display: flex; flex-direction: column; gap: 10px; padding: 14px; min-height: 112px; border-radius: var(--r-m); text-decoration: none; color: var(--text); transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
.tile:hover { transform: translateY(-2px); box-shadow: var(--shadow-lift); }
.tile .ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.tile .ic svg { width: 21px; height: 21px; }
.tile strong { font-size: .95rem; line-height: 1.25; }
.tile small { color: var(--text-3); font-size: .8rem; line-height: 1.35; }

/* ----------------------------------------------------------------- cours */
.chap { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r-m); text-decoration: none; color: var(--text); }
.chap .no { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-weight: 700; font-family: var(--font-display); background: var(--violet-soft); color: var(--violet); font-variant-numeric: tabular-nums; }
.chap small { display: block; color: var(--text-3); }
.meter { display: block; height: 6px; border-radius: 6px; background: var(--hairline); overflow: hidden; margin-top: 8px; }
.meter i { display: block; height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--violet), var(--accent)); }
.badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: var(--pill); font-size: .78rem; font-weight: 650; background: var(--hairline); color: var(--text-2); white-space: nowrap; }
.badge.ok { background: var(--ok-soft); color: var(--ok); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge svg { width: 14px; height: 14px; }
details.notion { border-radius: var(--r-l); }
details.notion > summary { list-style: none; cursor: pointer; padding: 18px 52px 18px 18px; position: relative; display: flex; gap: 12px; align-items: baseline; }
details.notion > summary::-webkit-details-marker { display: none; }
details.notion > summary::after { content: ""; position: absolute; right: 22px; top: 50%; width: 10px; height: 10px; border-right: 2px solid var(--text-3); border-bottom: 2px solid var(--text-3); transform: translateY(-70%) rotate(45deg); transition: transform .25s var(--ease); }
details.notion[open] > summary::after { transform: translateY(-30%) rotate(-135deg); }
details.notion .code { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.notion-body { padding: 0 18px 20px; display: grid; gap: 14px; }
@media (min-width: 768px) { .notion-body { padding: 0 24px 24px; } }
.lbl { font-size: .8rem; font-weight: 700; color: var(--accent); margin: 0 0 4px; letter-spacing: .01em; }
.formula { padding: 14px 16px; border-radius: var(--r-m); background: var(--violet-soft); border: 1px solid var(--hairline); display: grid; gap: 6px; }
.formula div { font-size: 1.06rem; font-weight: 560; text-align: center; overflow-wrap: anywhere; }
.box { padding: 14px 16px; border-radius: var(--r-m); border-left: 3px solid; }
.box.ex { background: var(--ok-soft); border-color: var(--ok); }
.box.err { background: var(--err-soft); border-color: var(--err); }
.box.chk { background: var(--violet-soft); border-color: var(--violet); }
.box.warn { background: var(--warn-soft); border-color: var(--warn); }
.box ol, .box ul { margin: 6px 0 0; padding-left: 1.25em; }
.box li + li { margin-top: 4px; }
.prose ol, .prose ul { margin: 4px 0 0; padding-left: 1.25em; }

/* ------------------------------------------------------------ tableaux */
.table-wrap { overflow-x: auto; border-radius: var(--r-m); border: 1px solid var(--hairline); -webkit-overflow-scrolling: touch; max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--hairline); vertical-align: top; }
th { font-size: .8rem; color: var(--text-2); font-weight: 680; background: var(--hairline); }
tr:last-child td { border-bottom: 0; }
/* tableau de resultats empile sur petit ecran */
@media (max-width: 599px) {
  .rtable thead { display: none; }
  .rtable, .rtable tbody, .rtable tr, .rtable td { display: block; width: 100%; }
  .rtable tr { padding: 10px 12px; border-bottom: 1px solid var(--hairline); }
  .rtable td { border: 0; padding: 3px 0; display: flex; justify-content: space-between; gap: 12px; }
  .rtable td::before { content: attr(data-label); color: var(--text-3); font-size: .8rem; flex: 0 0 auto; max-width: 52%; }
  .rtable td:first-child { font-weight: 650; }
  .rtable td:first-child::before { content: none; }
  .rtable td > span { text-align: right; }
}

/* --------------------------------------------------------- formulaires */
.form { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.form > *, .field, .control { min-width: 0; }
.field label, .field .flabel { display: block; font-size: .88rem; font-weight: 620; color: var(--text-2); margin-bottom: 6px; }
.control { display: flex; align-items: stretch; min-height: 48px; border-radius: 14px; background: var(--field); border: 1px solid var(--field-border); transition: border-color .2s var(--ease), box-shadow .2s var(--ease); overflow: hidden; }
.control:focus-within { border-color: var(--violet); box-shadow: 0 0 0 4px var(--violet-soft); }
.control input, .control select { flex: 1 1 auto; min-width: 0; border: 0; background: transparent; padding: 11px 14px; font-size: 16px; outline: none; font-variant-numeric: tabular-nums; }
.control input:disabled { color: var(--text-3); }
.control .unit { display: flex; align-items: center; padding: 0 14px; color: var(--text-3); font-size: .9rem; border-left: 1px solid var(--hairline); white-space: nowrap; }
.control select.unit-sel { flex: 0 0 auto; max-width: 46%; border-left: 1px solid var(--hairline); padding: 0 30px 0 12px; color: var(--text-2); font-size: .92rem; cursor: pointer; appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.control select:not(.unit-sel) { appearance: none; -webkit-appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%); background-position: calc(100% - 19px) 52%, calc(100% - 14px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
select option { background: var(--glass-solid); color: var(--text); }
.field.is-unknown .control { border-style: dashed; background: transparent; }
.field.is-unknown label::after { content: " (calculé)"; color: var(--accent); font-weight: 600; }
.hint { font-size: .8rem; color: var(--text-3); margin-top: 5px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; border-radius: 22px; background: var(--hairline); width: fit-content; max-width: 100%; }
.seg button { border: 0; background: transparent; border-radius: var(--pill); padding: 8px 14px; min-height: 38px; font-weight: 600; font-size: .88rem; color: var(--text-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--glass-strong); color: var(--text); box-shadow: 0 4px 14px -8px rgba(0, 0, 0, .4); }
.check { display: inline-flex; align-items: center; gap: 8px; font-size: .9rem; color: var(--text-2); cursor: pointer; min-height: 44px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }

/* ----------------------------------------------------------- calculateur */
.calc-layout { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.calc-layout > * { min-width: 0; }
@media (min-width: 900px) { .calc-layout:not(.calc-wide) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.08fr); align-items: start; } .calc-layout:not(.calc-wide) .calc-out { position: sticky; top: 20px; } }
.lens {
  position: relative; overflow: hidden; border-radius: var(--r-xl); padding: 22px 22px 20px; min-height: 150px;
  background: radial-gradient(130% 120% at 0% 0%, var(--accent-soft) 0%, transparent 55%), radial-gradient(120% 120% at 100% 100%, var(--violet-soft) 0%, transparent 60%), var(--glass-strong);
}
.lens::after { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(255, 255, 255, .55), rgba(255, 255, 255, 0) 65%); opacity: .5; pointer-events: none; }
[data-theme="dark"] .lens::after { opacity: .12; }
.lens .k { font-size: .86rem; color: var(--text-2); font-weight: 600; }
.lens .v { font-family: var(--font-display); font-size: clamp(2rem, 1.5rem + 2.6vw, 3.1rem); font-weight: 680; letter-spacing: -.035em; line-height: 1.08; margin: 6px 0 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.lens .v .u { font-size: .42em; font-weight: 600; color: var(--text-2); letter-spacing: 0; margin-left: .35em; }
.lens .v sup { font-size: .5em; }
.sec-results { display: grid; gap: 8px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin-top: 14px; }
.sec-results div { padding: 10px 12px; border-radius: 14px; background: var(--hairline); }
.sec-results span { display: block; font-size: .76rem; color: var(--text-3); }
.sec-results b { font-variant-numeric: tabular-nums; font-size: 1rem; overflow-wrap: anywhere; }
.lens.is-error { background: var(--err-soft); }
.lens.is-error .v { font-size: 1.15rem; letter-spacing: 0; font-weight: 600; color: var(--err); }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.steps li::marker { color: var(--accent); font-weight: 700; }
.msg { display: flex; gap: 10px; padding: 11px 14px; border-radius: 14px; font-size: .9rem; }
.msg svg { width: 18px; height: 18px; flex: 0 0 18px; margin-top: 2px; }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.msg.note { background: var(--hairline); color: var(--text-2); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.err { background: var(--err-soft); color: var(--err); }
.viz { padding: 10px 4px 0; }
.viz svg { width: 100%; height: auto; }

/* PCR */
.pcr-rows { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.pcr-row > * { min-width: 0; }
.pcr-row { display: grid; gap: 8px; padding: 12px; border-radius: var(--r-m); background: var(--hairline); grid-template-columns: minmax(0, 1fr); }
@media (min-width: 520px) { .pcr-row { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.pcr-row .full { grid-column: 1 / -1; }
.pcr-row .control { min-height: 44px; }
.pcr-row .mini-label { font-size: .74rem; color: var(--text-3); margin-bottom: 3px; display: block; }
@media (min-width: 1100px) {
  .calc-wide .pcr-row { grid-template-columns: 1.6fr 1.1fr 1.15fr 1.15fr auto auto; align-items: end; }
  .calc-wide .pcr-row .full { grid-column: auto; }
}

/* -------------------------------------------------------- exercices */
.q-card { padding: 20px; border-radius: var(--r-xl); }
.q-text { font-size: 1.08rem; line-height: 1.55; }
.answer-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; }
.answer-row .control { flex: 1 1 220px; }
.feedback { padding: 14px 16px; border-radius: var(--r-m); display: grid; gap: 8px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.ko { background: var(--err-soft); }
.feedback h3 { display: flex; align-items: center; gap: 8px; }
.feedback.ok h3 { color: var(--ok); } .feedback.ko h3 { color: var(--err); }
.feedback h3 svg { width: 20px; height: 20px; }
.exam-q { padding: 16px; border-radius: var(--r-m); background: var(--hairline); display: grid; gap: 10px; }
.exam-q .qn { font-weight: 700; color: var(--accent); font-variant-numeric: tabular-nums; }
.exam-q.ok { background: var(--ok-soft); } .exam-q.ko { background: var(--err-soft); }
.score { font-family: var(--font-display); font-size: clamp(2.6rem, 2rem + 3vw, 4rem); font-weight: 700; letter-spacing: -.04em; font-variant-numeric: tabular-nums; line-height: 1; }
.score small { font-size: .4em; color: var(--text-3); letter-spacing: 0; }

.exam-bar { position: sticky; bottom: calc(86px + var(--safe-b)); z-index: 5; background: var(--glass-strong); }
@media (min-width: 1024px) { .exam-bar { bottom: 16px; } }

/* formules */
.search { max-width: 520px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--field-border); background: var(--field); color: var(--text-2); border-radius: var(--pill); padding: 8px 14px; min-height: 40px; font-weight: 600; font-size: .86rem; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fcard { padding: 16px 18px; border-radius: var(--r-m); display: grid; gap: 8px; align-content: start; }
.fcard .badge { justify-self: start; }
.fcard .fx { font-size: 1.08rem; font-weight: 600; overflow-wrap: anywhere; }
.fcard dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0; font-size: .88rem; }
.fcard dt { color: var(--text-3); }
.fcard dd { margin: 0; color: var(--text-2); overflow-wrap: anywhere; }

/* toast, dialogue */
.toast { position: fixed; left: 50%; bottom: calc(96px + var(--safe-b)); transform: translateX(-50%) translateY(20px); opacity: 0; z-index: 60; padding: 12px 18px; border-radius: var(--pill); background: var(--glass-strong); pointer-events: none; transition: opacity .25s var(--ease), transform .25s var(--ease); font-weight: 600; max-width: calc(100vw - 32px); text-align: center; }

@media (min-width: 1024px) { .toast { bottom: 28px; } }
dialog { border: 0; padding: 0; background: transparent; color: var(--text); max-width: min(440px, calc(100vw - 28px)); }
dialog::backdrop { background: rgba(5, 4, 9, .45); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
dialog .card { background: var(--glass-solid); }
.storage-banner { margin: 0 auto 14px; max-width: var(--maxw); }

/* mouvement reduit */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}
@media print {
  .bg, .tabbar, .topbar, .sidebar, .btn-row { display: none !important; }
  .glass { background: #fff !important; box-shadow: none !important; border: 1px solid #ddd !important; }
}

/* ===== v3 : dark Apple AMOLED, unites colorees, animations ===== */
html[data-theme="dark"] { color-scheme: dark; --bg:#000; --bg-2:#0b0b0d; --blob-1:rgba(120,120,255,.10); --blob-2:rgba(255,255,255,.04); --blob-3:rgba(120,120,128,.10);
  --text:#f5f5f7; --text-2:#c7c7cc; --text-3:#8e8e93; --accent:#ff6b9a; --accent-hover:#ff86ac; --accent-ink:#000; --accent-soft:rgba(255,107,154,.14);
  --violet:#7d7aff; --violet-soft:rgba(125,122,255,.18); --ok:#30d158; --ok-soft:rgba(48,209,88,.14); --err:#ff453a; --err-soft:rgba(255,69,58,.14); --warn:#ffd60a; --warn-soft:rgba(255,214,10,.10);
  --glass:rgba(28,28,30,.72); --glass-strong:rgba(44,44,46,.82); --glass-solid:#1c1c1e; --glass-border:rgba(255,255,255,.07); --glass-edge:rgba(255,255,255,.06); --hairline:rgba(255,255,255,.09);
  --field:rgba(44,44,46,.75); --field-border:rgba(255,255,255,.14); --shine:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,0) 40%);
  --shadow:0 0 0 .5px rgba(255,255,255,.07) inset,0 18px 40px -24px #000; --shadow-lift:0 0 0 .5px rgba(255,255,255,.1) inset,0 26px 50px -24px #000; }

:root { --u-m:#0a62c9; --u-v:#0a7f78; --u-k:#6b3fd1; --u-o:#c25a00; --u-p:#c2185b; --u-c:#2e7d32; --u-n:var(--text-2); }
html[data-theme="dark"] { --u-m:#64b5ff; --u-v:#5ee6d8; --u-k:#b69cff; --u-o:#ffa24d; --u-p:#ff7aa8; --u-c:#6ee07a; }
.u { font-weight: 650; color: var(--uc, inherit); white-space: nowrap; }
.u-m { --uc: var(--u-m); } .u-v { --uc: var(--u-v); } .u-k { --uc: var(--u-k); } .u-o { --uc: var(--u-o); } .u-p { --uc: var(--u-p); } .u-c { --uc: var(--u-c); } .u-n { --uc: var(--u-n); }
.q2-unit, .u-pill { color: var(--uc, var(--text-2)); background: color-mix(in srgb, var(--uc, var(--text-2)) 16%, transparent); }
.u-pill { padding: 6px 14px; border-radius: 99px; font-weight: 700; font-size: 1rem; }
.ex-lvl { grid-template-columns: repeat(5, 1fr); } .ex-lvl button { font-size: .76rem; padding-inline: 2px; }
.ex-lvl button[data-lvl="4"] b { color: var(--warn); }
.q2-reroll { justify-self: start; }
.trap-badge { display: inline-block; margin-left: 6px; padding: 2px 9px; border-radius: 99px; background: var(--warn-soft); color: var(--warn); font-size: .75rem; font-weight: 700; }
html:not([data-theme="dark"]) .trap-badge, html:not([data-theme="dark"]) .sol-box.trap .tag { color: #8a5a00; }
.sol-val { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; padding: 22px 12px; border-radius: 26px; background: var(--glass-strong); box-shadow: var(--shadow); animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
.sol-val .lab { flex-basis: 100%; text-align: center; font-size: .75rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.sol-val .num { font: 700 clamp(2.2rem, 9vw, 3.4rem)/1 var(--font-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
@keyframes pop { 0% { opacity: 0; transform: scale(.7); } 100% { opacity: 1; transform: none; } }
.sol > * { animation: solIn .45s var(--ease) both; } .sol > :nth-child(2) { animation-name: pop; } .sol > :nth-child(3) { animation-delay: .15s; } .sol > :nth-child(4) { animation-delay: .28s; } .sol > :nth-child(5) { animation-delay: .4s; } .sol > :nth-child(6) { animation-delay: .5s; } .sol > :nth-child(7) { animation-delay: .6s; }

@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
.sol-head { position: relative; }

.burst i { position: absolute; width: 8px; height: 8px; border-radius: 50%; background: hsl(calc(var(--n) * 36) 90% 60%); animation: burst .9s ease-out forwards; }
@keyframes burst { from { transform: rotate(var(--a)) translateY(0); opacity: 1; } to { transform: rotate(var(--a)) translateY(-70px) scale(.4); opacity: 0; } }
.sol-box.trap { background: var(--warn-soft); } .sol-box.trap .tag { color: var(--warn); } .sol-box.trap p { margin: 0; line-height: 1.5; }
.q2-actions .btn:active, .ex-chip:active { transform: scale(.96); }

/* =====================================================================
   Calculs Coach : design « Réglages iOS » (groupes blancs / noirs, capsules,
   barre d'onglets en verre avec lentille, accent différent par section)
   ===================================================================== */
:root{--c-blue:#007aff;--c-indigo:#5856d6;--c-purple:#af52de;--c-pink:#ff2d55;--c-orange:#ff9500;--c-green:#34c759;--c-teal:#30b0c7;--c-cyan:#32ade6;--c-mint:#00c7be;

--bg:#f2f2f7;--bg-2:#f2f2f7;--blob-1:rgba(10,132,255,.45);--blob-2:rgba(94,92,230,.25);--blob-3:rgba(142,142,147,.2);
--text:#000;--text-2:#6c6c70;--text-3:#8a8a8e;--hairline:rgba(60,60,67,.14);--field:transparent;--field-border:rgba(60,60,67,.3);

--r-xl:26px;--r-l:22px;--r-m:18px;--maxw:1120px;--blur:22px;--spring:cubic-bezier(.34,1.45,.64,1);--ease:cubic-bezier(.22,1,.36,1)}

--accent:var(--c-blue);--brand:#4da3ff;--grp:#1c1c1e;--fill:#2c2c2e;--thumb:#636366;--bg:#000;--bg-2:#000;
--text:#fff;--text-2:#a1a1a6;--text-3:#8e8e93;--hairline:rgba(120,120,128,.26);--field-border:rgba(235,235,245,.26);
--glass:rgba(28,28,30,.66);--glass-strong:rgba(44,44,46,.88);--glass-solid:#1c1c1e;

/* en-tête : logo à gauche, outils en capsule de verre à droite */
.topbar{position:fixed;top:0;left:0;right:0;z-index:20;margin:0;padding:calc(12px + var(--safe-t)) calc(14px + var(--safe-r)) 0 calc(14px + var(--safe-l));display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none;animation:drop .7s var(--ease)}

.logo{font-size:clamp(1.45rem,6.4vw,1.9rem);font-weight:800;letter-spacing:-.6px;line-height:1;white-space:nowrap;color:var(--text)}

.sub{display:none;margin-top:4px;font-size:.8rem;font-weight:600;color:var(--text-2)}
.tools{pointer-events:auto;height:48px;padding:0 4px;border-radius:999px;display:flex;align-items:center;gap:2px}
.tb{width:40px;height:40px;padding:0;border:0;border-radius:50%;background:none;color:var(--text);display:grid;place-items:center;cursor:pointer;text-decoration:none;transition:transform .35s var(--spring),background .3s}
.tb svg{width:20px;height:20px}
.tb:active{transform:scale(.86);background:var(--fill)}
@media(hover:hover){.tb:hover{background:var(--fill)}}
.tb[aria-current="page"]{color:var(--acc-tx);background:var(--fill)}
.theme-btn .sun{display:none}.theme-btn .moon{display:block}
html[data-theme="dark"] .theme-btn .sun{display:block}html[data-theme="dark"] .theme-btn .moon{display:none}
.shell{display:block}
main{padding:calc(78px + var(--safe-t)) calc(14px + var(--safe-r)) calc(116px + var(--safe-b)) calc(14px + var(--safe-l))}
@media(min-width:600px){main{padding-inline:24px;padding-top:calc(88px + var(--safe-t))}}

/* barre d'onglets : capsule de verre, lentille qui glisse sous l'onglet actif */
.tabbar{position:fixed;z-index:30;left:12px;right:12px;bottom:max(12px,var(--safe-b));max-width:440px;height:60px;margin-inline:auto;padding:5px;display:grid;grid-template-columns:repeat(4,1fr);border-radius:999px;background:var(--glass);animation:navin .8s var(--ease) backwards .2s}
@keyframes navin{from{opacity:0;translate:0 40px;scale:.94}}
.tabbar .sl{position:absolute;top:5px;bottom:5px;left:0;width:60px;z-index:1;border-radius:999px;pointer-events:none;opacity:0;translate:5px 0;background:rgba(120,120,128,.16);border:1px solid rgba(255,255,255,.7);box-shadow:inset 0 1px 1px rgba(255,255,255,.5),0 4px 14px rgba(0,0,0,.14);transition:translate .6s var(--spring),width .3s var(--ease),opacity .3s}

.tab{position:relative;z-index:2;min-height:0;border-radius:999px;gap:2px;font-size:.64rem;font-weight:500;color:var(--text-2);background:none!important;transition:color .3s,transform .45s var(--spring)}
.tab:active{transform:scale(.92)}
.tab svg{width:20px;height:20px;color:var(--nc);opacity:.75;transition:opacity .3s}
.tab[aria-current="page"]{color:var(--acc-tx);font-weight:600}

@media(max-width:389px){.tab{font-size:.58rem}}

.topbar{padding:16px 32px 0}
.sub{display:block}
.tabbar{display:grid;top:calc(var(--safe-t) + 14px);bottom:auto;left:0;right:0;width:min(720px,calc(100vw - 480px));max-width:none;height:56px;animation-name:navin-d}
@keyframes navin-d{from{opacity:0;translate:0 -30px;scale:.94}}
.tab{flex-direction:row;gap:8px;font-size:.78rem}
.shell{display:block}
main{padding:calc(96px + var(--safe-t)) 32px 56px}}
@media(min-width:1024px) and (max-width:1279px){.sub{display:none}.tab{flex-direction:column;gap:2px;font-size:.68rem}}

/* surfaces : groupes pleins façon Réglages (le verre reste pour les barres et menus) */
main .glass{background:var(--grp);-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:none;border:0}
main .glass::before{display:none}
.tile:hover{box-shadow:var(--shadow-lift)}
.page-head{margin:4px 4px 22px}
.ex-eyebrow{margin:22px 16px 7px;font-size:13px;font-weight:600;letter-spacing:.4px;color:var(--text-2)}
.lbl,.chap small b,details.notion .code,.exam-q .qn{color:var(--acc-tx)}
.tile .ic{color:var(--acc-tx)}
.chap .no{background:var(--accent-soft);color:var(--acc-tx)}
.meter i,.ex-prog i{background:var(--accent)}
.ring .bar{stroke:var(--accent)}
.steps li::marker{color:var(--acc-tx)}
.badge{background:var(--fill)}

/* champs : capsules bordées, unités en capsules grises */
.control{min-height:48px;border-radius:999px;background:transparent;border:1.5px solid var(--field-border)}
.control:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.control input,.control select{padding:11px 18px;font-weight:600}
.control select.unit-sel{margin:4px;border:0;border-radius:999px;background-color:var(--fill);padding:0 30px 0 14px;font-weight:600}
.control .unit{border-left:0;margin:4px;padding:0 14px;border-radius:999px;background:var(--fill);font-weight:600}
.field.is-unknown .control{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
.field.is-unknown label::after{color:var(--acc-tx)}
.seg{border-radius:999px;background:var(--fill)}
.seg button[aria-pressed="true"]{background:var(--thumb);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.chip{background:var(--grp);border-color:transparent}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.btn{font-weight:650}
.btn-primary{box-shadow:none}
.btn-ghost{background:var(--fill);border-color:transparent}
.btn-ghost:hover{border-color:var(--accent)}
.ex-chip{background:var(--grp);box-shadow:none}
.ex-chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.ex-lvl{background:var(--fill)}
.ex-lvl button[aria-pressed="true"]{background:var(--thumb);box-shadow:0 2px 6px rgba(0,0,0,.18)}
.ex-lvl b{color:var(--acc-tx)}
.q2-bubble{background:var(--accent);color:var(--accent-ink)}
.q2-input{background:transparent;border-width:1.5px}
.sol-box,.sol-val{background:var(--grp);box-shadow:none}

/* résultat : grand nombre, unité en capsule */
main .lens{text-align:center;padding:24px 18px 20px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 11%,transparent),transparent 75%),var(--grp)}
.lens::after{display:none}
.lens .k{font-size:.75rem;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--text-2)}
.lens .v{font-weight:800;letter-spacing:-1px}
.lens .v .u{display:inline-block;padding:3px 14px;border-radius:999px;background:var(--fill);color:var(--acc-tx);font-weight:700;vertical-align:middle}
.sec-results div{background:var(--fill)}
.toast{background:var(--glass)}
html[data-transparency="reduced"]{--glass:var(--glass-solid);--glass-strong:var(--glass-solid);--blur:0px}

/* ===== Menu en haut à droite (Cours, Formules) ===== */
.menu-btn.on{color:var(--acc-tx);background:var(--fill)}
.menu{position:fixed;z-index:25;top:calc(var(--safe-t) + 66px);right:calc(14px + var(--safe-r));min-width:210px;padding:6px;border-radius:24px;background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);box-shadow:var(--shadow);border:1px solid var(--glass-border);display:grid;gap:2px;transform-origin:top right;animation:menuin .35s var(--spring)}
@keyframes menuin{from{opacity:0;transform:scale(.88) translateY(-8px)}}
.mi{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;color:var(--text);text-decoration:none;font-weight:600}
.mi svg{width:20px;height:20px;color:var(--nc);flex:0 0 20px}
.mi:active{background:var(--fill)}
@media(hover:hover){.mi:hover{background:var(--fill)}}
.mi[aria-current="page"]{background:var(--accent-soft);color:var(--acc-tx)}
@media(min-width:1024px){.menu{top:calc(var(--safe-t) + 74px);right:32px}}

/* ===== Calculatrice flottante ===== */
:root{--lcd:#d6e4e2;--lcd-ink:#0d1414;--lcd-dim:rgba(13,20,20,.55);--cur:#e5372b}
html[data-theme="dark"]{--lcd:#1b2727;--lcd-ink:#e9f3f1;--lcd-dim:rgba(233,243,241,.55)}
.fab{position:fixed;z-index:35;right:calc(16px + var(--safe-r));bottom:calc(86px + var(--safe-b));width:56px;height:56px;border:0;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;box-shadow:0 10px 26px -8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .35s var(--spring),background .3s;animation:navin .8s var(--ease) backwards .4s;touch-action:manipulation}
.fab svg{width:26px;height:26px}
.fab:active{transform:scale(.88)}
body:has(.exam-bar) .fab{bottom:calc(160px + var(--safe-b))}
.cc{position:fixed;z-index:40;right:calc(12px + var(--safe-r));bottom:calc(84px + var(--safe-b));width:min(372px,calc(100vw - 24px - var(--safe-l) - var(--safe-r)));max-height:calc(100vh - 96px - var(--safe-t) - var(--safe-b));max-height:calc(100dvh - 96px - var(--safe-t) - var(--safe-b));overflow:auto;padding:10px;border-radius:30px;background:var(--glass-strong);-webkit-backdrop-filter:blur(var(--blur)) saturate(170%);backdrop-filter:blur(var(--blur)) saturate(170%);box-shadow:var(--shadow);border:1px solid var(--glass-border);display:flex;flex-direction:column;gap:10px;transform-origin:bottom right;animation:ccin .45s var(--spring)}
@keyframes ccin{from{opacity:0;transform:translateY(24px) scale(.94)}}
@media(min-width:1024px){.fab{right:24px;bottom:24px}body:has(.exam-bar) .fab{bottom:104px}.cc{right:24px;bottom:24px}}
.cc-lcd{position:relative;display:flex;flex-direction:column;min-height:136px;padding:10px 14px 8px;border-radius:22px;background:var(--lcd);color:var(--lcd-ink);box-shadow:inset 0 2px 7px rgba(0,0,0,.2)}
.cc-x{position:absolute;top:6px;right:6px;z-index:4;width:32px;height:32px;border:0;border-radius:50%;background:none;color:var(--lcd-dim);display:grid;place-items:center;cursor:pointer}
.cc-x svg{width:18px;height:18px}
.cc-expr{flex:1;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;white-space:nowrap;min-height:84px;padding:6px 30px 2px 0;font-size:2.05rem;line-height:1.25;cursor:text;scrollbar-width:none;font-variant-numeric:tabular-nums}
.cc-expr::-webkit-scrollbar{display:none}
.ce,.mfn,.mfd,.mp,.msa{display:inline-flex;align-items:center}
.ce{min-width:max-content}
.mc{display:inline-block}
.mo{margin:0 .2em}
.mf{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .1em;font-size:.92em}
.mfn{border-bottom:2px solid currentColor;padding:0 .18em .04em}
.mfd{padding:.04em .18em 0}
.mp{align-self:flex-start;font-size:.64em;margin:-.05em 0 0 .06em}
.mp .mo{margin:0 .06em}
.ms{display:inline-flex;align-items:stretch}
.msr{font-size:1.1em;padding-right:.04em}
.msa{border-top:2px solid currentColor;padding:0 .15em;margin-top:.22em}
.ph{display:inline-flex;align-items:center;justify-content:center;min-width:.72em;min-height:1.05em;border:1.5px dashed var(--lcd-dim);border-radius:3px;margin:0 .05em}
.cur{display:inline-block;width:2px;height:1.15em;margin:0 1px;background:var(--cur);animation:blink 1s steps(1) infinite;flex:none}
@keyframes blink{50%{opacity:0}}
.cc-foot{display:flex;align-items:flex-end;gap:6px;min-height:44px}
.cc-dots{width:34px;height:42px;border:0;border-radius:12px;background:none;color:var(--lcd-dim);display:grid;place-items:center;cursor:pointer;flex:none}
.cc-dots svg{width:16px;height:22px}
.cc-sci{border:1.5px solid var(--lcd-dim);background:none;color:var(--lcd-dim);border-radius:999px;font:700 .72rem var(--font);padding:3px 9px;margin-bottom:8px;cursor:pointer;flex:none}
.cc-sci[aria-pressed="true"]{background:var(--lcd-ink);color:var(--lcd);border-color:var(--lcd-ink)}
.cc-res{flex:1;min-width:0;border:0;background:none;color:var(--lcd-dim);font:600 1.3rem var(--font-display);font-variant-numeric:tabular-nums;text-align:right;overflow-x:auto;white-space:nowrap;cursor:pointer;padding:2px 4px;min-height:1.6em;scrollbar-width:none}
.cc-res::-webkit-scrollbar{display:none}
.cc-res.done{color:var(--lcd-ink);font-size:1.9rem;font-weight:700}
.cc-res.err{color:#c62828;font-size:1.05rem}
html[data-theme="dark"] .cc-res.err{color:#ff8a80}
.cc-res sup{font-size:.55em}
.cc-hist{position:absolute;inset:0;z-index:3;overflow:auto;padding:10px 10px 8px;border-radius:22px;background:var(--lcd);color:var(--lcd-ink);display:flex;flex-direction:column;gap:6px}
.cc-hist .hh{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--lcd-dim);margin:0 30px 2px 4px}
.hi{display:flex;flex-direction:column;align-items:flex-end;gap:2px;border:0;border-radius:14px;background:rgba(127,127,127,.12);color:inherit;padding:6px 10px;cursor:pointer;text-align:right;font-size:1.05rem;overflow-x:auto}
.hi .hr{font-weight:700;white-space:nowrap}
.hi sup{font-size:.6em}
.hclr{align-self:flex-start;border:0;background:none;color:var(--lcd-dim);font:600 .82rem var(--font);cursor:pointer;padding:6px 4px;text-decoration:underline}
.cc-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.ck{min-height:46px;border:0;border-radius:16px;background:var(--fill);color:var(--text);font:600 1.15rem var(--font);display:grid;place-items:center;cursor:pointer;touch-action:manipulation;transition:transform .2s var(--spring),background .2s;padding:0}
.ck:active{transform:scale(.9)}
.ck svg{width:20px;height:20px}
.ck sup{font-size:.62em;line-height:0}
.ck.num{background:var(--grp)}
.ck.fn{background:var(--accent-soft);color:var(--acc-tx);font-size:.95rem}
.ck.op{color:var(--acc-tx);font-size:1.35rem}
.ck.danger{color:var(--err);font-size:.95rem}
.ck.eq{background:var(--accent);color:var(--accent-ink);font-size:1.5rem}
.kfr{display:grid;gap:2px;width:15px}
.kfr i{display:block;height:7px;border:1.6px solid currentColor;border-radius:2px}
.kfr b{display:block;height:1.8px;background:currentColor}
.kbx{display:inline-block;width:.55em;height:.7em;border:1.5px solid currentColor;border-radius:2px;margin-left:2px;vertical-align:-.05em}

/* ===== Menu : interrupteur + lien BioStudy ===== */
.menu{min-width:250px;animation:menuin .16s ease-out}
@keyframes menuin{from{opacity:0;transform:translateY(-4px)}}
.mi{width:100%;border:0;background:none;font:inherit;font-weight:600;text-align:left;cursor:pointer}
.mi-t{display:flex;flex-direction:column;line-height:1.2}
.mi-t small{font-size:.76rem;font-weight:500;color:var(--text-3);margin-top:2px}
.mi-sep{height:1px;margin:4px 10px;background:var(--hairline)}
.mi .ext{margin-left:auto;width:16px;height:16px;flex:0 0 16px;color:var(--text-3)}
.mi .sw{margin-left:auto;position:relative;flex:0 0 40px;width:40px;height:24px;border-radius:999px;background:var(--fill);box-shadow:inset 0 0 0 1px var(--hairline);transition:background .18s ease}
.mi .sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s ease}
.mi[aria-checked="true"] .sw{background:var(--accent);box-shadow:none}
.mi[aria-checked="true"] .sw::after{transform:translateX(16px)}

/* ===== Calculatrice : style sobre et animations discrètes ===== */
.fab{animation:fabin .22s ease-out;transition:transform .12s ease,box-shadow .12s ease;box-shadow:0 6px 18px -6px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.12) inset}
@keyframes fabin{from{opacity:0;transform:scale(.9)}}
.fab:active{transform:scale(.94)}
.cc{animation:ccin .2s ease-out;padding:12px;gap:12px;border-radius:24px}
@keyframes ccin{from{opacity:0;transform:translateY(8px)}}
.cc-lcd{border-radius:16px;box-shadow:inset 0 1px 4px rgba(0,0,0,.22),0 0 0 1px rgba(0,0,0,.06)}
.cc-hist{border-radius:16px}
.cc-keys{gap:6px}
.ck{min-height:48px;border-radius:12px;font:500 1.3rem var(--font);font-variant-numeric:tabular-nums;letter-spacing:-.01em;background:var(--fill);color:var(--text);box-shadow:inset 0 -1px 0 rgba(0,0,0,.07);transition:background-color .1s ease,transform .08s ease,color .1s ease}
.ck:active{transform:scale(.97);filter:brightness(.92)}
@media(hover:hover){.ck:hover{filter:brightness(.97)}}
.ck.num{background:var(--grp);box-shadow:inset 0 0 0 1px var(--hairline)}
.ck.fn{background:var(--fill);color:var(--text-2);font:600 .88rem var(--font);letter-spacing:.01em}
.ck.op{background:var(--fill);color:var(--acc-tx);font:500 1.5rem var(--font)}
.ck.danger{background:var(--fill);color:var(--err);font:600 .9rem var(--font)}
.ck.eq{background:var(--accent);color:var(--accent-ink);font:500 1.6rem var(--font);box-shadow:none}
.ck svg{width:20px;height:20px;stroke-width:1.9}
.ck sup{font-size:.6em}
html[data-theme="dark"] .ck{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
html[data-theme="dark"] .ck.num{background:#3a3a3c;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
html[data-theme="dark"] .ck.fn,html[data-theme="dark"] .ck.op,html[data-theme="dark"] .ck.danger{background:#262628}
html[data-theme="dark"] .ck.eq{box-shadow:none}
.cc-sci{font-weight:600;letter-spacing:.03em}
.cc-res.done{animation:none}

/* ===== Touches façon calculatrice scientifique ===== */
.cc-keys{grid-template-columns:repeat(6,1fr);gap:6px}
.ck{min-height:46px}
.ck.wide{grid-column:1/-1;min-height:48px}
.ck.num{font-size:1.25rem}
.kx{display:inline-flex;align-items:flex-start;font-family:Georgia,'Times New Roman',serif;font-size:1.1rem;line-height:1;white-space:nowrap;font-weight:600}
.kx em{font-style:italic}
.kx sup{font-size:.65em;line-height:1;margin-left:1px}
.ksq{display:inline-block;width:.5em;height:.5em;background:currentColor;border-radius:1px;margin-left:2px;align-self:center}
.ksq.kup{width:.34em;height:.34em;align-self:flex-start;margin-top:-.05em}
.kfr{width:17px;gap:3px}
.kfr i{height:8px;border-width:1.8px;border-radius:2px}
.kfr b{height:1.8px}
</style>
</head>

      <button type="button" class="tb theme-btn" aria-label="Changer de thème"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17a8.5 8.5 0 0 0 0-17z" fill="currentColor" stroke="none"/></svg></button>

    </div>
