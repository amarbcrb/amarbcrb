<script>
/* =====================================================================
   Calculs Coach - noyau de calcul (JavaScript)
   Reprise fonction par fonction de core.py. Aucune evaluation de code dynamique.
   Conventions : masse en g, volume en L, concentration massique en g/L,
   concentration molaire en mol/L, sauf mention contraire.
   ===================================================================== */
(function (root) {
  'use strict';

  class LabError extends Error {
    constructor(msg) { super(msg); this.name = 'LabError'; }
  }

  // ------------------------------------------------------------ unites
  const MASS = { kg: 1e3, g: 1, mg: 1e-3, 'µg': 1e-6, ng: 1e-9, pg: 1e-12 };
  const VOL = { L: 1, mL: 1e-3, 'µL': 1e-6, nL: 1e-9 };
  const CMASS = { 'g/L': 1, 'mg/L': 1e-3, 'µg/L': 1e-6, 'mg/mL': 1, 'µg/mL': 1e-3, 'ng/mL': 1e-6, 'µg/µL': 1, 'ng/µL': 1e-3 };
  const CMOL = { M: 1, mM: 1e-3, 'µM': 1e-6, nM: 1e-9 };
  const TABLES = { masse: MASS, volume: VOL, 'concentration massique': CMASS, 'concentration molaire': CMOL };

  function kindOf(u) {
    for (const k in TABLES) if (Object.prototype.hasOwnProperty.call(TABLES[k], u)) return k;
    return null;
  }

  function isNum(x) { return typeof x === 'number' && Number.isFinite(x); }

  function pos(x, name, allowZero) {
    if (!isNum(x)) throw new LabError(`${name} : valeur manquante ou invalide.`);
    if (allowZero ? x < 0 : x <= 0) throw new LabError(`${name} doit être ${allowZero ? 'positif ou nul' : 'strictement positif'}.`);
    return x;
  }

  function convert(v, from, to) {
    const k1 = kindOf(from), k2 = kindOf(to);
    if (!k1 || k1 !== k2) throw new LabError(`Conversion impossible de ${from} vers ${to} : grandeurs de nature différente.`);
    if (!isNum(v)) throw new LabError('Valeur à convertir invalide.');
    return v * TABLES[k1][from] / TABLES[k1][to];
  }

  // -------------------------------------------- masses et concentrations
  const massFromConc = (c, v) => pos(c, 'Concentration') * pos(v, 'Volume');
  const concFromMass = (m, v) => pos(m, 'Masse') / pos(v, 'Volume');
  const volFromMass = (m, c) => pos(m, 'Masse') / pos(c, 'Concentration');
  const moles = (m, M) => pos(m, 'Masse') / pos(M, 'Masse molaire');
  function massFromMolar(c, v, M, purity) {
    if (purity === undefined) purity = 1;
    if (!(purity > 0 && purity <= 1)) throw new LabError('La pureté doit être comprise entre 0 et 100 %.');
    return pos(c, 'Concentration') * pos(v, 'Volume') * pos(M, 'Masse molaire') / purity;
  }
  const percentToGL = p => 10 * p;

  // ------------------------------------------------------------ dilution
  function c1v1(o) {
    const keys = ['C1', 'V1', 'C2', 'V2'];
    const unknown = keys.filter(k => o[k] === null || o[k] === undefined);
    if (unknown.length !== 1) throw new LabError('Laisser exactement une inconnue.');
    keys.forEach(k => { if (!unknown.includes(k)) pos(o[k], k); });
    const u = unknown[0];
    let r;
    if (u === 'C1') r = o.C2 * o.V2 / o.V1;
    else if (u === 'V1') r = o.C2 * o.V2 / o.C1;
    else if (u === 'C2') r = o.C1 * o.V1 / o.V2;
    else r = o.C1 * o.V1 / o.C2;
    const full = Object.assign({}, o, { [u]: r });
    if (full.C2 > full.C1 * (1 + 1e-12)) throw new LabError('Une dilution ne peut pas augmenter la concentration (C2 > C1).');
    if (full.V1 > full.V2 * (1 + 1e-12)) throw new LabError('Le volume prélevé ne peut pas dépasser le volume final (V1 > V2).');
    return r;
  }

  function dilutionFactor(vt, vf) {
    pos(vt, 'Volume transféré'); pos(vf, 'Volume final');
    if (vt > vf) throw new LabError('Le volume transféré dépasse le volume final.');
    return vf / vt;
  }

  function serial(c0, steps) {
    pos(c0, 'Concentration initiale');
    const out = []; let F = 1, c = c0;
    steps.forEach((s, i) => {
      pos(s[0], 'Volume transféré'); pos(s[1], 'Volume de diluant');
      const f = (s[0] + s[1]) / s[0];
      F *= f; c /= f;
      out.push({ tube: i + 1, f, F, fraction: 1 / F, C: c });
    });
    return { tubes: out, F };
  }

  function tubesNeeded(c0, cTarget, f) {
    pos(c0, 'C0'); pos(cTarget, 'Concentration cible');
    if (!(f > 1)) throw new LabError('Le facteur par étape doit être supérieur à 1.');
    if (cTarget >= c0) return 0;
    const n = Math.log(c0 / cTarget) / Math.log(f);
    return Math.ceil(Math.round(n * 1e9) / 1e9);
  }

  // -------------------------------------------------- tampons concentres
  function bufferFromStock(xs, xf, vf) {
    pos(xs, 'Concentration du stock'); pos(xf, 'Concentration finale'); pos(vf, 'Volume final');
    if (xf > xs) throw new LabError('La concentration finale dépasse celle du stock.');
    const vs = vf * xf / xs;
    return { vs, water: vf - vs };
  }
  function dyeAddToSample(vs, xs, xf) {
    if (xs === undefined) xs = 6; if (xf === undefined) xf = 1;
    pos(vs, "Volume d'échantillon"); pos(xs, 'Concentration du tampon'); pos(xf, 'Concentration finale');
    if (xs <= xf) throw new LabError('Le tampon de charge doit être plus concentré que la concentration finale.');
    const vd = vs * xf / (xs - xf);
    return { vd, vt: vs + vd };
  }
  function dyeFinalFixed(vf, xs, xf) {
    if (xs === undefined) xs = 6; if (xf === undefined) xf = 1;
    pos(vf, 'Volume final'); pos(xs, 'Concentration du tampon'); pos(xf, 'Concentration finale');
    if (xs <= xf) throw new LabError('Le tampon de charge doit être plus concentré que la concentration finale.');
    const vd = vf * xf / xs;
    return { vd, rest: vf - vd };
  }

  // ---------------------------------------------------------- gels, milieux
  const agaroseMass = (p, vmL) => pos(p, 'Pourcentage') * pos(vmL, 'Volume') / 100;
  const mediumPowder = (cgL, vmL) => pos(cgL, 'Concentration') * pos(vmL, 'Volume') / 1000;
  function platesPossible(vt, vp) { pos(vt, 'Volume total'); pos(vp, 'Volume par boîte'); return Math.floor(vt / vp + 1e-9); }
  const volumeForPlates = (n, vp, margin) => n * vp * (1 + (margin || 0));

  // ------------------------------------------------------------------- PCR
  function pcrVolume(cf, cs, vr) {
    pos(cf, 'Concentration finale'); pos(cs, 'Concentration du stock'); pos(vr, 'Volume réactionnel');
    if (cf > cs) throw new LabError('Concentration finale supérieure à celle du stock.');
    return cf * vr / cs;
  }
  function pcrMix(vr, comps, n, surplus) {
    pos(vr, 'Volume réactionnel');
    const rows = []; let tot = 0;
    comps.forEach(c => {
      let v;
      if (c.kind === 'conc') v = pcrVolume(c.final, c.stock, vr);
      else if (c.kind === 'units' || c.kind === 'amount') v = pos(c.final, c.name) / pos(c.stock, c.name);
      else v = pos(c.final, c.name);
      rows.push(Object.assign({}, c, { v }));
      tot += v;
    });
    const water = vr - tot;
    if (water < -1e-9) throw new LabError(`La somme des réactifs (${tot.toFixed(3)} µL) dépasse le volume réactionnel (${vr} µL).`);
    return { rows, water, factor: (n || 1) * (1 + (surplus || 0)) };
  }

  // ---------------------------------------------------------- denombrement
  function cfuSingle(C, V, d) {
    pos(C, 'Nombre de colonies', true); pos(V, 'Volume ensemencé'); pos(d, 'Fraction de dilution');
    if (d > 1) throw new LabError('La fraction de dilution doit être ≤ 1 (exemple : 10^-3), pas un facteur.');
    return C / (V * d);
  }
  function cfuWeighted(sumC, V, n1, n2, d1) {
    pos(V, 'Volume'); pos(d1, 'Fraction de dilution'); pos(sumC, 'Somme des colonies', true);
    if (n1 < 1) throw new LabError('Au moins une boîte doit être retenue à la première dilution.');
    if (d1 > 1) throw new LabError('La fraction de dilution doit être ≤ 1.');
    return sumC / (V * (n1 + 0.1 * n2) * d1);
  }
  const lod = (V, d, n) => 1 / (pos(V, 'Volume') * pos(d, 'Fraction') * (n || 1));
  function initialSuspensionFraction(m, vd) { pos(m, 'Masse'); pos(vd, 'Volume de diluant'); return m / (m + vd); }
  function log10(x) { if (!(x > 0)) throw new LabError('log10 non défini pour une valeur nulle ou négative.'); return Math.log10(x); }

  // ------------------------------------------------------------------ ADN
  const A260_FACTOR = { ADNdb: 50, ARN: 40, ADNsb: 33 };
  const dnaFromA260 = (a, factor, F) => pos(a, 'A260') * pos(factor, 'Facteur') * pos(F, 'Facteur de dilution');

  // --------------------------------------------------------- complementaires
  function mean(xs) { if (!xs.length) throw new LabError('Aucune valeur.'); return xs.reduce((a, b) => a + b, 0) / xs.length; }
  function sd(xs) {
    if (xs.length < 2) throw new LabError('Au moins deux valeurs pour un écart-type.');
    const m = mean(xs);
    return Math.sqrt(xs.reduce((a, x) => a + (x - m) * (x - m), 0) / (xs.length - 1));
  }
  const cv = xs => 100 * sd(xs) / mean(xs);
  function generations(N0, Nt) {
    pos(N0, 'N0'); pos(Nt, 'Nt');
    if (Nt <= N0) throw new LabError('Nt doit être supérieur à N0 (phase de croissance).');
    return (Math.log10(Nt) - Math.log10(N0)) / Math.log10(2);
  }
  const generationTime = (N0, Nt, t) => pos(t, 'Durée') / generations(N0, Nt);
  const recovery = (meas, exp) => 100 * pos(meas, 'Valeur mesurée', true) / pos(exp, 'Valeur attendue');
  function mixConc(pairs) {
    const vt = pairs.reduce((a, p) => a + p[1], 0);
    pos(vt, 'Volume total');
    return pairs.reduce((a, p) => a + p[0] * p[1], 0) / vt;
  }

  // ------------------------------------------------------------ formatage
  const NBSP = ' ';
  function roundHalfUp(x, dec) {
    const m = Math.pow(10, dec);
    const s = Math.sign(x) || 1;
    return s * Math.round(Math.abs(x) * m * (1 + 8 * Number.EPSILON)) / m;
  }
  function group(intStr) {
    const neg = intStr[0] === '-'; let d = neg ? intStr.slice(1) : intStr;
    if (d.length > 4) d = d.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
    return (neg ? '-' : '') + d;
  }
  function fixed(x, dec, keep) {
    if (dec === undefined) dec = 2;
    let s = roundHalfUp(x, dec).toFixed(dec);
    if (!keep && s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0') s = '0';
    const parts = s.split('.');
    return group(parts[0]) + (parts[1] ? ',' + parts[1] : '');
  }
  function sigfig(x, n) {
    if (x === 0) return '0';
    const e = Math.floor(Math.log10(Math.abs(x)));
    return fixed(roundHalfUp(x, n - 1 - e), Math.max(0, n - 1 - e));
  }
  function sciParts(x, n) {
    if (x === 0) return { m: '0', e: 0 };
    let e = Math.floor(Math.log10(Math.abs(x)));
    let m = roundHalfUp(x / Math.pow(10, e), n - 1);
    if (Math.abs(m) >= 10) { m /= 10; e += 1; }
    return { m: fixed(m, n - 1, true), e };
  }
  function sci(x, n, opts) {
    n = n || 2; opts = opts || {};
    if (!isNum(x)) return '—';
    if (x === 0) return '0';
    const p = sciParts(x, n);
    let m = p.m;
    if (opts.trim && m.includes(',')) m = m.replace(/0+$/, '').replace(/,$/, '');
    if (p.e === 0) return m;
    return opts.text ? `${m} × 10^${p.e}` : `${m}${NBSP}×${NBSP}10<sup>${p.e}</sup>`;
  }
  function num(x, n, opts) {
    n = n || 3; opts = opts || {};
    if (!isNum(x)) return '—';
    if (x === 0) return '0';
    const a = Math.abs(x);
    if (a >= 1e5 || a < 1e-3) return sci(x, n, Object.assign({ trim: true }, opts));
    if (a < 100) return sigfig(x, n);
    return fixed(x, Math.max(0, n - String(Math.floor(a)).length));
  }
  // nombre de decimales adapte au pipetage (µL) : 3 decimales max
  const vol = (x, dec) => fixed(x, dec === undefined ? 3 : dec);
  const toText = html => String(html).replace(/<sup>(.*?)<\/sup>/g, '^$1').replace(/<sub>(.*?)<\/sub>/g, '$1').replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');

  /** Analyse une saisie numerique sans eval : 1,5 ; 1.5 ; 1 500 ; 1,6e7 ; 1,6x10^7 ; 1,6×10^-3 ; 10^-3 ; 1/10 */
  function parseNum(str) {
    if (typeof str === 'number') return str;
    if (str === null || str === undefined) return NaN;
    let s = String(str).trim().replace(/[\s  ]/g, '').replace(/,/g, '.').replace(/−/g, '-');
    if (s === '') return NaN;
    let m = s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))(?:(?:[x×*·]10\^?)([+-]?\d+)|[eE]([+-]?\d+))?$/);
    if (m) {
      const base = parseFloat(m[1]);
      const ex = m[2] !== undefined ? m[2] : m[3];
      return ex !== undefined ? base * Math.pow(10, parseInt(ex, 10)) : base;
    }
    m = s.match(/^10\^([+-]?\d+)$/);
    if (m) return Math.pow(10, parseInt(m[1], 10));
    m = s.match(/^(\d+\.?\d*)\/(\d+\.?\d*)$/);
    if (m) { const den = parseFloat(m[2]); return den === 0 ? NaN : parseFloat(m[1]) / den; }
    return NaN;
  }

  /** Comparaison d'une reponse : tolerance relative ou arrondi a 2-3 chiffres significatifs accepte. */
  function answerOk(given, expected, tol, absTol) {
    if (!isNum(given) || !isNum(expected)) return false;
    if (absTol !== undefined) return Math.abs(given - expected) <= absTol + 1e-12;
    if (expected === 0) return Math.abs(given) < 1e-12;
    const rel = Math.abs(given - expected) / Math.abs(expected);
    if (rel <= (tol === undefined ? 0.02 : tol)) return true;
    for (const n of [2, 3]) {
      const e = Math.floor(Math.log10(Math.abs(expected)));
      const r = roundHalfUp(expected, n - 1 - e);
      if (Math.abs(given - r) <= 1e-9 * Math.abs(expected)) return true;
    }
    return false;
  }

  root.LabCore = {
    LabError, MASS, VOL, CMASS, CMOL, TABLES, kindOf, convert, isNum,
    massFromConc, concFromMass, volFromMass, moles, massFromMolar, percentToGL,
    c1v1, dilutionFactor, serial, tubesNeeded,
    bufferFromStock, dyeAddToSample, dyeFinalFixed,
    agaroseMass, mediumPowder, platesPossible, volumeForPlates,
    pcrVolume, pcrMix,
    cfuSingle, cfuWeighted, lod, initialSuspensionFraction, log10,
    A260_FACTOR, dnaFromA260,
    mean, sd, cv, generations, generationTime, recovery, mixConc,
    roundHalfUp, fixed, sigfig, sci, num, vol, toText, parseNum, answerOk, NBSP
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* =====================================================================
   Calculs Coach - definitions des 13 calculateurs.
   Chaque calculateur declare ses champs, une fonction compute() pure
   (aucun acces au DOM) et des tests numeriques de reference.
   ===================================================================== */
(function (root) {
  'use strict';
  const K = root.LabCore;
  const E = msg => new K.LabError(msg);
  const n3 = x => K.num(x, 3);
  const n4 = x => K.num(x, 4);
  const sub = s => `<sub>${s}</sub>`;

  const MASS_U = ['g', 'mg', 'µg', 'ng'];
  const VOL_U = ['L', 'mL', 'µL'];
  const CM_U = ['g/L', 'mg/mL', 'mg/L', 'µg/mL', 'ng/µL'];
  const CMOL_U = ['M', 'mM', 'µM', 'nM'];
  const ALL_U = [].concat(['kg'], MASS_U, ['pg'], VOL_U, ['nL'], CM_U, ['µg/L', 'ng/mL', 'µg/µL'], CMOL_U);
  const CONC_ANY = CM_U.concat(CMOL_U, ['X', '%', 'UFC/mL', 'U/mL']);

  /** Choix de pipette pour un volume en µL. */
  function pipette(uL) {
    if (!(uL > 0)) return '';
    if (uL < 0.2) return 'volume trop petit pour être pipeté avec justesse : prévoir une dilution intermédiaire ou un master mix';
    const P = [[2, 'P2'], [10, 'P10'], [20, 'P20'], [200, 'P200'], [1000, 'P1000'], [5000, 'P5000 ou pipette sérologique de 5 mL'], [10000, 'pipette sérologique de 10 mL'], [25000, 'pipette sérologique de 25 mL'], [50000, 'pipette sérologique de 50 mL']];
    for (const [max, name] of P) if (uL <= max + 1e-9) return name;
    return 'éprouvette graduée ou fiole jaugée';
  }

  /** Meilleure unite d'affichage pour une masse en g ou un volume en L. */
  function bestMass(g) {
    const a = Math.abs(g);
    if (a >= 1) return [g, 'g']; if (a >= 1e-3) return [g * 1e3, 'mg']; if (a >= 1e-6) return [g * 1e6, 'µg']; return [g * 1e9, 'ng'];
  }
  function bestVol(L) {
    const a = Math.abs(L);
    if (a >= 1) return [L, 'L']; if (a >= 1e-3) return [L * 1e3, 'mL']; return [L * 1e6, 'µL'];
  }
  const fmtMass = g => { const [v, u] = bestMass(g); return `${n4(v)} ${u}`; };
  const fmtVol = L => { const [v, u] = bestVol(L); return `${n4(v)} ${u}`; };

  /** Concentration vers unite de base (g/L ou M) ; X, %, UFC/mL : identite. */
  function concBase(v, u) {
    if (u in K.CMASS) return { v: v * K.CMASS[u], kind: 'mass', base: 'g/L' };
    if (u in K.CMOL) return { v: v * K.CMOL[u], kind: 'mol', base: 'M' };
    return { v, kind: u, base: u };
  }
  function concFromBase(vb, u) {
    if (u in K.CMASS) return vb / K.CMASS[u];
    if (u in K.CMOL) return vb / K.CMOL[u];
    return vb;
  }

  const COMPOUNDS = [
    ['', 'Saisie libre', null], ['NaCl', 'NaCl', 58.44], ['KCl', 'KCl', 74.55], ['Tris', 'Tris base', 121.14],
    ['EDTA', 'EDTA disodique ·2H₂O', 372.24], ['MgCl2a', 'MgCl₂ anhydre', 95.21], ['MgCl2h', 'MgCl₂ ·6H₂O', 203.30],
    ['CaCl2a', 'CaCl₂ anhydre', 110.98], ['CaCl2h', 'CaCl₂ ·2H₂O', 147.01], ['Glc', 'Glucose', 180.16], ['Sac', 'Saccharose', 342.30],
    ['KH2PO4', 'KH₂PO₄', 136.09], ['Na2HPO4', 'Na₂HPO₄ anhydre', 141.96]
  ];

  const BUF_PRESETS = [
    ['', 'Saisie libre', null], ['tae', 'TAE 50X → 1X', [50, 1]], ['tbe105', 'TBE 10X → 0,5X', [10, 0.5]], ['tbe101', 'TBE 10X → 1X', [10, 1]],
    ['tbe55', 'TBE 5X → 0,5X', [5, 0.5]], ['pbs', 'PBS 10X → 1X', [10, 1]], ['ssc', 'SSC 20X → 2X', [20, 2]]
  ];

  // ===================================================================
  const CALCS = [];

  // 1. Conversions ---------------------------------------------------
  CALCS.push({
    id: 'conv', ch: 'm1', icon: 'swap', title: "Conversions d'unités",
    desc: 'Masses, volumes, concentrations massiques et molaires.',
    fields: () => [
      { id: 'v', label: 'Valeur', def: '250' },
      { id: 'from', label: 'Unité de départ', type: 'select', options: ALL_U.map(u => [u, u]), def: 'µL' },
      { id: 'to', label: "Unité d'arrivée", type: 'select', def: 'mL', dependsOn: 'from',
        options: v => { const k = K.kindOf(v.from); return ALL_U.filter(u => K.kindOf(u) === k).map(u => [u, u]); } }
    ],
    compute(v) {
      const r = K.convert(v.v, v.from, v.to);
      const f = K.convert(1, v.from, v.to);
      return {
        formula: 'valeur (unité d\'arrivée) = valeur (unité de départ) × facteur',
        steps: [`Grandeur : ${K.kindOf(v.from)}.`, `Facteur : 1 ${v.from} = ${n4(f)} ${v.to}.`, `${n4(v.v)} × ${n4(f)} = ${n4(r)} ${v.to}.`,
          f > 1 ? "L'unité d'arrivée est plus petite : le nombre augmente." : (f < 1 ? "L'unité d'arrivée est plus grande : le nombre diminue." : 'Unités équivalentes : la valeur ne change pas.')],
        result: [{ label: `${n4(v.v)} ${v.from} =`, value: n4(r), unit: v.to, main: true }],
        values: { r }
      };
    },
    tests: [
      { in: { v: '250', from: 'µL', to: 'mL' }, out: { r: 0.25 } },
      { in: { v: '100', from: 'mg/mL', to: 'µg/mL' }, out: { r: 1e5 } },
      { in: { v: '45', from: 'ng/µL', to: 'µg/mL' }, out: { r: 45 } },
      { in: { v: '0,2', from: 'mM', to: 'µM' }, out: { r: 200 } }
    ]
  });

  // 2. Masse et concentration -----------------------------------------
  CALCS.push({
    id: 'masse', ch: 'm2', icon: 'scale', title: 'Masse à peser et concentration',
    desc: 'm = Cm × V, avec % m/V, g/L, mg/mL…',
    modes: [['m', 'Masse à peser'], ['c', 'Concentration'], ['v', 'Volume réalisable']],
    fields: mode => {
      const C = { id: 'C', label: 'Concentration massique', units: CM_U.concat(['% m/V']), unit: 'g/L', def: '8' };
      const V = { id: 'V', label: 'Volume final', units: VOL_U, unit: 'mL', def: '350' };
      const m = { id: 'm', label: 'Masse', units: MASS_U, unit: 'g', def: '2,8' };
      return mode === 'm' ? [C, V] : mode === 'c' ? [m, V] : [m, C];
    },
    compute(v, mode) {
      const cg = x => v.C_u === '% m/V' ? K.percentToGL(x) : x * K.CMASS[v.C_u];
      const steps = [];
      if (mode === 'm') {
        const C = cg(v.C), V = v.V * K.VOL[v.V_u];
        steps.push(v.C_u === '% m/V' ? `${n4(v.C)} % m/V = ${n4(v.C)} g pour 100 mL = ${n4(C)} g/L.` : `C<sub>m</sub> = ${n4(v.C)} ${v.C_u} = ${n4(C)} g/L.`);
        steps.push(`V = ${n4(v.V)} ${v.V_u} = ${n4(V)} L.`);
        const m = K.massFromConc(C, V);
        steps.push(`m = ${n4(C)} g/L × ${n4(V)} L = ${n4(m)} g.`);
        steps.push('Dissoudre dans un volume inférieur, puis compléter au volume final.');
        return { formula: `m = C${sub('m')} × V`, steps, result: [{ label: 'Masse à peser', value: fmtMass(m).split(' ')[0], unit: fmtMass(m).split(' ')[1], main: true }, { label: 'En grammes', value: n4(m), unit: 'g' }], values: { m } };
      }
      if (mode === 'c') {
        const m = v.m * K.MASS[v.m_u], V = v.V * K.VOL[v.V_u];
        const c = K.concFromMass(m, V);
        steps.push(`m = ${n4(m)} g ; V = ${n4(V)} L.`, `C${sub('m')} = ${n4(m)} / ${n4(V)} = ${n4(c)} g/L.`, `Équivalences : ${n4(c)} g/L = ${n4(c)} mg/mL = ${n4(c * 1000)} µg/mL = ${n4(c / 10)} % m/V.`);
        return { formula: `C${sub('m')} = m / V`, steps, result: [{ label: 'Concentration', value: n4(c), unit: 'g/L', main: true }, { label: 'Soit', value: n4(c * 1000), unit: 'µg/mL' }, { label: 'Soit', value: n4(c / 10), unit: '% m/V' }], values: { c } };
      }
      const m = v.m * K.MASS[v.m_u], C = cg(v.C);
      const V = K.volFromMass(m, C);
      steps.push(`m = ${n4(m)} g ; C${sub('m')} = ${n4(C)} g/L.`, `V = ${n4(m)} / ${n4(C)} = ${n4(V)} L = ${n4(V * 1000)} mL.`);
      return { formula: `V = m / C${sub('m')}`, steps, result: [{ label: 'Volume final réalisable', value: n4(V * 1000), unit: 'mL', main: true }], values: { V } };
    },
    tests: [
      { mode: 'm', in: { C: '8', C_u: 'g/L', V: '350', V_u: 'mL' }, out: { m: 2.8 } },
      { mode: 'm', in: { C: '20', C_u: '% m/V', V: '250', V_u: 'mL' }, out: { m: 50 } },
      { mode: 'c', in: { m: '12', m_u: 'mg', V: '0,24', V_u: 'mL' }, out: { c: 50 } },
      { mode: 'v', in: { m: '1,2', m_u: 'g', C: '4', C_u: 'g/L' }, out: { V: 0.3 } }
    ]
  });

  // 3. Concentration molaire ------------------------------------------
  CALCS.push({
    id: 'molaire', ch: 'm2', icon: 'molecule', title: 'Concentration molaire',
    desc: 'm = C × V × M, hydrates et pureté.',
    modes: [['m', 'Masse à peser'], ['c', 'Concentration obtenue']],
    fields: mode => {
      const cmp = { id: 'cmp', label: 'Composé (remplit M)', type: 'select', options: COMPOUNDS.map(c => [c[0], c[1] + (c[2] ? ` (${K.fixed(c[2], 2)} g/mol)` : '')]), def: '',
        onChange: (val, set) => { const c = COMPOUNDS.find(x => x[0] === val); if (c && c[2]) set('M', K.fixed(c[2], 2)); } };
      const M = { id: 'M', label: 'Masse molaire M', unit: 'g/mol', def: '58,44' };
      const V = { id: 'V', label: 'Volume final', units: VOL_U, unit: 'mL', def: '500' };
      if (mode === 'm') return [cmp, { id: 'C', label: 'Concentration voulue', units: CMOL_U, unit: 'mM', def: '150' }, V, M, { id: 'p', label: 'Pureté', unit: '%', def: '100' }];
      return [cmp, { id: 'm', label: 'Masse pesée', units: MASS_U, unit: 'g', def: '0,4382' }, V, M];
    },
    compute(v, mode) {
      const V = v.V * K.VOL[v.V_u];
      if (mode === 'm') {
        const C = v.C * K.CMOL[v.C_u];
        if (!(v.p > 0 && v.p <= 100)) throw E('La pureté doit être comprise entre 0 et 100 %.');
        const pur = v.p / 100;
        const m = K.massFromMolar(C, V, v.M, pur);
        const steps = [`C = ${n4(v.C)} ${v.C_u} = ${n4(C)} mol/L ; V = ${n4(V)} L.`, `n = C × V = ${n4(C * V)} mol.`, `m = n × M = ${n4(C * V)} × ${n4(v.M)} = ${n4(C * V * v.M)} g.`];
        if (pur < 1) steps.push(`Correction de pureté : ${n4(C * V * v.M)} / ${n4(pur)} = ${n4(m)} g.`);
        return { formula: 'm = C × V × M / pureté', steps, result: [{ label: 'Masse à peser', value: n4(m), unit: 'g', main: true }, { label: 'Quantité de matière', value: n4(C * V * 1000), unit: 'mmol' }],
          notes: ['Utiliser la masse molaire de la forme réellement pesée (sel hydraté ou anhydre).'], values: { m } };
      }
      const m = v.m * K.MASS[v.m_u];
      const n = K.moles(m, v.M), C = n / V;
      return { formula: 'C = n / V = m / (M × V)', steps: [`n = ${n4(m)} / ${n4(v.M)} = ${n4(n)} mol.`, `C = ${n4(n)} / ${n4(V)} = ${n4(C)} mol/L.`],
        result: [{ label: 'Concentration', value: n4(C * 1000), unit: 'mM', main: true }, { label: 'Soit', value: n4(C), unit: 'M' }, { label: 'Concentration massique', value: n4(m / V), unit: 'g/L' }], values: { C } };
    },
    tests: [
      { mode: 'm', in: { cmp: '', C: '150', C_u: 'mM', V: '500', V_u: 'mL', M: '58,44', p: '100' }, out: { m: 4.383 } },
      { mode: 'm', in: { cmp: '', C: '0,2', C_u: 'M', V: '0,5', V_u: 'L', M: '147,01', p: '98' }, out: { m: 0.2 * 0.5 * 147.01 / 0.98 } },
      { mode: 'c', in: { cmp: '', m: '0,4382', m_u: 'g', V: '50', V_u: 'mL', M: '58,44' }, out: { C: 0.4382 / 58.44 / 0.05 } }
    ]
  });

  // 4. C1V1 = C2V2 -----------------------------------------------------
  CALCS.push({
    id: 'dilution', ch: 'm3', icon: 'drop', title: 'Dilution C₁V₁ = C₂V₂',
    desc: 'Volume à prélever, diluant, facteur et fraction.',
    fields: () => [
      { id: 'unk', label: 'Inconnue', type: 'select', options: [['V1', 'V₁ volume à prélever'], ['C2', 'C₂ concentration finale'], ['V2', 'V₂ volume final'], ['C1', 'C₁ concentration du stock']], def: 'V1' },
      { id: 'C1', label: 'C₁ concentration du stock', units: CONC_ANY, unit: 'mg/mL', def: '10', skipIf: v => v.unk === 'C1' },
      { id: 'V1', label: 'V₁ volume prélevé', units: VOL_U, unit: 'mL', def: '0,1', skipIf: v => v.unk === 'V1' },
      { id: 'C2', label: 'C₂ concentration finale', units: CONC_ANY, unit: 'µg/mL', def: '50', skipIf: v => v.unk === 'C2' },
      { id: 'V2', label: 'V₂ volume final', units: VOL_U, unit: 'mL', def: '20', skipIf: v => v.unk === 'V2' }
    ],
    compute(v) {
      const u = v.unk;
      const c1 = concBase(1, v.C1_u), c2 = concBase(1, v.C2_u);
      if (c1.kind !== c2.kind) throw E(`C₁ (${v.C1_u}) et C₂ (${v.C2_u}) ne sont pas des grandeurs compatibles. Utiliser des unités de même nature.`);
      const o = { C1: u === 'C1' ? null : concBase(v.C1, v.C1_u).v, C2: u === 'C2' ? null : concBase(v.C2, v.C2_u).v,
        V1: u === 'V1' ? null : v.V1 * K.VOL[v.V1_u], V2: u === 'V2' ? null : v.V2 * K.VOL[v.V2_u] };
      const steps = [];
      if (c1.kind === 'mass' || c1.kind === 'mol') steps.push(`Conversion des concentrations en ${c1.base} : ` + ['C1', 'C2'].filter(k => k !== u).map(k => `${k.replace('1', '₁').replace('2', '₂')} = ${n4(o[k])} ${c1.base}`).join(' ; ') + '.');
      steps.push('Volumes convertis en L : ' + ['V1', 'V2'].filter(k => k !== u).map(k => `${k.replace('1', '₁').replace('2', '₂')} = ${n4(o[k])} L`).join(' ; ') + '.');
      const r = K.c1v1(o);
      const full = Object.assign({}, o, { [u]: r });
      const F = full.C1 / full.C2, dil = full.V2 - full.V1;
      const exprs = { V1: `V₁ = C₂ × V₂ / C₁ = ${n4(full.C2)} × ${n4(full.V2)} / ${n4(full.C1)}`, C2: `C₂ = C₁ × V₁ / V₂ = ${n4(full.C1)} × ${n4(full.V1)} / ${n4(full.V2)}`,
        V2: `V₂ = C₁ × V₁ / C₂ = ${n4(full.C1)} × ${n4(full.V1)} / ${n4(full.C2)}`, C1: `C₁ = C₂ × V₂ / V₁ = ${n4(full.C2)} × ${n4(full.V2)} / ${n4(full.V1)}` };
      let main;
      if (u === 'V1' || u === 'V2') { const unit = v[u === 'V1' ? 'V2_u' : 'V1_u']; main = { label: u === 'V1' ? 'Volume à prélever V₁' : 'Volume final V₂', value: n4(r / K.VOL[unit]), unit, main: true }; steps.push(`${exprs[u]} = ${fmtVol(r)}.`); }
      else { const unit = v[u === 'C1' ? 'C2_u' : 'C1_u']; const val = concFromBase(r, unit); main = { label: u === 'C2' ? 'Concentration finale C₂' : 'Concentration du stock C₁', value: n4(val), unit, main: true }; steps.push(`${exprs[u]} = ${n4(val)} ${unit}.`); }
      steps.push(`Diluant = V₂ − V₁ = ${fmtVol(dil)}.`, `Facteur F = C₁/C₂ = V₂/V₁ = ${n4(F)} ; fraction d = 1/F = ${K.sci(1 / F, 3, { trim: true })}.`);
      const warnings = [];
      const v1uL = full.V1 * 1e6;
      if (v1uL < 1) warnings.push(`V₁ = ${n4(v1uL)} µL : volume trop faible pour un pipetage fiable. Prévoir une dilution intermédiaire.`);
      return { formula: 'C₁ × V₁ = C₂ × V₂', steps, warnings,
        result: [main, { label: 'Volume de diluant', value: fmtVol(dil).split(' ')[0], unit: fmtVol(dil).split(' ')[1] }, { label: 'Facteur de dilution F', value: n4(F), unit: '' }, { label: 'Fraction d', value: K.sci(1 / F, 3, { trim: true }), unit: '' }],
        notes: [`Pipette suggérée pour V₁ (${fmtVol(full.V1)}) : ${pipette(v1uL)}.`], values: { r, F, dil } };
    },
    tests: [
      { in: { unk: 'V1', C1: '10', C1_u: 'mg/mL', C2: '50', C2_u: 'µg/mL', V2: '20', V2_u: 'mL' }, out: { r: 1e-4, F: 200 } },
      { in: { unk: 'C2', C1: '25', C1_u: 'g/L', V1: '2', V1_u: 'mL', V2: '50', V2_u: 'mL' }, out: { r: 1 } },
      { in: { unk: 'V2', C1: '1', C1_u: 'M', V1: '5', V1_u: 'mL', C2: '100', C2_u: 'mM' }, out: { r: 0.05 } },
      { in: { unk: 'V1', C1: '50', C1_u: 'X', C2: '1', C2_u: 'X', V2: '500', V2_u: 'mL' }, out: { r: 0.01 } }
    ]
  });

  // 5. Dilutions en serie ---------------------------------------------
  CALCS.push({
    id: 'serie', ch: 'm3', icon: 'tubes', title: 'Dilutions en série',
    desc: 'Facteur global, concentration de chaque tube, nombre de tubes.',
    fields: () => [
      { id: 'C0', label: 'Concentration de départ C₀', units: ['UFC/mL', 'cellules/mL', 'µg/mL', 'mg/mL', 'ng/µL', 'g/L', 'mM', 'µM', 'copies/µL'], unit: 'UFC/mL', def: '2e8' },
      { id: 'vt', label: 'Volume transféré par étape', units: ['µL', 'mL'], unit: 'mL', def: '1' },
      { id: 'vd', label: 'Volume de diluant par tube', unit: '(même unité)', def: '9' },
      { id: 'n', label: 'Nombre de tubes', unit: 'tubes', def: '6', int: true },
      { id: 'ct', label: 'Concentration cible (facultatif)', unit: '(unité de C₀)', def: '', optional: true }
    ],
    compute(v) {
      if (!(v.n >= 1 && v.n <= 15)) throw E('Le nombre de tubes doit être compris entre 1 et 15.');
      const s = K.serial(v.C0, Array.from({ length: v.n }, () => [v.vt, v.vd]));
      const f = (v.vt + v.vd) / v.vt;
      const rows = s.tubes.map(t => [`Tube ${t.tube}`, K.sci(t.F, 3, { trim: true }), K.sci(t.fraction, 3, { trim: true }), `${K.sci(t.C, 3, { trim: true })} ${v.C0_u}`]);
      const steps = [`Facteur par étape : f = (${n4(v.vt)} + ${n4(v.vd)}) / ${n4(v.vt)} = ${n4(f)}.`, `Facteur global après ${v.n} tubes : F = f<sup>${v.n}</sup> = ${K.sci(s.F, 3, { trim: true })}.`,
        `Concentration du dernier tube : ${K.sci(v.C0, 3, { trim: true })} / ${K.sci(s.F, 3, { trim: true })} = ${K.sci(s.tubes[v.n - 1].C, 3, { trim: true })} ${v.C0_u}.`,
        `Diluant total : ${v.n} × ${n4(v.vd)} = ${n4(v.n * v.vd)} ${v.vt_u} (prévoir une marge).`];
      const result = [{ label: `Concentration du tube ${v.n}`, value: K.sci(s.tubes[v.n - 1].C, 3, { trim: true }), unit: v.C0_u, main: true }, { label: 'Facteur global', value: K.sci(s.F, 3, { trim: true }), unit: '' }, { label: 'Diluant total', value: n4(v.n * v.vd), unit: v.vt_u }];
      const values = { F: s.F, Clast: s.tubes[v.n - 1].C };
      if (v.ct !== null && v.ct !== undefined) {
        const nt = K.tubesNeeded(v.C0, v.ct, f);
        steps.push(`Tubes nécessaires pour atteindre au plus ${K.sci(v.ct, 3, { trim: true })} : n = ⌈log(C₀/C) / log f⌉ = ${nt}.`);
        result.push({ label: 'Tubes nécessaires pour la cible', value: String(nt), unit: '' });
        values.nt = nt;
      }
      return { formula: 'F = f<sup>n</sup> ; C<sub>n</sub> = C<sub>0</sub> / F', steps, result, values,
        table: { head: ['Tube', 'Facteur cumulé F', 'Fraction d', 'Concentration'], rows }, viz: { type: 'tubes', n: v.n } };
    },
    tests: [
      { in: { C0: '2e8', C0_u: 'UFC/mL', vt: '1', vt_u: 'mL', vd: '9', n: '6', ct: '' }, out: { F: 1e6, Clast: 200 } },
      { in: { C0: '3e9', C0_u: 'UFC/mL', vt: '100', vt_u: 'µL', vd: '900', n: '6', ct: '3000' }, out: { nt: 6 } },
      { in: { C0: '128', C0_u: 'µg/mL', vt: '1', vt_u: 'mL', vd: '1', n: '6', ct: '' }, out: { Clast: 2 } }
    ]
  });

  // 6. Tampons concentres ---------------------------------------------
  CALCS.push({
    id: 'tampon', ch: 'm4', icon: 'flask', title: 'Tampons concentrés (X)',
    desc: 'TAE, TBE, PBS, SSC : stock nX vers solution de travail.',
    fields: () => [
      { id: 'preset', label: 'Tampon courant', type: 'select', options: BUF_PRESETS.map(p => [p[0], p[1]]), def: 'tae',
        onChange: (val, set) => { const p = BUF_PRESETS.find(x => x[0] === val); if (p && p[2]) { set('xs', K.fixed(p[2][0], 2)); set('xf', K.fixed(p[2][1], 2)); } } },
      { id: 'xs', label: 'Concentration du stock', unit: 'X', def: '50' },
      { id: 'xf', label: 'Concentration voulue', unit: 'X', def: '1' },
      { id: 'vf', label: 'Volume final', units: ['mL', 'L', 'µL'], unit: 'mL', def: '500' }
    ],
    compute(v) {
