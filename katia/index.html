<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Coffre // Onion_Net</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
:root{--g:#00ff41;--gd:#00a82a;--r:#ff2d55;--bg:#000;--glow:0 0 8px rgba(0,255,65,.8),0 0 22px rgba(0,255,65,.45)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%}
body{background:var(--bg);color:var(--g);font-family:'Share Tech Mono','Courier New',monospace;overflow:hidden;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;transition:filter 1.6s ease,opacity 1.6s ease;transform:scale(1.04)}
canvas.blur{filter:blur(5px);opacity:.55}
.wave{position:fixed;left:50%;top:50%;width:20px;height:20px;margin:-10px;border:2px solid var(--g);border-radius:50%;z-index:40;pointer-events:none;opacity:0}
.wave.go{animation:wave 1.4s cubic-bezier(.1,.7,.2,1)}
@keyframes wave{0%{opacity:1;transform:scale(1);box-shadow:0 0 30px var(--g)}100%{opacity:0;transform:scale(160);border-width:.2px}}
.flash{position:fixed;inset:0;background:#b6ffc8;z-index:45;pointer-events:none;opacity:0}
.flash.go{animation:flash .9s ease-out}
@keyframes flash{0%{opacity:.85}100%{opacity:0}}
@keyframes focus{from{filter:blur(14px);opacity:0;letter-spacing:8px}to{filter:none;opacity:1}}
.screen.on h1,.screen.on .sub{animation:focus 1.1s cubic-bezier(.2,.7,.2,1) both}
.screen.on .sub{animation-delay:.15s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}
.slot.fill{animation:pop .22s ease-out}
.shackle{transition:transform .8s cubic-bezier(.3,1.6,.5,1);transform-box:fill-box;transform-origin:right bottom}
.panel.ok .shackle{transform:translateY(-5px) rotate(-22deg)}
.scan{position:absolute;left:0;right:0;top:0;height:2px;background:var(--g);box-shadow:0 0 14px var(--g);animation:scan 1s ease-in-out .3s both;pointer-events:none}
@keyframes scan{0%{top:0;opacity:1}100%{top:100%;opacity:0}}
.crt{position:fixed;inset:0;z-index:50;pointer-events:none;
 background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
.screen{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.screen.on{display:flex}
.panel{background:rgba(0,6,0,.82);border:1px solid var(--gd);box-shadow:inset 0 0 30px rgba(0,255,65,.08),0 0 60px #000;
 backdrop-filter:blur(4px);padding:clamp(22px,5vw,40px);width:min(92vw,420px)}
h1{font-weight:400;font-size:clamp(22px,6vw,30px);line-height:1.3;text-shadow:var(--glow);letter-spacing:1px}
.sub{margin-top:14px;font-size:15px;line-height:1.6;color:#7dffa0;opacity:.9}
.hint{margin-top:22px;font-size:12px;opacity:.55;line-height:1.5}

/* Intro */
#intro .lines{max-width:520px;min-height:150px}
#intro h1{min-height:2.6em;letter-spacing:2px}
#log{text-align:left;font-size:13px;line-height:1.7;color:var(--gd);min-height:7em;margin-bottom:26px;transition:opacity 1s}
#log div::after{content:''}
#log.off{opacity:0}
#log b{color:var(--g);font-weight:400}
#enter{margin-top:34px;padding:18px 34px;font:inherit;font-size:18px;letter-spacing:2px;color:var(--bg);background:var(--g);border:0;cursor:pointer;
 box-shadow:var(--glow);opacity:0;pointer-events:none;transition:opacity .8s,transform .2s;animation:pulse 2.2s infinite}
#enter.show{opacity:1;pointer-events:auto}
#enter:active{transform:scale(.97)}
@keyframes pulse{0%,100%{box-shadow:0 0 8px rgba(0,255,65,.7),0 0 18px rgba(0,255,65,.3)}50%{box-shadow:0 0 18px rgba(0,255,65,1),0 0 46px rgba(0,255,65,.6)}}
.caret{display:inline-block;width:.6em;height:1.05em;background:var(--g);margin-left:3px;vertical-align:-.15em;animation:cb .8s steps(1) infinite}
@keyframes cb{50%{opacity:0}}

/* Coffre */
#vault .panel{position:relative;animation:boot .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes boot{0%{opacity:0;transform:scaleY(.02);filter:brightness(3)}60%{opacity:1;transform:scaleY(1.02)}100%{transform:none;filter:none}}
.lock{width:44px;height:44px;margin:0 auto 14px;display:block;filter:drop-shadow(0 0 6px var(--g))}
.slots{display:flex;gap:8px;justify-content:center;margin:24px 0 8px}
.slot{width:clamp(28px,8vw,36px);height:clamp(40px,11vw,48px);border:1px solid var(--gd);display:flex;align-items:center;justify-content:center;font-size:24px;transition:.15s}
.slot.fill{border-color:var(--g);box-shadow:var(--glow);background:rgba(0,255,65,.12)}
.slot.fill::after{content:'●';font-size:16px}
.slot.cur{border-color:var(--g);animation:cb 1s steps(1) infinite}
#hints{list-style:none;margin:16px 0 0;text-align:left;font-size:13px;line-height:1.5;color:#7dffa0}
#hints li{border-left:2px solid var(--g);padding:2px 0 2px 10px;margin-bottom:6px;animation:focus .8s both}
#hbtn{margin-top:12px;width:100%;padding:10px;font:inherit;font-size:14px;color:var(--g);background:transparent;border:1px dashed var(--gd);cursor:pointer}
#hbtn:active{background:rgba(0,255,65,.15)}
#vault{overflow-y:auto;justify-content:flex-start}#vault .panel{margin:auto}
#status{height:22px;margin:8px 0 14px;font-size:13px;letter-spacing:1px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{padding:clamp(12px,3.2vh,18px) 0;font:inherit;font-size:24px;color:var(--g);background:rgba(0,255,65,.05);border:1px solid var(--gd);cursor:pointer;transition:background .1s,box-shadow .1s}
.key:active,.key.hit{background:var(--g);color:#000;box-shadow:var(--glow)}
.key.ctl{font-size:18px;color:#7dffa0}
.panel.shake{animation:shake .45s both;border-color:var(--r);box-shadow:0 0 40px rgba(255,45,85,.45)}
.panel.shake #status,.err{color:var(--r);text-shadow:0 0 10px var(--r)}
@keyframes shake{10%,90%{transform:translateX(-3px)}20%,80%{transform:translateX(6px)}30%,50%,70%{transform:translateX(-9px)}40%,60%{transform:translateX(9px)}}
.panel.ok{border-color:var(--g);box-shadow:var(--glow)}
.bar{height:3px;background:#063;margin-top:6px}.bar i{display:block;height:100%;width:0;background:var(--g);box-shadow:var(--glow)}

/* Succès */
#win h1{min-height:2.7em;font-size:clamp(24px,7vw,36px)}
.drive{display:inline-block;margin-top:34px;padding:18px 30px;font-size:17px;letter-spacing:2px;color:var(--g);text-decoration:none;border:1px solid var(--g);
 background:rgba(0,255,65,.1);opacity:0;transform:translateY(10px);transition:opacity 1s,transform 1s,background .2s,color .2s}
.drive.show{opacity:1;transform:none}
.drive:hover,.drive:active{background:var(--g);color:#000;box-shadow:var(--glow)}
#mute{position:fixed;top:calc(12px + env(safe-area-inset-top));right:14px;z-index:60;width:42px;height:42px;display:none;align-items:center;justify-content:center;color:var(--g);background:rgba(0,0,0,.6);border:1px solid var(--gd);border-radius:50%;cursor:pointer}#mute svg{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="mx"></canvas>
<div class="crt"></div><div class="wave" id="wave"></div><div class="flash" id="flash"></div>
<button id="mute" aria-label="Couper ou activer le son"></button>

<!-- 1. Intro -->
<section class="screen on" id="intro">
  <div class="lines">
    <div id="log"></div>
    <h1 id="t1"></h1>
    <p class="sub" id="t2"></p>
  </div>
  <button id="enter">Ouvrir le coffre</button>
</section>

<!-- 2. Coffre -->
<section class="screen" id="vault">
  <div class="panel" id="panel"><div class="scan"></div>
    <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="#00ff41" stroke-width="1.6"><rect x="4" y="10" width="16" height="11"/><path class="shackle" d="M8 10V7a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.4" fill="#00ff41"/></svg>
    <h1>Accès restreint</h1>
    <p class="sub">Une seule date ouvre ce coffre.<br>Huit chiffres. Aucune seconde chance.</p>
    <div class="slots" id="slots"></div>
    <div id="status">&nbsp;</div>
    <div class="pad" id="pad"></div>
    <ul id="hints"></ul>
    <button id="hbtn">Un indice (3 restants)</button>
  </div>
</section>

<!-- 3. Succès -->
<section class="screen" id="win">
  <h1 id="welcome"></h1>
  <p class="sub" id="wsub" style="opacity:0;transition:opacity 1s">Accès autorisé. Ce qu'Amar t'a laissé t'attend.</p>
  <a class="drive" id="drive" href="https://drive.google.com/drive/folders/1F1SejHw6A3Sy0sbu6mIXjn9gULtjDKi6" target="_blank" rel="noopener">Ouvrir le Drive</a>
</section>

<script>
(()=>{
const $=id=>document.getElementById(id);
const CODE_HASH=2913531867573429, LEN=8;
const WELCOME="Bienvenue, mademoiselle Katia Talbi.";
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
// Hash simple (le code n'apparaît pas en clair dans la page)
const hash=(s,seed=7)=>{let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)};

/* ---------- MATRIX ---------- */
const cv=$('mx'),cx=cv.getContext('2d');const FS=18;let cols,drops,speed=1;
function size(){cv.width=innerWidth;cv.height=innerHeight;cols=Math.ceil(cv.width/FS);drops=Array.from({length:cols},()=>Math.random()*-50)}
addEventListener('resize',size);size();
setInterval(()=>{
 cx.fillStyle='rgba(0,0,0,.07)';cx.fillRect(0,0,cv.width,cv.height);cx.font=FS+'px monospace';
 for(let i=0;i<cols;i++){
  const y=drops[i]*FS;if(y>0){
   cx.fillStyle='#cfffd9';cx.fillText(Math.random()<.5?'0':'1',i*FS,y);
   cx.fillStyle='rgba(0,255,65,.8)';cx.fillText(Math.random()<.5?'0':'1',i*FS,y-FS)}
  if(y>cv.height&&Math.random()>.975)drops[i]=0;drops[i]+=speed*(.5+(i%5)*.12)}
},45);

/* ---------- AUDIO ---------- */
let ac,master,muted=false,ambient;
function initAudio(){
 if(ac)return;const A=window.AudioContext||window.webkitAudioContext;if(!A)return;ac=new A();
 master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
 // Nappe sombre continue : deux sinus désaccordés + souffle filtré
 const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=220;const g=ac.createGain();g.gain.value=.0;
 g.gain.linearRampToValueAtTime(.09,ac.currentTime+4);lp.connect(g);g.connect(master);
 [55,55.4,82.5].forEach(f=>{const o=ac.createOscillator();o.type=f>80?'sine':'sawtooth';o.frequency.value=f;o.connect(lp);o.start()});
 const lfo=ac.createOscillator(),lg=ac.createGain();lfo.frequency.value=.12;lg.gain.value=80;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
 ambient=g;
 // Petits "bips de données" aléatoires
 (function blip(){if(!muted){const o=ac.createOscillator(),v=ac.createGain();o.type='square';o.frequency.value=600+Math.random()*1800;
  v.gain.setValueAtTime(.012,ac.currentTime);v.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.06);o.connect(v);v.connect(master);o.start();o.stop(ac.currentTime+.07)}
  setTimeout(blip,250+Math.random()*1400)})();
}
function tone(f,d=.08,type='sine',v=.08,t0=0){if(!ac||muted)return;const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
const DT={1:[697,1209],2:[697,1336],3:[697,1477],4:[770,1209],5:[770,1336],6:[770,1477],7:[852,1209],8:[852,1336],9:[852,1477],0:[941,1336]};
const sKey=k=>{(DT[k]||[800,1200]).forEach(f=>tone(f,.09,'sine',.05))};
const sDel=()=>tone(300,.07,'triangle',.08);
const sErr=()=>{tone(110,.25,'sawtooth',.14);tone(90,.25,'sawtooth',.14,.18)};
const sOk=()=>[523.25,659.25,783.99,1046.5,1318.5].forEach((f,i)=>{tone(f,1.6,'sine',.09,i*.14)});
const sType=()=>tone(1400+Math.random()*400,.03,'square',.02);
const IC_ON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>',
 IC_OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
$('mute').innerHTML=IC_ON;
$('mute').onclick=()=>{muted=!muted;$('mute').innerHTML=muted?IC_OFF:IC_ON;if(ambient)ambient.gain.value=muted?0:.09};

/* ---------- INTRO ---------- */
const G='01#%$@&<>/\\';
async function type(el,txt,sp=45,tick){el.textContent='';const n=txt.length,steps=n*3;
 for(let i=0;i<=steps;i++){const k=Math.floor(i/3);let o=txt.slice(0,k);
  for(let j=k;j<Math.min(n,k+6);j++)o+=txt[j]===' '?' ':G[Math.random()*G.length|0];
  el.textContent=o;if(tick&&i%3===0)tick();await sleep(sp/2.2)}
 el.textContent=txt}
const setBlur=on=>cv.classList.toggle('blur',on);
(async()=>{
 await sleep(1200);setBlur(true);
 const L=["> connexion au réseau onion … <b>OK</b>","> 7 nœuds traversés. <b>trace effacée.</b>","> message intercepté.","> destinataire identifié … <b>1 / 1</b>","> déchiffrement du paquet …"];
 for(const l of L){const d=document.createElement('div');$('log').appendChild(d);const plain=l.replace(/<[^>]+>/g,'');
  for(let k=1;k<=plain.length;k++){d.innerHTML=l.length===plain.length?plain.slice(0,k):(k===plain.length?l:plain.slice(0,k));await sleep(14)}await sleep(260)}
 await sleep(500);$('log').classList.add('off');await sleep(900);
 await type($('t1'),"BIENVENUE.",70);await sleep(1300);
 await type($('t1'),"AMAR A LAISSÉ QUELQUE CHOSE POUR TOI.",42);await sleep(700);
 await type($('t2'),"Ce message ne s'affichera qu'une seule fois.",30);
 $('enter').classList.add('show');
})();

function fullscreen(){const e=document.documentElement;try{(e.requestFullscreen||e.webkitRequestFullscreen||e.mozRequestFullScreen||e.msRequestFullscreen).call(e)}catch(_){}}
$('enter').onclick=async()=>{
 fullscreen();initAudio();if(ac&&ac.state==='suspended')ac.resume();
 [330,440,660].forEach((f,i)=>tone(f,.4,'sine',.07,i*.09));
 $('mute').style.display='flex';
 $('intro').classList.remove('on');$('vault').classList.add('on');
};

/* ---------- CLAVIER ---------- */
let val='',busy=false;
const slots=$('slots');for(let i=0;i<LEN;i++){const s=document.createElement('div');s.className='slot';slots.appendChild(s)}
function draw(){[...slots.children].forEach((s,i)=>{s.classList.toggle('fill',i<val.length);s.classList.toggle('cur',i===val.length&&!busy)})}
const layout=['1','2','3','4','5','6','7','8','9','C','0','⌫'];
layout.forEach(k=>{const b=document.createElement('button');b.className='key'+(isNaN(k)?' ctl':'');b.textContent=k;b.dataset.k=k;b.setAttribute('aria-label',k==='C'?'Effacer tout':k==='⌫'?'Supprimer':'Chiffre '+k);$('pad').appendChild(b)});
$('pad').addEventListener('pointerdown',e=>{const b=e.target.closest('.key');if(b){e.preventDefault();press(b.dataset.k)}});
addEventListener('keydown',e=>{if(!$('vault').classList.contains('on'))return;
 if(/^\d$/.test(e.key))press(e.key,true);else if(e.key==='Backspace')press('⌫',true);else if(e.key==='Escape')press('C',true)});
function flash(k){const b=[...document.querySelectorAll('.key')].find(x=>x.dataset.k===k);if(b){b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),110)}}
function press(k,fromKb){
 if(busy)return;if(fromKb)flash(k);
 if(k==='C'){val='';sDel()}else if(k==='⌫'){val=val.slice(0,-1);sDel()}
 else if(val.length<LEN){val+=k;sKey(k);if(navigator.vibrate)navigator.vibrate(12)}
 $('status').innerHTML='&nbsp;';draw();
 if(val.length===LEN)check();
}
draw();

const HINTS=["Huit chiffres qui racontent le jour où tout a commencé.","Le jour d'abord, puis le mois, puis l'année. Dans cet ordre, sans rien d'autre.","Si tu n'as aucune idée : c'est la date de ton anniversaire."];
let hn=0;
$('hbtn').onclick=()=>{if(hn>=3||busy)return;const li=document.createElement('li');li.textContent=HINTS[hn++];$('hints').appendChild(li);
 [660,880].forEach((f,i)=>tone(f,.15,'sine',.06,i*.08));
 const left=3-hn;if(left)$('hbtn').textContent='Un indice ('+left+' restant'+(left>1?'s':'')+')';else $('hbtn').style.display='none'};

async function check(){
 busy=true;draw();const st=$('status'),p=$('panel');
 st.textContent='Vérification…';await sleep(700);
 if(hash(val)!==CODE_HASH){
  sErr();if(navigator.vibrate)navigator.vibrate([80,40,80]);
  st.textContent='Accès refusé. Tentative enregistrée.';
  p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');
  await sleep(500);p.classList.remove('shake');val='';busy=false;draw();return;
 }
 // Succès
 p.classList.add('ok');sOk();speed=4;setBlur(false);
 const chars='01#%$@&ABCDEF';let pct=0;st.innerHTML='Déchiffrement <div class="bar"><i id="pb"></i></div>';
 [...slots.children].forEach(s=>s.style.borderColor='#00ff41');
 for(pct=0;pct<=100;pct+=4){$('pb').style.width=pct+'%';[...slots.children].forEach(s=>{if(pct<100)s.textContent=chars[Math.random()*chars.length|0]});sType();await sleep(40)}
 await sleep(300);
 $('wave').classList.add('go');$('flash').classList.add('go');await sleep(450);
 $('vault').classList.remove('on');$('win').classList.add('on');speed=1.6;setTimeout(()=>setBlur(true),1400);
 await sleep(400);
 await type($('welcome'),WELCOME,70,sType);
 $('wsub').style.opacity=1;await sleep(1200);$('drive').classList.add('show');
}
})();
</script>
</body>
</html>
