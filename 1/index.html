ut charger des volumes identiques pour toutes les pistes.", "def": "Le volume final est fixé ; le tampon représente 1/X<sub>s</sub> de ce volume, le reste est l'échantillon complété éventuellement avec de l'eau.", "f": ["V<sub>dye</sub> = V<sub>final</sub> × X<sub>f</sub> / X<sub>s</sub>", "V<sub>éch</sub> + V<sub>eau</sub> = V<sub>final</sub> − V<sub>dye</sub>"], "vars": [["V<sub>final</sub>", "volume total chargé", "µL"]], "units": "Même unité pour tous les volumes.", "method": ["Calculer V<sub>dye</sub> = V<sub>final</sub> / 6.", "Calculer le volume disponible pour l'échantillon.", "Si l'échantillon est plus petit, compléter avec de l'eau ou du tampon TE."], "ex": {"q": "Préparer 30 µL de mélange à 1X à partir de 6X, contenant 15 µL d'échantillon.", "steps": ["V<sub>dye</sub> = 30 / 6 = 5 µL.", "Volume restant : 30 − 5 = 25 µL = 15 µL d'échantillon + 10 µL d'eau."], "r": "5 µL de 6X + 15 µL d'échantillon + 10 µL d'eau."}, "check": "6 × 5 / 30 = 1X.", "err": ["Oublier l'eau : on obtient 20 µL à 1,5X.", "Utiliser la formule « V/5 » alors que le volume final est imposé."], "quick": ["Volume final imposé 18 µL, tampon 6X : volume de tampon et volume maximal d'échantillon ?", "3 µL ; 15 µL."], "tables": []}, {"code": "5.3", "t": "Comparer les deux situations et vérifier la concentration finale", "use": "Choisir la bonne formule selon ce qui est imposé, et contrôler un tube préparé par un collègue.", "def": "Si le volume d'échantillon est imposé : V<sub>dye</sub> = V<sub>éch</sub> / (X<sub>s</sub> − 1). Si le volume final est imposé : V<sub>dye</sub> = V<sub>final</sub> / X<sub>s</sub>. Dans les deux cas, la vérification est la même.", "f": ["X<sub>obtenu</sub> = X<sub>s</sub> × V<sub>dye</sub> / V<sub>total</sub>"], "vars": [["X<sub>obtenu</sub>", "concentration effective du tampon dans le tube", "X"]], "units": "Une concentration finale de 0,8X à 1,2X reste généralement fonctionnelle, mais le calcul doit viser 1X.", "method": ["Identifier la grandeur imposée.", "Appliquer la formule correspondante.", "Vérifier X<sub>obtenu</sub>."], "ex": {"q": "Un tube contient 3 µL de 6X et 12 µL d'échantillon. Concentration finale ?", "steps": ["V<sub>total</sub> = 15 µL.", "X = 6 × 3 / 15 = 1,2X."], "r": "1,2X : légèrement trop concentré."}, "check": "Pour 1X exact avec 12 µL d'échantillon, il fallait 12 / 5 = 2,4 µL.", "err": ["Négliger le volume du tampon dans le volume total."], "quick": ["2 µL de 6X + 13 µL d'échantillon : concentration ?", "0,8X."], "tables": [{"head": ["Situation", "Donnée imposée", "Formule (6X → 1X)", "Exemple"], "rows": [["Ajout à l'échantillon", "V<sub>éch</sub>", "V<sub>dye</sub> = V<sub>éch</sub> / 5", "10 µL → 2 µL ; total 12 µL"], ["Volume final fixé", "V<sub>final</sub>", "V<sub>dye</sub> = V<sub>final</sub> / 6", "12 µL → 2 µL ; éch. + eau 10 µL"]]}]}]}, {"id": "m6", "num": 6, "title": "Gels d'agarose", "intro": "Deux préparations distinctes : le gel (agarose dans du tampon 1X) et le tampon de migration (tampon 1X qui remplit la cuve). Les deux utilisent le même tampon à la même concentration.", "notions": [{"code": "6.1", "t": "Masse d'agarose pour un pourcentage donné", "use": "Préparer un gel à 0,8 % (grands fragments), 1 % (usage général), 1,5 % ou 2 % (petits fragments).", "def": "Un gel à 1 % m/V contient 1 g d'agarose pour 100 mL de volume final de gel. Le pourcentage se rapporte au volume de tampon, et non à la masse de gel.", "f": ["m<sub>agarose</sub> (g) = p (%) × V<sub>gel</sub> (mL) / 100"], "vars": [["p", "pourcentage d'agarose", "% m/V"], ["V<sub>gel</sub>", "volume de gel", "mL"], ["m<sub>agarose</sub>", "masse à peser", "g"]], "units": "Avec V en mL, le résultat est directement en g après division par 100.", "method": ["Déterminer le volume de gel (taille du moule).", "Calculer la masse.", "Peser l'agarose, ajouter le tampon 1X, chauffer jusqu'à dissolution complète.", "Compenser l'eau évaporée si le protocole le prévoit (pesée du flacon avant et après chauffage)."], "ex": {"q": "Préparer 120 mL de gel à 1,5 %.", "steps": ["m = 1,5 × 120 / 100 = 1,8 g."], "r": "1,8 g d'agarose dans 120 mL de tampon 1X."}, "check": "Pour 100 mL à 1,5 % il faut 1,5 g ; pour 120 mL un peu plus : 1,8 g.", "err": ["Écrire 1,5 % de 120 mL = 18 g (oubli de la division par 100… ou par 10).", "Préparer le gel avec de l'eau au lieu du tampon : pas de migration correcte.", "Utiliser du tampon 50X pour le gel."], "quick": ["Masse d'agarose pour 40 mL à 2 % ?", "0,8 g."], "tables": [{"head": ["Pourcentage", "30 mL", "50 mL", "100 mL", "150 mL"], "rows": [["0,8 %", "0,24 g", "0,4 g", "0,8 g", "1,2 g"], ["1 %", "0,3 g", "0,5 g", "1 g", "1,5 g"], ["1,5 %", "0,45 g", "0,75 g", "1,5 g", "2,25 g"], ["2 %", "0,6 g", "1 g", "2 g", "3 g"]]}]}, {"code": "6.2", "t": "Volume de gel nécessaire", "use": "Ajuster la préparation au moule utilisé et au nombre de gels.", "def": "Le volume d'un gel est le produit de la longueur et de la largeur du plateau par l'épaisseur voulue (1 cm<sup>3</sup> = 1 mL).", "f": ["V<sub>gel</sub> (mL) = L (cm) × l (cm) × e (cm)", "V<sub>total</sub> = n<sub>gels</sub> × V<sub>gel</sub>"], "vars": [["L, l", "dimensions intérieures du plateau", "cm"], ["e", "épaisseur du gel", "cm (souvent 0,4 à 0,7)"]], "units": "1 cm<sup>3</sup> = 1 mL.", "method": ["Mesurer le plateau.", "Choisir une épaisseur (le peigne doit plonger sans toucher le fond).", "Calculer le volume, puis la masse d'agarose."], "ex": {"q": "Plateau de 10 cm × 7 cm, épaisseur 0,5 cm, gel à 1 %.", "steps": ["V = 10 × 7 × 0,5 = 35 mL.", "m = 1 × 35 / 100 = 0,35 g."], "r": "35 mL de gel ; 0,35 g d'agarose."}, "check": "Un mini-gel courant fait 25 à 50 mL : valeur plausible.", "err": ["Utiliser l'épaisseur en mm sans convertir (5 mm = 0,5 cm)."], "quick": ["Volume d'un gel de 15 cm × 10 cm × 0,6 cm ?", "90 mL."], "tables": []}, {"code": "6.3", "t": "Tampon de migration et calculs combinés pour plusieurs gels", "use": "Planifier une séance de TP : plusieurs gels, une ou plusieurs cuves, un seul flacon de stock concentré.", "def": "Le tampon 1X total nécessaire est la somme du tampon incorporé dans les gels et du tampon remplissant les cuves. Le stock concentré est ensuite dilué selon V<sub>stock</sub> = V<sub>total</sub> / F.", "f": ["V<sub>1X total</sub> = n<sub>gels</sub> × V<sub>gel</sub> + n<sub>cuves</sub> × V<sub>cuve</sub>", "V<sub>stock</sub> = V<sub>1X total</sub> × X<sub>final</sub> / X<sub>stock</sub>", "m<sub>agarose totale</sub> = p × n<sub>gels</sub> × V<sub>gel</sub> / 100"], "vars": [["V<sub>cuve</sub>", "volume de remplissage d'une cuve", "mL"]], "units": "Prévoir une marge (10 à 20 %) pour les pertes et le rinçage.", "method": ["Calculer le volume de tampon 1X pour les gels.", "Ajouter le volume des cuves.", "Ajouter une marge et arrondir à un volume pratique.", "Calculer le volume de stock et d'eau.", "Calculer la masse d'agarose."], "ex": {"q": "Trois gels de 50 mL à 1 % et une cuve de 400 mL, avec du TAE 50X.", "steps": ["Tampon 1X : 3 × 50 + 400 = 550 mL ; on prépare 600 mL.", "TAE 50X : 600 / 50 = 12 mL + 588 mL d'eau.", "Agarose : 1 × 150 / 100 = 1,5 g (0,5 g par gel)."], "r": "600 mL de TAE 1X (12 mL de 50X + 588 mL d'eau) ; 1,5 g d'agarose au total."}, "check": "La cuve et les gels sont au même 1X : condition nécessaire à une migration homogène.", "err": ["Préparer le gel en TAE et la cuve en TBE.", "Oublier le volume de tampon des gels dans le total."], "quick": ["Deux gels de 35 mL et une cuve de 300 mL, stock 10X : volume de stock (sans marge) ?", "37 mL."], "tables": []}]}, {"id": "m7", "num": 7, "title": "PCR et master mix", "intro": "Les volumes d'une PCR se calculent composant par composant. La composition donnée ici est un exemple pédagogique compatible avec un protocole Taq standard : les concentrations et volumes dépendent toujours du kit, de la polymérase et du protocole validé du laboratoire.", "notions": [{"code": "7.1", "t": "Principe du calcul des volumes de réactifs", "use": "Construire n'importe quel tableau de pipetage PCR, qPCR ou RT-PCR.", "def": "Chaque composant est dilué dans le volume réactionnel total. On applique C<sub>1</sub>V<sub>1</sub> = C<sub>2</sub>V<sub>2</sub> à chacun, puis l'eau complète au volume réactionnel.", "f": ["V<sub>i</sub> = C<sub>finale,i</sub> × V<sub>réaction</sub> / C<sub>stock,i</sub>", "V<sub>enzyme</sub> = U<sub>par réaction</sub> / C<sub>stock</sub> (U/µL)", "V<sub>eau</sub> = V<sub>réaction</sub> − Σ V<sub>i</sub>"], "vars": [["V<sub>réaction</sub>", "volume réactionnel total", "µL (10 à 50)"], ["C<sub>stock,i</sub>", "concentration du stock du composant i", "X, mM, µM, U/µL"], ["U", "unités enzymatiques", "U"]], "units": "Convertir stock et final dans la même unité : dNTP 10 mM et 200 µM → 10 mM et 0,2 mM. « 10 mM dNTP » désigne en général 10 mM de chaque dNTP (à vérifier sur l'étiquette).", "method": ["Lister les composants et leurs stocks.", "Fixer les concentrations finales selon le protocole.", "Calculer chaque volume.", "Calculer l'eau.", "Vérifier que V<sub>eau</sub> ≥ 0."], "ex": {"q": "Volume de MgCl<sub>2</sub> 25 mM pour 2,0 mM final dans 50 µL ?", "steps": ["V = 2,0 × 50 / 25 = 4 µL."], "r": "4 µL."}, "check": "25 / 2 = facteur 12,5 ; 50 / 4 = 12,5 : cohérent.", "err": ["Oublier que le tampon fourni contient déjà du MgCl<sub>2</sub> (le Mg ajouté s'additionne alors).", "Mélanger µM et mM pour les dNTP."], "quick": ["Volume d'amorce 10 µM pour 0,4 µM dans 50 µL ?", "2 µL."], "tables": []}, {"code": "7.2", "t": "Tableau de pipetage d'une réaction", "use": "Document à recopier dans le cahier de laboratoire avant chaque PCR.", "def": "Le tableau liste pour chaque composant : stock, concentration finale, volume pour une réaction. La dernière ligne vérifie que le total est égal au volume réactionnel.", "f": ["Σ V<sub>i</sub> + V<sub>eau</sub> = V<sub>réaction</sub>"], "vars": [["Σ", "somme des volumes de tous les composants", "µL"]], "units": "Tous les volumes en µL.", "method": ["Remplir les colonnes stock et final.", "Calculer chaque volume (notion précédente).", "Calculer l'eau par différence.", "Faire la somme de contrôle."], "ex": {"q": "Calculer le volume d'eau d'une réaction de 25 µL (tableau ci-dessus).", "steps": ["Somme des réactifs : 2,5 + 1,5 + 0,5 + 0,5 + 0,5 + 0,125 + 2,5 = 8,125 µL.", "Eau : 25 − 8,125 = 16,875 µL."], "r": "16,875 µL d'eau."}, "check": "Concentrations retrouvées : Mg 25 × 1,5 / 25 = 1,5 mM ; dNTP 10 × 0,5 / 25 = 0,2 mM ; amorces 10 × 0,5 / 25 = 0,2 µM ; Taq 0,125 × 5 = 0,625 U (soit 1,25 U pour 50 µL).", "err": ["Oublier une amorce dans la somme.", "Calculer l'eau avant d'avoir fixé le volume de matrice."], "quick": ["Pour la même composition en 50 µL, volume d'eau ?", "33,75 µL (tous les volumes doublent)."], "tables": [{"head": ["Composant", "Stock", "Final", "1 réaction", "Master mix (×11)"], "rows": [["Tampon 10X (sans Mg)", "10 X", "1 X", "2,5 µL", "27,5 µL"], ["MgCl<sub>2</sub>", "25 mM", "1,5 mM", "1,5 µL", "16,5 µL"], ["dNTP (chacun)", "10 mM", "0,2 mM (200 µM)", "0,5 µL", "5,5 µL"], ["Amorce sens", "10 µM", "0,2 µM", "0,5 µL", "5,5 µL"], ["Amorce antisens", "10 µM", "0,2 µM", "0,5 µL", "5,5 µL"], ["Taq polymérase", "5 U/µL", "0,625 U/réaction", "0,125 µL", "1,375 µL"], ["ADN matrice", "20 ng/µL", "50 ng/réaction", "2,5 µL", "ajout séparé"], ["Eau sans nucléase", "—", "—", "16,875 µL", "185,625 µL"], ["<b>Total</b>", "", "", "<b>25 µL</b>", "<b>247,5 µL</b>"]]}]}, {"code": "7.3", "t": "Amorces : remise en suspension et dilution", "use": "Les amorces sont livrées lyophilisées avec une quantité en nmol ; on prépare un stock à 100 µM puis une solution de travail à 10 µM.", "def": "Pour obtenir une concentration C (µM) à partir de n nmol, le volume de remise en suspension est V = n / C. Avec C = 100 µM, V (µL) = 10 × n (nmol).", "f": ["V (µL) = n (nmol) × 1000 / C (µM)", "Stock 100 µM : V (µL) = 10 × n (nmol)", "Travail 10 µM : dilution au 1/10"], "vars": [["n", "quantité d'oligonucléotide fournie", "nmol"], ["C", "concentration voulue", "µM = pmol/µL"]], "units": "1 µM = 1 pmol/µL ; 1 nmol = 1000 pmol.", "method": ["Lire la quantité en nmol sur la fiche du fournisseur.", "Calculer le volume de tampon TE ou d'eau.", "Préparer la solution de travail par dilution au 1/10."], "ex": {"q": "Une amorce est livrée à 32,5 nmol. Préparer un stock à 100 µM, puis 100 µL de solution de travail à 10 µM.", "steps": ["V = 32,5 × 1000 / 100 = 325 µL de TE.", "Travail : 10 µL de stock + 90 µL de TE."], "r": "325 µL ; puis 10 µL + 90 µL."}, "check": "32,5 nmol = 32 500 pmol ; 32 500 pmol / 325 µL = 100 pmol/µL = 100 µM.", "err": ["Confondre nmol et pmol (volume 1000 fois trop petit).", "Utiliser directement le stock à 100 µM dans la PCR (volume 10 fois plus faible, difficile à pipeter)."], "quick": ["Volume pour remettre 18 nmol à 100 µM ?", "180 µL."], "tables": []}, {"code": "7.4", "t": "Matrice d'ADN : quantité et volume", "use": "Mettre la bonne quantité d'ADN génomique, plasmidique ou de produit d'extraction dans chaque réaction.", "def": "Le volume de matrice est la quantité voulue divisée par la concentration de l'extrait. Si ce volume est trop petit pour être pipeté, on dilue l'extrait.", "f": ["V<sub>matrice</sub> = quantité (ng) / C (ng/µL)"], "vars": [["C", "concentration de l'extrait", "ng/µL"]], "units": "ng / (ng/µL) = µL.", "method": ["Calculer le volume.", "S'il est inférieur à 1 µL, préparer une dilution intermédiaire.", "S'il dépasse le volume disponible pour la matrice, réduire l'eau en conséquence ou concentrer."], "ex": {"q": "On veut 50 ng d'ADN par réaction ; l'extrait est à 125 ng/µL.", "steps": ["V = 50 / 125 = 0,4 µL : trop faible pour un pipetage fiable.", "Dilution au 1/10 : 12,5 ng/µL ; V = 50 / 12,5 = 4 µL."], "r": "Diluer l'extrait au 1/10 puis prélever 4 µL."}, "check": "4 µL × 12,5 ng/µL = 50 ng.", "err": ["Pipeter 0,4 µL avec une P10.", "Oublier d'ajuster l'eau quand le volume de matrice change."], "quick": ["100 ng à partir d'un extrait à 40 ng/µL ?", "2,5 µL."], "tables": []}, {"code": "7.5", "t": "Master mix pour plusieurs échantillons et surplus de pipetage", "use": "Préparer en une seule fois les réactifs communs pour n tubes, avec une seule série de pipetages plus précis.", "def": "Le master mix contient tous les composants communs, multipliés par le nombre de réactions plus un surplus qui compense les pertes (liquide resté dans les cônes et sur les parois).", "f": ["Facteur = n × (1 + s)   ou   n + 1 (une réaction en plus)", "V<sub>i, MM</sub> = V<sub>i, 1 réaction</sub> × facteur", "Volume distribué par tube = V<sub>réaction</sub> − V<sub>matrice</sub>"], "vars": [["n", "nombre de réactions (échantillons + témoins)", "—"], ["s", "surplus", "fraction (ex. 0,10)"]], "units": "Compter les témoins négatif et positif dans n.", "method": ["Compter n (échantillons + témoins).", "Choisir le surplus (10 % ou n + 1).", "Multiplier chaque volume commun.", "Distribuer le volume par tube, puis ajouter la matrice."], "ex": {"q": "8 échantillons + témoin négatif + témoin positif, réaction de 25 µL (tableau précédent), surplus 10 %.", "steps": ["n = 10 ; facteur = 10 × 1,1 = 11.", "Exemple : Taq 0,125 × 11 = 1,375 µL ; eau 16,875 × 11 = 185,625 µL.", "Volume de master mix par tube : 25 − 2,5 = 22,5 µL ; volume total préparé : 247,5 µL."], "r": "Facteur 11 ; distribuer 22,5 µL par tube puis 2,5 µL de matrice (ou d'eau pour le témoin négatif)."}, "check": "11 × 22,5 = 247,5 µL, soit 22,5 µL de surplus (une réaction) après distribution de 10 × 22,5 µL.", "err": ["Oublier les témoins dans n.", "Mettre la matrice dans le master mix alors que chaque tube a un ADN différent.", "Ne pas homogénéiser le master mix avant distribution."], "quick": ["Volume de tampon 10X (2,5 µL par réaction) pour 23 réactions + 10 % ?", "63,25 µL."], "tables": []}, {"code": "7.6", "t": "Vérifications et master mix commerciaux", "use": "Contrôler un tableau avant de pipeter et adapter les calculs aux kits « 2X master mix » prêts à l'emploi.", "def": "Un master mix commercial 2X contient tampon, Mg, dNTP et enzyme à deux fois la concentration finale : il représente la moitié du volume réactionnel.", "f": ["C<sub>finale,i</sub> = C<sub>stock,i</sub> × V<sub>i</sub> / V<sub>réaction</sub>", "V<sub>MM 2X</sub> = V<sub>réaction</sub> / 2"], "vars": [["C<sub>finale,i</sub>", "concentration recalculée", "unité du stock"]], "units": "Le contrôle se fait dans l'unité du stock.", "method": ["Recalculer chaque concentration finale.", "Vérifier la somme des volumes.", "Vérifier que chaque volume est pipetable (ou passer par le master mix)."], "ex": {"q": "Réaction de 20 µL avec un master mix 2X, amorces 10 µM à 0,5 µM, 2 µL d'ADN.", "steps": ["Master mix : 20 / 2 = 10 µL.", "Chaque amorce : 0,5 × 20 / 10 = 1 µL.", "Eau : 20 − (10 + 1 + 1 + 2) = 6 µL."], "r": "10 µL MM 2X + 1 µL + 1 µL d'amorces + 2 µL d'ADN + 6 µL d'eau."}, "check": "Somme : 10 + 1 + 1 + 2 + 6 = 20 µL.", "err": ["Ajouter du tampon 10X à un master mix 2X qui en contient déjà.", "Ne pas recalculer le Mg quand on en ajoute à un tampon qui en contient."], "quick": ["Réaction de 50 µL avec un master mix 5X : volume de master mix ?", "10 µL."], "tables": []}]}, {"id": "m8", "num": 8, "title": "Préparation des milieux de culture", "intro": "Les milieux déshydratés se préparent à partir d'une concentration en g/L indiquée sur la fiche technique. Les valeurs ci-dessous sont pédagogiques : la concentration du milieu et les conditions de préparation doivent suivre la fiche technique du fabricant et les procédures validées du laboratoire.", "notions": [{"code": "8.1", "t": "Lire une fiche technique de milieu", "use": "Repérer la masse de poudre par litre, la composition, le pH final et les conditions de stérilisation.", "def": "La fiche technique donne la formule type en g/L, la quantité de poudre à dissoudre par litre d'eau, le pH final à 25 °C et le mode de stérilisation.", "f": ["m<sub>poudre</sub> = C<sub>poudre</sub> (g/L) × V (L)"], "vars": [["C<sub>poudre</sub>", "masse de milieu déshydraté par litre", "g/L"]], "units": "La somme des composants de la formule type est en général égale à la masse de poudre par litre.", "method": ["Relever la masse par litre.", "Relever les additifs à ajouter après stérilisation.", "Relever le pH attendu et les conditions d'autoclavage."], "ex": {"q": "Avec la fiche ci-dessus, quelle masse de poudre pour 1 L ? Quelle quantité d'agar cela représente-t-il ?", "steps": ["Poudre : 28,0 g pour 1 L.", "Agar : 15,0 g/L, soit 15/28 = 54 % de la masse de poudre."], "r": "28,0 g, dont 15,0 g d'agar."}, "check": "5 + 3 + 5 + 15 = 28 g/L.", "err": ["Ajouter de l'agar à un milieu qui en contient déjà.", "Utiliser la valeur d'un autre fabricant pour un milieu de même nom."], "quick": ["Quelle masse de chlorure de sodium apporte 250 mL de ce milieu ?", "1,25 g."], "tables": [{"head": ["Fiche pédagogique fictive : « Gélose nutritive GN-péda »", "g/L"], "rows": [["Peptone", "5,0"], ["Extrait de viande", "3,0"], ["Chlorure de sodium", "5,0"], ["Agar", "15,0"], ["<b>Total : poudre à dissoudre</b>", "<b>28,0 g/L</b>"], ["pH final à 25 °C", "7,0 ± 0,2"], ["Stérilisation", "121 °C, 15 min (exemple)"]]}]}, {"code": "8.2", "t": "Masse de poudre pour différents volumes", "use": "Préparer 100 mL, 250 mL, 500 mL ou 1 L d'un bouillon ou d'une gélose.", "def": "La masse est proportionnelle au volume final.", "f": ["m (g) = C (g/L) × V (mL) / 1000"], "vars": [["C", "masse de poudre par litre", "g/L"], ["V", "volume final", "mL"]], "units": "Diviser par 1000 lorsque V est en mL.", "method": ["Lire C sur la fiche.", "Calculer m.", "Dissoudre dans l'eau, chauffer si nécessaire, répartir puis stériliser selon la fiche."], "ex": {"q": "Préparer 250 mL de bouillon LB (25 g/L).", "steps": ["m = 25 × 250 / 1000 = 6,25 g."], "r": "6,25 g de poudre pour 250 mL."}, "check": "1/4 de litre → 1/4 de 25 g.", "err": ["Multiplier 25 par 250 (6 250 g).", "Peser la poudre pour le volume de flacon et non pour le volume de milieu."], "quick": ["Masse de milieu à 38 g/L pour 750 mL ?", "28,5 g."], "tables": [{"head": ["Milieu (exemple)", "g/L", "100 mL", "250 mL", "500 mL", "1 L"], "rows": [["Bouillon LB (Miller)", "25", "2,5 g", "6,25 g", "12,5 g", "25 g"], ["Gélose LB (Miller)", "40", "4 g", "10 g", "20 g", "40 g"], ["Bouillon trypticase soja", "30", "3 g", "7,5 g", "15 g", "30 g"], ["Gélose GN-péda (fictive)", "28", "2,8 g", "7 g", "14 g", "28 g"]]}]}, {"code": "8.3", "t": "Milieux solides et masse d'agar", "use": "Transformer un bouillon en gélose ou préparer une gélose molle.", "def": "On ajoute l'agar à une concentration en g/L (environ 15 g/L pour une gélose ordinaire, plus faible pour une gélose molle). Les deux calculs (bouillon et agar) se font séparément.", "f": ["m<sub>agar</sub> = C<sub>agar</sub> × V", "m<sub>bouillon</sub> = C<sub>bouillon</sub> × V"], "vars": [["C<sub>agar</sub>", "concentration en agar", "g/L (ex. 15)"]], "units": "1,5 % m/V d'agar = 15 g/L.", "method": ["Calculer la masse de base de bouillon.", "Calculer la masse d'agar.", "Dissoudre l'agar par chauffage avant ou pendant l'autoclavage."], "ex": {"q": "Préparer 500 mL de gélose à partir de bouillon LB en poudre (25 g/L) et d'agar (15 g/L).", "steps": ["Bouillon : 25 × 0,5 = 12,5 g.", "Agar : 15 × 0,5 = 7,5 g."], "r": "12,5 g de bouillon LB + 7,5 g d'agar, compléter à 500 mL."}, "check": "Total 20 g pour 0,5 L, soit 40 g/L : on retrouve la gélose LB en poudre prête à l'emploi.", "err": ["Ajouter 15 g d'agar pour 500 mL (concentration doublée).", "Oublier l'agar."], "quick": ["Masse d'agar pour 300 mL d'une gélose molle à 0,7 % ?", "2,1 g."], "tables": []}, {"code": "8.4", "t": "Nombre de boîtes et volume total", "use": "Prévoir le volume de milieu pour une séance de TP ou un essai.", "def": "Le nombre de boîtes est la partie entière du volume disponible divisé par le volume coulé par boîte. Le volume à préparer pour n boîtes inclut une marge de pertes.", "f": ["n<sub>boîtes</sub> = ⌊ V<sub>milieu</sub> / V<sub>boîte</sub> ⌋", "V<sub>à préparer</sub> = n × V<sub>boîte</sub> × (1 + marge)"], "vars": [["V<sub>boîte</sub>", "volume coulé par boîte", "mL (souvent 15 à 25 mL pour une boîte de 90 mm)"]], "units": "⌊ ⌋ signifie arrondir à l'entier inférieur : une boîte incomplète n'est pas une boîte.", "method": ["Fixer le volume par boîte selon la pratique du laboratoire.", "Calculer le nombre de boîtes ou le volume.", "Ajouter la marge, arrondir à un volume de flacon."], "ex": {"q": "Combien de boîtes de 20 mL avec 500 mL ? Quel volume préparer pour 40 boîtes avec 10 % de marge ?", "steps": ["n = 500 / 20 = 25 boîtes.", "V = 40 × 20 × 1,1 = 880 mL → préparer 900 mL ou 1 L."], "r": "25 boîtes ; 880 mL minimum pour 40 boîtes."}, "check": "40 × 20 = 800 mL sans marge ; la marge couvre les pertes au coulage.", "err": ["Arrondir 23,7 boîtes à 24.", "Oublier la marge."], "quick": ["Nombre de boîtes de 18 mL dans 400 mL ?", "22."], "tables": []}, {"code": "8.5", "t": "Ajout d'un supplément à partir d'un stock", "use": "Ajouter un antibiotique, du glucose, un indicateur ou un facteur de croissance à un milieu stérile refroidi.", "def": "Le supplément est un C<sub>1</sub>V<sub>1</sub> = C<sub>2</sub>V<sub>2</sub> avec le volume de milieu comme volume final. Si le volume ajouté est petit (≤ 1 %), la variation de volume est négligeable.", "f": ["V<sub>suppl</sub> = C<sub>finale</sub> × V<sub>milieu</sub> / C<sub>stock</sub>", "C<sub>finale réelle</sub> = C<sub>stock</sub> × V<sub>suppl</sub> / (V<sub>milieu</sub> + V<sub>suppl</sub>)"], "vars": [["C<sub>stock</sub>", "concentration du supplément", "mg/mL, %…"]], "units": "Convertir C<sub>stock</sub> et C<sub>finale</sub> dans la même unité (100 mg/mL = 100 000 µg/mL).", "method": ["Convertir les unités.", "Calculer V<sub>suppl</sub>.", "Vérifier si la dilution du milieu est négligeable.", "Ajouter au milieu refroidi (environ 45 à 50 °C pour une gélose) pour les composés thermosensibles."], "ex": {"q": "Ajouter de l'ampicilline (stock 100 mg/mL) à 500 mL de gélose pour 100 µg/mL final.", "steps": ["100 mg/mL = 100 000 µg/mL.", "V = 100 × 500 / 100 000 = 0,5 mL = 500 µL.", "C réelle = 100 000 × 0,5 / 500,5 = 99,9 µg/mL (écart négligeable)."], "r": "500 µL de stock pour 500 mL de milieu."}, "check": "Stock 1000 fois plus concentré que la cible : 1 µL par mL de milieu.", "err": ["Ajouter l'antibiotique à un milieu trop chaud.", "Oublier la conversion mg/mL → µg/mL (volume 1000 fois trop grand)."], "quick": ["Volume de glucose 20 % pour 250 mL de milieu à 0,4 % ?", "5 mL."], "tables": []}, {"code": "8.6", "t": "Quantité de poudre commerciale à prévoir", "use": "Commander ou réserver le milieu pour une série d'essais.", "def": "La quantité totale est la somme des masses pour chaque préparation ; on la compare au conditionnement disponible.", "f": ["m<sub>totale</sub> = C × Σ V<sub>i</sub>", "n<sub>flacons</sub> = ⌈ m<sub>totale</sub> / m<sub>flacon</sub> ⌉"], "vars": [["m<sub>flacon</sub>", "masse d'un conditionnement", "g"]], "units": "Arrondir le nombre de flacons à l'entier supérieur.", "method": ["Additionner les volumes.", "Calculer la masse totale.", "Comparer au conditionnement."], "ex": {"q": "Une semaine de TP utilise 6 préparations de 1 L de gélose à 40 g/L. Flacons de 500 g.", "steps": ["m = 40 × 6 = 240 g.", "240 / 500 = 0,48 → 1 flacon."], "r": "240 g, un flacon de 500 g suffit."}, "check": "Reste 260 g après la semaine.", "err": ["Calculer avec le volume d'une seule préparation."], "quick": ["Masse pour 12 préparations de 250 mL à 30 g/L ?", "90 g."], "tables": []}]}, {"id": "m9", "num": 9, "title": "Dénombrement microbien : UFC/mL et UFC/g", "intro": "Module prioritaire. Le dénombrement sur boîte estime le nombre d'unités formant colonie (UFC) dans l'échantillon d'origine à partir des colonies comptées, du volume ensemencé et de la dilution. Les règles de sélection des boîtes et d'expression du résultat dépendent de la norme ou de la méthode appliquée (par exemple ISO 7218 pour les aliments, FDA BAM chapitre 3).", "notions": [{"code": "9.1", "t": "Principe et données nécessaires", "use": "Savoir quelles informations noter pendant la manipulation pour pouvoir calculer ensuite.", "def": "Une UFC est une cellule ou un amas de cellules à l'origine d'une colonie visible. Le calcul nécessite : le nombre de colonies, le volume ensemencé, la fraction de dilution du tube ensemencé et, pour un solide, la préparation de la suspension mère.", "f": ["Concentration du tube ensemencé = C / V", "Concentration de l'échantillon = (C / V) × F = C / (V × d)"], "vars": [["C", "colonies comptées sur la boîte", "UFC"], ["V", "volume ensemencé", "mL"], ["d", "fraction de dilution du tube ensemencé (par rapport à l'échantillon)", "ex. 10<sup>-4</sup>"], ["F", "facteur de dilution = 1/d", "ex. 10<sup>4</sup>"]], "units": "Ensemencement en surface : V typique 0,1 mL. Incorporation en masse : V typique 1 mL.", "method": ["Noter pour chaque boîte : dilution, volume, nombre de colonies.", "Retenir les boîtes dénombrables selon la méthode.", "Appliquer la formule adaptée."], "ex": {"q": "Une boîte ensemencée avec 0,1 mL du tube 10<sup>-3</sup> porte 42 colonies. Concentration du tube 10<sup>-3</sup> et de l'échantillon ?", "steps": ["Tube : 42 / 0,1 = 420 UFC/mL.", "Échantillon : 420 × 10<sup>3</sup> = 4,2 × 10<sup>5</sup> UFC/mL."], "r": "4,2 × 10<sup>5</sup> UFC/mL."}, "check": "Deux chemins (tube puis facteur, ou formule directe) donnent le même résultat.", "err": ["Oublier de diviser par 0,1 mL (résultat 10 fois trop faible).", "Utiliser le numéro du tube au lieu de la fraction de dilution."], "quick": ["35 colonies, 1 mL du tube 10<sup>-2</sup> : UFC/mL ?", "3,5 × 10<sup>3</sup> UFC/mL."], "tables": []}, {"code": "9.2", "t": "Calcul à partir d'une seule boîte", "use": "Situation la plus simple : une seule boîte dans la zone dénombrable.", "def": "La concentration estimée est le nombre de colonies divisé par le produit du volume ensemencé et de la fraction de dilution.", "f": ["N = C / (V × d)"], "vars": [["N", "concentration estimée dans l'échantillon", "UFC/mL"], ["C", "nombre de colonies comptées", "UFC"], ["V", "volume ensemencé", "mL"], ["d", "fraction de dilution de l'échantillon ensemencé", "sans unité (≤ 1)"]], "units": "UFC / (mL × sans unité) = UFC/mL. d est une fraction (10<sup>-4</sup>), jamais un facteur (10<sup>4</sup>).", "method": ["Vérifier que la boîte est dénombrable.", "Convertir V en mL.", "Calculer N.", "Exprimer en notation scientifique avec deux chiffres significatifs (règle usuelle, ex. ISO 7218)."], "ex": {"q": "156 colonies sur une boîte ensemencée en surface avec 100 µL de la dilution 10<sup>-4</sup>.", "steps": ["V = 100 µL = 0,1 mL ; d = 10<sup>-4</sup>.", "V × d = 0,1 × 10<sup>-4</sup> = 10<sup>-5</sup> mL.", "N = 156 / 10<sup>-5</sup> = 1,56 × 10<sup>7</sup> UFC/mL."], "r": "N ≈ 1,6 × 10<sup>7</sup> UFC/mL."}, "check": "log<sub>10</sub>(1,6 × 10<sup>7</sup>) ≈ 7,2 : plausible pour une suspension bactérienne diluée.", "err": ["Écrire N = C × V × d.", "Remplacer d par 10<sup>4</sup> : résultat 10<sup>8</sup> fois trop faible.", "Garder 1,56 × 10<sup>7</sup> : précision non justifiée."], "quick": ["230 colonies, 0,1 mL de 10<sup>-6</sup> ?", "2,3 × 10<sup>9</sup> UFC/mL."], "tables": []}, {"code": "9.3", "t": "Calcul à partir de plusieurs boîtes : moyenne pondérée", "use": "Lorsque deux dilutions successives donnent des boîtes dénombrables, on utilise toutes les colonies pour une estimation plus robuste.", "def": "La moyenne pondérée de l'ISO 7218 (et du BAM) additionne toutes les colonies retenues et divise par le volume « équivalent » ensemencé. Les boîtes de la dilution suivante (10 fois plus diluée) comptent pour 0,1.", "f": ["N = ΣC / [V × (n<sub>1</sub> + 0,1 n<sub>2</sub>) × d<sub>1</sub>]", "Une boîte par dilution : N = ΣC / (V × 1,1 × d<sub>1</sub>)"], "vars": [["ΣC", "somme des colonies de toutes les boîtes retenues", "UFC"], ["n<sub>1</sub>", "nombre de boîtes retenues à la première dilution (la moins diluée)", "—"], ["n<sub>2</sub>", "nombre de boîtes retenues à la dilution suivante", "—"], ["d<sub>1</sub>", "fraction de dilution de la première dilution retenue", "ex. 10<sup>-3</sup>"]], "units": "La formule suppose des dilutions successives au 1/10 et un même volume ensemencé. Les critères de sélection (nombre minimal et maximal de colonies) sont fixés par la méthode utilisée.", "method": ["Retenir les boîtes selon les critères de la méthode.", "Additionner les colonies.", "Calculer le dénominateur.", "Arrondir à deux chiffres significatifs."], "ex": {"q": "Étalement de 0,1 mL en double. Dilution 10<sup>-3</sup> : 187 et 205 colonies ; dilution 10<sup>-4</sup> : 21 et 17 colonies.", "steps": ["ΣC = 187 + 205 + 21 + 17 = 430.", "Dénominateur : 0,1 × (2 + 0,1 × 2) × 10<sup>-3</sup> = 2,2 × 10<sup>-4</sup> mL.", "N = 430 / 2,2 × 10<sup>-4</sup> = 1,95 × 10<sup>6</sup> UFC/mL."], "r": "N ≈ 2,0 × 10<sup>6</sup> UFC/mL."}, "check": "Dilution 10<sup>-3</sup> seule : moyenne 196 → 1,96 × 10<sup>6</sup> ; dilution 10<sup>-4</sup> seule : moyenne 19 → 1,9 × 10<sup>6</sup>. Les deux estimations concordent.", "err": ["Faire la moyenne des concentrations sans pondération quand les comptes sont très différents.", "Utiliser d<sub>2</sub> au lieu de d<sub>1</sub> au dénominateur.", "Inclure une boîte non dénombrable dans ΣC."], "quick": ["Une boîte par dilution, 1 mL : 10<sup>-2</sup> : 120 ; 10<sup>-3</sup> : 14. N ?", "1,2 × 10<sup>4</sup> UFC/mL (134 / 0,011 = 12 182)."], "tables": []}, {"code": "9.4", "t": "Répétitions, moyennes et log<sub>10</sub> UFC/mL", "use": "Exprimer des résultats de répétitions biologiques ou techniques, comparer des conditions (réduction logarithmique).", "def": "Pour des boîtes de la même dilution, la concentration est la moyenne des colonies divisée par V × d. Les concentrations microbiennes se comparent en log<sub>10</sub>, car elles varient sur plusieurs ordres de grandeur.", "f": ["N = moyenne(C) / (V × d)", "log<sub>10</sub> N", "Réduction = log<sub>10</sub> N<sub>avant</sub> − log<sub>10</sub> N<sub>après</sub>"], "vars": [["log<sub>10</sub> N", "logarithme décimal de la concentration", "log<sub>10</sub> UFC/mL"]], "units": "Une réduction de 1 log correspond à une division par 10 (90 % d'inactivation) ; 3 log à une division par 1000 (99,9 %).", "method": ["Calculer la concentration de chaque répétition.", "Calculer la moyenne et l'écart-type (sur les valeurs ou sur les log, selon le protocole).", "Exprimer en log<sub>10</sub>."], "ex": {"q": "Trois boîtes de la dilution 10<sup>-5</sup> (0,1 mL) : 48, 61 et 55 colonies.", "steps": ["Moyenne : (48 + 61 + 55) / 3 = 54,67 colonies.", "N = 54,67 / (0,1 × 10<sup>-5</sup>) = 5,47 × 10<sup>7</sup> UFC/mL.", "log<sub>10</sub> N = 7,74."], "r": "N ≈ 5,5 × 10<sup>7</sup> UFC/mL ; log<sub>10</sub> ≈ 7,74."}, "check": "Écart-type des comptes : 6,5 colonies, CV ≈ 12 % : dispersion compatible avec un comptage de colonies.", "err": ["Faire la moyenne de log et la reconvertir sans le signaler : la moyenne géométrique diffère de la moyenne arithmétique.", "Calculer un log d'un résultat nul."], "quick": ["Un traitement fait passer de 3,2 × 10<sup>7</sup> à 4,0 × 10<sup>4</sup> UFC/mL. Réduction ?", "2,9 log (7,51 − 4,60)."], "tables": []}, {"code": "9.5", "t": "Échantillons solides : UFC/g", "use": "Aliments, sols, boues, tissus : on dénombre par gramme d'échantillon.", "def": "Le solide est d'abord mis en suspension (suspension mère), en général au 1/10 : m g d'échantillon + 9 × m mL de diluant (ex. 10 g + 90 mL ou 25 g + 225 mL, selon ISO 6887). La suspension mère est alors la dilution 10<sup>-1</sup> par rapport à l'échantillon ; les dilutions décimales suivantes en découlent.", "f": ["d<sub>SM</sub> = m / (m + V<sub>diluant</sub>)   (en assimilant 1 mL de diluant à 1 g)", "d<sub>totale</sub> = d<sub>SM</sub> × d<sub>série</sub>", "N (UFC/g) = C / (V × d<sub>totale</sub>)"], "vars": [["m", "masse de la prise d'essai", "g"], ["V<sub>diluant</sub>", "volume de diluant ajouté", "mL"], ["d<sub>totale</sub>", "fraction de dilution par rapport au solide", "—"]], "units": "Données supplémentaires indispensables : masse exacte de la prise d'essai, volume de diluant, et la manière dont les dilutions sont numérotées (par rapport au solide ou à la suspension mère).", "method": ["Calculer la fraction de dilution de la suspension mère.", "Multiplier par la fraction des dilutions suivantes.", "Appliquer N = C / (V × d<sub>totale</sub>).", "Exprimer en UFC/g."], "ex": {"q": "25 g de fromage + 225 mL de diluant. Dilutions décimales ensuite. 1 mL de la dilution notée 10<sup>-3</sup> (par rapport à l'échantillon) incorporé : 86 colonies.", "steps": ["d<sub>SM</sub> = 25 / 250 = 10<sup>-1</sup>.", "La dilution 10<sup>-3</sup> = SM puis deux dilutions au 1/10.", "N = 86 / (1 × 10<sup>-3</sup>) = 8,6 × 10<sup>4</sup> UFC/g."], "r": "8,6 × 10<sup>4</sup> UFC/g."}, "check": "Si l'on avait oublié la suspension mère (d = 10<sup>-2</sup>), le résultat serait 10 fois trop faible.", "err": ["Ne pas compter la suspension mère comme première dilution.", "Utiliser 25 g + 250 mL (dilution 25/275 ≈ 1/11).", "Confondre UFC/g et UFC/mL dans le compte rendu."], "quick": ["10 g + 90 mL ; 0,1 mL de la dilution 10<sup>-2</sup> (par rapport au solide) : 64 colonies. UFC/g ?", "6,4 × 10<sup>4</sup> UFC/g."], "tables": []}, {"code": "9.6", "t": "Interprétation : limite de détection, boîtes vides, boîtes non dénombrables", "use": "Rendre un résultat honnête quand les boîtes sortent de la zone dénombrable.", "def": "La limite de détection (LD) correspond à une colonie sur l'ensemble des boîtes ensemencées à la plus faible dilution. Zéro colonie ne signifie pas zéro bactérie : on rend « &lt; LD ». Une boîte trop chargée (non dénombrable, « NC » ou « TNTC ») ne donne qu'une valeur minimale ou une estimation.", "f": ["LD = 1 / (V × d × n<sub>boîtes</sub>)", "Aucune colonie : N &lt; LD", "Boîtes saturées : N &gt; C<sub>max</sub> / (V × d) (estimation)"], "vars": [["LD", "limite de détection", "UFC/mL ou UFC/g"], ["C<sub>max</sub>", "limite haute de la zone dénombrable de la méthode", "colonies"]], "units": "Les plages dénombrables varient selon les références et les méthodes (par exemple 25–250, 30–300, ou une limite haute de 300 colonies avec un minimum défini par la norme). Toujours appliquer la méthode du laboratoire.", "method": ["Classer chaque boîte : dénombrable, trop peu de colonies, aucune colonie, non dénombrable.", "Appliquer la règle de calcul de la méthode.", "Rendre le résultat avec le signe adapté (&lt;, &gt;, « estimé »)."], "ex": {"q": "Une eau traitée est ensemencée par filtration de 100 mL ; aucune colonie après incubation. Résultat ?", "steps": ["Le volume analysé est 100 mL non dilué : d = 1.", "LD = 1 / (100 × 1) = 0,01 UFC/mL = 1 UFC/100 mL."], "r": "&lt; 1 UFC/100 mL (et non « 0 UFC/mL »)."}, "check": "Le résultat dépend du volume analysé : avec 10 mL filtrés, la LD serait 10 fois plus élevée.", "err": ["Écrire 0 UFC/mL.", "Calculer N à partir d'une boîte saturée comme si le compte était exact.", "Prendre le log d'un résultat « &lt; LD »."], "quick": ["Aucune colonie sur deux boîtes de 1 mL de la dilution 10<sup>-1</sup>. LD ?", "1 / (1 × 0,1 × 2) = 5 UFC/mL : résultat &lt; 5 UFC/mL (selon la règle de la méthode, certaines normes rendent &lt; 10)."], "tables": [{"head": ["Situation", "Expression du résultat", "Exemple (V = 0,1 mL)"], "rows": [["Aucune colonie à la plus faible dilution 10<sup>-1</sup>", "&lt; 1 / (V × d)", "&lt; 1 / (0,1 × 10<sup>-1</sup>) = &lt; 100 UFC/mL"], ["Peu de colonies (sous le minimum de la méthode)", "Valeur estimée, signalée comme telle", "4 colonies à 10<sup>-1</sup> : ≈ 400 UFC/mL (estimé)"], ["Toutes les boîtes saturées", "&gt; C<sub>max</sub> / (V × d<sub>max</sub>)", "&gt; 300 / (0,1 × 10<sup>-6</sup>) = &gt; 3 × 10<sup>9</sup>"], ["Boîte envahie ou contaminée", "Boîte non retenue", "Mention « envahissement »"]]}]}]}, {"id": "m10", "num": 10, "title": "ADN et quantification", "intro": "Calculs courants après une extraction : concentration, quantité totale, volume à prélever, dilution, mesure spectrophotométrique.", "notions": [{"code": "10.1", "t": "Concentration et quantité totale d'ADN", "use": "Savoir combien d'ADN contient un extrait et combien d'analyses il permet.", "def": "La quantité totale est le produit de la concentration par le volume. Les unités ng/µL et µg/mL sont égales.", "f": ["Q = C × V", "1 ng/µL = 1 µg/mL"], "vars": [["Q", "quantité d'ADN", "ng ou µg"], ["C", "concentration", "ng/µL"], ["V", "volume d'extrait", "µL"]], "units": "ng/µL × µL = ng ; 1000 ng = 1 µg.", "method": ["Lire la concentration.", "Multiplier par le volume d'élution.", "Convertir en µg si besoin."], "ex": {"q": "Un extrait de 50 µL est à 45 ng/µL.", "steps": ["Q = 45 × 50 = 2 250 ng = 2,25 µg."], "r": "2,25 µg d'ADN."}, "check": "45 ng/µL = 45 µg/mL ; 45 µg/mL × 0,05 mL = 2,25 µg.", "err": ["Croire que 45 ng/µL = 0,045 µg/mL."], "quick": ["Quantité dans 30 µL à 120 ng/µL ?", "3,6 µg."], "tables": []}, {"code": "10.2", "t": "Volume à prélever et dilution d'un stock d'ADN", "use": "Préparer une ligation, une digestion, une PCR, une normalisation d'échantillons à concentration identique.", "def": "Le volume à prélever est la quantité voulue divisée par la concentration. Pour normaliser, on dilue chaque extrait vers la même concentration par C<sub>1</sub>V<sub>1</sub> = C<sub>2</sub>V<sub>2</sub>.", "f": ["V = Q / C", "V<sub>1</sub> = C<sub>2</sub> × V<sub>2</sub> / C<sub>1</sub>"], "vars": [["Q", "quantité voulue", "ng"], ["C<sub>1</sub>", "concentration de l'extrait", "ng/µL"], ["C<sub>2</sub>", "concentration voulue", "ng/µL"]], "units": "Volumes en µL.", "method": ["Calculer le volume ; s'il est &lt; 1 µL, diluer.", "Pour normaliser, calculer V<sub>1</sub> pour chaque extrait, puis le volume de tampon."], "ex": {"q": "Prélever 200 ng d'un extrait à 45 ng/µL ; puis préparer 50 µL à 10 ng/µL.", "steps": ["V = 200 / 45 = 4,44 µL.", "V<sub>1</sub> = 10 × 50 / 45 = 11,11 µL + 38,89 µL de tampon."], "r": "4,44 µL ; puis 11,1 µL d'extrait + 38,9 µL de tampon."}, "check": "11,11 × 45 / 50 = 10 ng/µL.", "err": ["Diluer dans de l'eau quand le protocole impose du TE (conservation).", "Prélever sans homogénéiser (ADN génomique visqueux)."], "quick": ["Volume pour 1 µg d'un plasmide à 250 ng/µL ?", "4 µL."], "tables": []}, {"code": "10.3", "t": "Mesure spectrophotométrique (A<sub>260</sub>)", "use": "Calculer la concentration à partir d'une absorbance mesurée au spectrophotomètre (cuve de 1 cm).", "def": "Pour un trajet optique de 1 cm, une absorbance A<sub>260</sub> = 1 correspond conventionnellement à environ 50 µg/mL d'ADN double brin, 40 µg/mL d'ARN et 33 µg/mL d'ADN simple brin. Le rapport A<sub>260</sub>/A<sub>280</sub> (≈ 1,8 pour l'ADN, ≈ 2,0 pour l'ARN) renseigne sur une contamination protéique.", "f": ["C (µg/mL) = A<sub>260</sub> × facteur × F<sub>dilution</sub>", "facteur : 50 (ADNdb), 40 (ARN), 33 (ADNsb)"], "vars": [["A<sub>260</sub>", "absorbance à 260 nm", "sans unité"], ["F<sub>dilution</sub>", "facteur de dilution de l'échantillon mesuré", "sans unité"]], "units": "Le résultat en µg/mL est égal au résultat en ng/µL. Les absorbances les plus fiables se situent dans la zone de linéarité de l'appareil (souvent 0,1 à 1).", "method": ["Diluer l'échantillon si l'absorbance attendue est hors zone linéaire.", "Mesurer A<sub>260</sub> (et A<sub>280</sub>).", "Appliquer la formule avec le facteur de dilution."], "ex": {"q": "5 µL d'ADN plasmidique dans 95 µL d'eau : A<sub>260</sub> = 0,25 ; A<sub>280</sub> = 0,135.", "steps": ["F = 100 / 5 = 20.", "C = 0,25 × 50 × 20 = 250 µg/mL = 250 ng/µL.", "A<sub>260</sub>/A<sub>280</sub> = 0,25 / 0,135 = 1,85."], "r": "250 ng/µL ; rapport 1,85 compatible avec un ADN peu contaminé par des protéines."}, "check": "Sans le facteur 20, on trouverait 12,5 ng/µL, valeur de la cuve et non de l'extrait.", "err": ["Oublier le facteur de dilution.", "Utiliser 50 pour un ARN.", "Interpréter une absorbance très faible (&lt; 0,05) comme fiable."], "quick": ["ARN, A<sub>260</sub> = 0,4, dilution 1/50. Concentration ?", "800 ng/µL."], "tables": []}, {"code": "10.4", "t": "Quantité d'ADN par réaction et nombre de réactions possibles", "use": "Vérifier qu'un extrait suffit pour toutes les analyses prévues.", "def": "Le nombre de réactions possibles est la quantité totale divisée par la quantité par réaction (en gardant une réserve).", "f": ["n<sub>max</sub> = ⌊ Q<sub>totale</sub> / Q<sub>réaction</sub> ⌋"], "vars": [["Q<sub>réaction</sub>", "ADN par réaction", "ng"]], "units": "Même unité au numérateur et au dénominateur.", "method": ["Calculer Q<sub>totale</sub>.", "Diviser par Q<sub>réaction</sub>.", "Garder une réserve (ex. 20 %)."], "ex": {"q": "Extrait : 40 µL à 15 ng/µL. Chaque qPCR utilise 20 ng.", "steps": ["Q = 15 × 40 = 600 ng.", "n = 600 / 20 = 30 réactions.", "Avec 20 % de réserve : 24 réactions."], "r": "30 au maximum, 24 avec réserve."}, "check": "Chaque réaction prélève 20 / 15 = 1,33 µL ; 30 × 1,33 = 40 µL.", "err": ["Ignorer le volume mort et les répétitions techniques (triplicats)."], "quick": ["Extrait de 25 µL à 8 ng/µL ; 50 ng par réaction. Combien de réactions ?", "4."], "tables": []}]}, {"id": "m11", "num": 11, "title": "Calculs complémentaires", "intro": "Calculs ponctuels mais fréquents : antibiotiques, rendements, statistiques élémentaires, temps de génération, mélanges.", "notions": [{"code": "11.1", "t": "Dilution d'antibiotiques à partir d'un stock", "use": "Préparer un milieu sélectif ou une gamme de concentrations pour une CMI.", "def": "Le stock d'antibiotique est préparé en mg/mL (souvent 1000 fois la concentration de travail) puis dilué dans le milieu par C<sub>1</sub>V<sub>1</sub> = C<sub>2</sub>V<sub>2</sub>.", "f": ["m<sub>poudre</sub> = C<sub>stock</sub> × V<sub>stock</sub>", "V<sub>stock à ajouter</sub> = C<sub>travail</sub> × V<sub>milieu</sub> / C<sub>stock</sub>"], "vars": [["C<sub>stock</sub>", "concentration du stock", "mg/mL"], ["C<sub>travail</sub>", "concentration dans le milieu", "µg/mL"]], "units": "Convertir : 50 mg/mL = 50 000 µg/mL. Pour les poudres dont l'activité est donnée en µg/mg (puissance), corriger la masse selon la fiche.", "method": ["Préparer le stock (masse, solvant adapté, filtration stérilisante si nécessaire).", "Convertir les unités.", "Calculer le volume à ajouter."], "ex": {"q": "Préparer 10 mL de kanamycine à 50 mg/mL puis l'utiliser à 50 µg/mL dans 250 mL de milieu.", "steps": ["Poudre : 50 mg/mL × 10 mL = 500 mg.", "Ajout : 50 × 250 / 50 000 = 0,25 mL = 250 µL."], "r": "500 mg dans 10 mL ; 250 µL pour 250 mL de milieu."}, "check": "Stock 1000X : 1 µL par mL de milieu.", "err": ["Oublier la correction de puissance pour certains antibiotiques.", "Utiliser le mauvais solvant (le chloramphénicol se dissout dans l'éthanol)."], "quick": ["Volume de chloramphénicol 34 mg/mL pour 400 mL à 34 µg/mL ?", "400 µL."], "tables": []}, {"code": "11.2", "t": "Pourcentage de récupération et rendement", "use": "Évaluer une méthode de dénombrement ou d'extraction (échantillon dopé, kit d'extraction, purification).", "def": "Le pourcentage de récupération compare la quantité retrouvée à la quantité introduite. Le rendement compare la quantité obtenue à la quantité de départ ou à une quantité de matériel.", "f": ["R (%) = (quantité retrouvée / quantité introduite) × 100", "Rendement = quantité obtenue / quantité de matériel de départ"], "vars": [["R", "taux de récupération", "%"]], "units": "Les deux quantités doivent être dans la même unité (UFC, ng…).", "method": ["Exprimer les deux quantités dans la même unité.", "Calculer le rapport.", "Interpréter selon les critères de la méthode."], "ex": {"q": "Un échantillon est dopé avec 5,0 × 10<sup>5</sup> UFC ; on en retrouve 3,8 × 10<sup>5</sup>. Une extraction donne 4,5 µg d'ADN à partir de 200 mg de tissu.", "steps": ["R = 3,8 / 5,0 × 100 = 76 %.", "Rendement : 4,5 µg / 0,200 g = 22,5 µg/g."], "r": "Récupération 76 % ; rendement 22,5 µg d'ADN par g de tissu."}, "check": "Une récupération supérieure à 100 % doit faire suspecter une erreur ou une contamination.", "err": ["Comparer des UFC/mL à des UFC totales sans multiplier par le volume."], "quick": ["On attend 2 µg et on obtient 1,7 µg. Récupération ?", "85 %."], "tables": []}, {"code": "11.3", "t": "Moyenne, écart-type et coefficient de variation", "use": "Résumer des répétitions (comptages, absorbances, Ct) et juger de leur dispersion.", "def": "La moyenne est la somme divisée par le nombre de valeurs. L'écart-type d'échantillon s mesure la dispersion autour de la moyenne (dénominateur n − 1). Le CV exprime s en pourcentage de la moyenne.", "f": ["x̄ = Σ x<sub>i</sub> / n", "s = √[ Σ (x<sub>i</sub> − x̄)<sup>2</sup> / (n − 1) ]", "CV (%) = 100 × s / x̄"], "vars": [["n", "nombre de valeurs", "—"], ["s", "écart-type d'échantillon", "unité des données"]], "units": "s a l'unité des données ; le CV est sans unité.", "method": ["Calculer la moyenne.", "Calculer les écarts au carré.", "Diviser par n − 1, prendre la racine.", "Calculer le CV."], "ex": {"q": "Trois boîtes : 152, 168 et 147 colonies.", "steps": ["x̄ = 467 / 3 = 155,67.", "Écarts au carré : 13,44 ; 152,11 ; 75,11 ; somme 240,67.", "s = √(240,67 / 2) = 10,97.", "CV = 100 × 10,97 / 155,67 = 7 %."], "r": "x̄ = 155,7 ; s = 11 ; CV = 7 %."}, "check": "L'écart-type est du même ordre que les écarts observés (de 5 à 12 colonies).", "err": ["Diviser par n au lieu de n − 1 pour un échantillon.", "Calculer un écart-type avec deux valeurs et en tirer des conclusions fortes."], "quick": ["Moyenne et écart-type de 20, 22, 24 ?", "22 ; 2."], "tables": []}, {"code": "11.4", "t": "Temps de génération", "use": "Caractériser la croissance d'une souche en phase exponentielle.", "def": "En phase exponentielle, la population double à chaque génération. Le nombre de générations n se déduit des concentrations initiale et finale ; le temps de génération g est la durée divisée par n.", "f": ["N<sub>t</sub> = N<sub>0</sub> × 2<sup>n</sup>", "n = (log<sub>10</sub> N<sub>t<   function tubesSVG(n) {

  // ------------------------------------------------------------ exercices
  const exoState = { ch: 'm1', lvl: 0, ex: null, answered: false, last: null, session: { a: 0, ok: 0 } };

  function newExo() { exoState.ex = G.generate(exoState.ch, exoState.lvl); exoState.answered = false; exoState.last = null; }
  const UNIT_RE = /(?<=(?:^|\d)[\s\u00a0]?)(UFC\/(?:mL|g)|(?:mmol|µmol|mol)\/L|(?:mg|µg|ng|g)\/(?:mL|µL|L)|mM|µM|nM|mg|µg|ng|kg|mL|µL|nL|g|L|M|%|X)(?![\p{L}\d\/'’])/gu;
  const ukind = u => /UFC/.test(u) ? 'c' : /^(%|X)$/.test(u) ? 'p' : /mol|^[mµn]?M$/.test(u) ? 'o' : /\//.test(u) ? 'k' : /^[mµnk]?g$/.test(u) ? 'm' : /^[mµn]?L$/.test(u) ? 'v' : 'n';
  const cu = h => String(h).split(/(<[^>]+>)/).map((p, i) => i % 2 ? p : p.replace(UNIT_RE, m => `<span class="u u-${ukind(m)}">${m}</span>`)).join('');
  function animateAns(el, e) {

    const t0 = performance.now(), D = 900;
    (function f(t) { const p = Math.min(1, (t - t0) / D), k = 1 - Math.pow(1 - p, 4); el.innerHTML = p < 1 ? (e.int ? String(Math.round(e.answer * k)) : K.num(e.answer * k, 4)) : fin; if (p < 1) requestAnimationFrame(f); })(t0);
  }
  function exoCardHTML() {

        <div class="q2-actions"><button class="btn btn-primary" type="submit" ${st.answered ? 'disabled' : ''}>${icon('check')}Vérifier</button><button class="btn btn-ghost" type="button" data-act="reveal" ${st.answered ? 'disabled' : ''}>Solution</button></div>

      const rv = st.last.revealed, ok = st.last.ok;

    }

  const fmtAns = e => e.int ? String(e.answer) : (Math.abs(e.answer) >= 1e5 || Math.abs(e.answer) < 1e-3 ? K.sci(e.answer, 3, { trim: true }) : K.num(e.answer, 4));
  function errorsHTML() {

    const f = $('#exam-form');

      f.addEventListener('input', e => { const i = e.target.dataset.i; if (i !== undefined) { examState.answers[+i] = e.target.value; $('#exam-count').textContent = `${examState.answers.filter(Boolean).length}/${examState.qs.length} réponses saisies`; } });
      f.addEventListener('submit', async e => {
        e.preventDefault();
        const s = examState, blanks = s.qs.length - s.answers.filter(x => x && x.trim()).length;
        if (blanks && !(await confirmDialog('Soumettre maintenant ?', `${blanks} question(s) sans réponse seront comptées fausses.`, 'Soumettre'))) return;
        const detail = s.qs.map((q, i) => G.check(q, s.answers[i] || ''));
        const ok = detail.filter(d => d.ok).length;
        const per = {};
        s.qs.forEach((q, i) => { per[q.ch] = per[q.ch] || [0, 0]; per[q.ch][1]++; if (detail[i].ok) per[q.ch][0]++; });
        const score = s.type === 'exam' ? 0.8 * ok : 20 * ok / s.qs.length;
        s.result = { ok, per, score, detail, t: Date.now() }; s.done = true;
        DATA.exams.push({ t: s.result.t, type: s.type, ch: s.ch || null, score, n: s.qs.length, ok, per }); DATA.exams = DATA.exams.slice(-30);
        setLast(s.type === 'exam' ? `Examen blanc : ${K.fixed(score, 1)}/20` : `Quiz ${CH[s.ch]} : ${K.fixed(score, 1)}/20`, '#/examens');
        render(); window.scrollTo(0, 0);
      });
    }
  }

  // -------------------------------------------------------------- formules
  let fFilter = { q: '', cat: '' };
  const norm = s => plain(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  V.formulas = () => {
    const cats = [...new Set(D.formulas.map(f => f.cat))];
    return `<div class="page-head"><div><h1>Formules</h1><p>Fiche récapitulative filtrable : formule, variables, unités, cas d'utilisation et exemple court.</p></div></div>
      <div class="card glass" style="margin-bottom:14px"><div class="field search"><label for="f-q">Rechercher</label><div class="control"><input id="f-q" type="search" value="${esc(fFilter.q)}" placeholder="ex. dilution, UFC, agarose, master mix"></div></div>
      <div class="chips" role="group" aria-label="Catégorie" style="margin-top:12px">${['', ...cats].map(c => `<button type="button" class="chip" data-cat="${esc(c)}" aria-pressed="${c === fFilter.cat}">${c || 'Toutes'}</button>`).join('')}</div></div>
      <div class="grid-3" id="f-list"></div>`;
  };
  function renderFormulaList() {
    const q = norm(fFilter.q);
    const list = D.formulas.filter(f => (!fFilter.cat || f.cat === fFilter.cat) && (!q || norm([f.f, f.vars, f.use, f.ex, f.cat, f.units].join(' ')).includes(q)));
    $('#f-list').innerHTML = list.length ? list.map(f => `<article class="fcard glass"><span class="badge">${esc(f.cat)}</span><div class="fx">${f.f}</div><dl><dt>Variables</dt><dd>${f.vars}</dd><dt>Unités</dt><dd>${f.units}</dd><dt>Usage</dt><dd>${f.use}</dd><dt>Exemple</dt><dd>${f.ex}</dd></dl></article>`).join('')
      : '<div class="empty">Aucune formule ne correspond. Essayer un autre mot ou la catégorie « Toutes ».</div>';
  }
  function mountFormulas() {
    renderFormulaList();
    $('#f-q').addEventListener('input', e => { fFilter.q = e.target.value; renderFormulaList(); });
    $$('[data-cat]').forEach(b => b.addEventListener('click', () => { fFilter.cat = b.dataset.cat; $$('[data-cat]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); renderFormulaList(); }));
  }

  // -------------------------------------------------------------- reglages
  V.settings = () => `<div class="page-head"><div><h1>Réglages</h1><p>Apparence, données enregistrées et vérification des calculateurs.</p></div></div>
    <div class="grid-2">
      <section class="card glass"><h2>Apparence</h2>
        <div class="field" style="margin-top:12px"><span class="flabel" id="th-l">Thème</span><div class="seg" role="group" aria-labelledby="th-l">${[['light', 'Clair'], ['dark', 'Sombre'], ['', 'Système']].map(([k, t]) => `<button type="button" data-theme-set="${k}" aria-pressed="${(DATA.theme || '') === k}">${t}</button>`).join('')}</div></div>
        <label class="check" style="margin-top:10px"><input type="checkbox" id="opt-tr"${DATA.prefs.transparency === 'reduced' ? ' checked' : ''}>Réduire la transparence (surfaces opaques)</label></section>
      <section class="card glass"><h2>Données</h2>
        <p class="muted" style="margin-top:8px">${storageOk ? 'Progression, scores, chapitres terminés et préférences sont enregistrés sur cet appareil (stockage local du navigateur).' : 'Le stockage local est indisponible dans ce contexte : l\'application fonctionne, mais rien ne sera conservé après fermeture.'}</p>
        <div class="btn-row"><button class="btn btn-danger" data-act="wipe">${icon('trash')}Réinitialiser la progression</button></div></section>
    </div>
    <section class="card glass" style="margin-top:14px"><h2>Auto-vérification</h2>
      <p class="muted" style="margin-top:8px">Exécute les tests numériques de référence de chaque calculateur (valeurs calculées indépendamment) et vérifie 1 100 exercices générés.</p>
      <div class="btn-row"><button class="btn btn-ghost" data-act="selftest">${icon('check')}Lancer les tests</button></div><div id="test-out" style="margin-top:12px" aria-live="polite"></div></section>
    <section class="card glass" style="margin-top:14px"><h2>À propos</h2>
      <p class="muted" style="margin-top:8px">Calculs Coach fonctionne hors ligne, sans serveur ni dépendance externe. Les formules sont celles du cours « Cours_Calculs_Essentiels_Laboratoire.pdf » et du cahier « Exercices_Corriges_Calculs_Laboratoire.pdf ». Outil pédagogique : les compositions de tampons, milieux et mélanges PCR doivent suivre les fiches techniques et protocoles validés du laboratoire.</p></section>`;
  function mountSettings() {
    $$('[data-theme-set]').forEach(b => b.addEventListener('click', () => { DATA.theme = b.dataset.themeSet || null; save(); applyTheme(); $$('[data-theme-set]').forEach(x => x.setAttribute('aria-pressed', String(x === b))); }));
    $('#opt-tr').addEventListener('change', e => { DATA.prefs.transparency = e.target.checked ? 'reduced' : 'normal'; save(); applyTheme(); });
    $('[data-act="wipe"]').addEventListener('click', async () => {
      if (await confirmDialog('Réinitialiser la progression ?', 'Chapitres terminés, scores, erreurs et historique des examens seront effacés. Le thème est conservé.', 'Tout effacer')) {
        const th = DATA.theme, pr = DATA.prefs; DATA = defaults(); DATA.theme = th; DATA.prefs = pr; save(); toast('Progression réinitialisée'); render();
      }
    });
    $('[data-act="selftest"]').addEventListener('click', () => {
      const res = C.runTests();
      let genFail = 0, genN = 0;
      G.CHAPTERS.forEach(([ch]) => { for (let i = 1; i <= 100; i++) { genN++; try { const e = G.generate(ch, 0, i * 104729); if (!Number.isFinite(e.answer) || !G.check(e, String(e.answer)).ok) genFail++; } catch (err) { genFail++; } } });
      const ok = res.filter(r => r.ok).length;
      $('#test-out').innerHTML = `<div class="msg ${ok === res.length && !genFail ? 'ok' : 'err'}">${icon(ok === res.length && !genFail ? 'check' : 'alert')}<span>${ok}/${res.length} tests de calculateurs réussis ; ${genN - genFail}/${genN} exercices générés valides.</span></div>`
        + tableHTML({ head: ['Calculateur', 'Test', 'Résultat', 'Détail'], rows: res.map(r => [esc(r.calc), String(r.n), r.ok ? 'Réussi' : 'Échec', r.ok ? esc(Object.entries(r.expect).map(([k, v]) => `${k} = ${K.toText(K.num(v, 4))}`).join(' ; ')) : esc(r.msg)]) });
    });
  }

  V.notFound = () => `<div class="page-head"><div><h1>Page introuvable</h1><p>Cette adresse ne correspond à aucune section.</p></div></div><a class="btn btn-primary" href="#/">${icon('home')}Tableau de bord</a>`;

  // --------------------------------------------------------------- routeur
  function route() {
    const h = (location.hash || '#/').replace(/^#/, '');
    const p = h.split('/').filter(Boolean);
    return { sec: p[0] || '', arg: p[1] || null };
  }
  function render() {
    const r = route();
    const view = $('#view');
    let html, mount = null, sec = r.sec;
    if (r.sec === '') { html = V.dashboard(); sec = ''; }
    else if (r.sec === 'cours') { html = r.arg ? V.chapter(r.arg) : V.courseList(); }
    else if (r.sec === 'calc') { html = r.arg ? V.calc(r.arg) : V.calcList(); if (r.arg) mount = () => mountCalc(r.arg); }
    else if (r.sec === 'exos') { html = V.exos(r.arg); mount = mountExos; }
    else if (r.sec === 'examens') { html = V.exams(); mount = mountExams; }
    else if (r.sec === 'formules') { html = V.formulas(); mount = mountFormulas; }
    else if (r.sec === 'reglages') { html = V.settings(); mount = mountSettings; }
    else html = V.notFound();
    view.innerHTML = html;
    view.classList.remove('view-enter'); void view.offsetWidth; view.classList.add('view-enter');
    $$('[data-nav]').forEach(a => { if (a.dataset.nav === sec) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
    const titles = { '': 'Tableau de bord', cours: 'Cours', calc: 'Calculateurs', exos: 'Exercices', examens: 'Examens', formules: 'Formules', reglages: 'Réglages' };
    document.title = `${titles[sec] || 'Calculs Coach'} · Calculs Coach`;
    // boutons generiques
    $$('[data-act="toggle-read"]', view).forEach(b => b.addEventListener('click', () => { const ch = b.dataset.ch; DATA.read[ch] = !DATA.read[ch]; save(); toast(DATA.read[ch] ? 'Chapitre marqué comme terminé' : 'Marque retirée'); render(); }));
    if (mount) mount();
  }
  let lastHash = null;
  window.addEventListener('hashchange', () => {
    render();
    const r = route();
    if (lastHash !== location.hash) { window.scrollTo(0, 0); const m = $('#main'); if (m && !r.arg) m.focus({ preventScroll: true }); }
    lastHash = location.hash;
  });
  document.addEventListener('click', e => { const b = e.target.closest('.theme-btn'); if (b) toggleTheme(); });

  const skip = $('.skip'); if (skip) skip.addEventListener('click', e => { e.preventDefault(); const m = $('#main'); m.focus(); m.scrollIntoView(); });
  applyTheme();
  if (!storageOk) { const b = $('#storage-banner'); if (b) b.hidden = false; }
  lastHash = location.hash;
  render();
})();

</script>
<script>
/* Calculs Coach : menu du haut + calculatrice flottante (éditeur mathématique naturel) */
(function () {
  'use strict';
  var K = window.LabCore;
  var $ = function (s, e) { return (e || document).querySelector(s); };
  var $$ = function (s, e) { return Array.prototype.slice.call((e || document).querySelectorAll(s)); };

  /* ------------------------------------------------------------ menu */
  var mb = $('#menu-btn'), menu = $('#menu');
  function setMenu(o) { menu.hidden = !o; mb.setAttribute('aria-expanded', String(o)); }
  mb.addEventListener('click', function (e) { e.stopPropagation(); setMenu(menu.hidden); });
  menu.addEventListener('click', function (e) { if (e.target.closest('a')) setMenu(false); });
  document.addEventListener('click', function (e) { if (!menu.hidden && !menu.contains(e.target)) setMenu(false); });
  window.addEventListener('hashchange', function () { setMenu(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !menu.hidden) { setMenu(false); mb.focus(); } });

  /* ------------------------------------------------------ calculatrice */
  var fab = $('#fab'), panel = $('#cc'), exprEl = $('#cc-expr'), resEl = $('#cc-res'), histEl = $('#cc-hist'), keysEl = $('#cc-keys'), sciBtn = $('#cc-sci');
  var OPS = { '+': 1, '−': 1, '×': 1, '÷': 1 };
  var FIELDS = { frac: ['n', 'd'], pow: ['e'], sqrt: ['a'] };
  var M = { root: [], cur: { path: [], i: 0 } };
  var ans = 0, justEq = false, status = null, errMsg = '', history = [], sciMode = false;
  var SK = 'labcalc-calc-v1';
  try { var sv = JSON.parse(localStorage.getItem(SK) || 'null'); if (sv) { history = Array.isArray(sv.h) ? sv.h.slice(0, 30) : []; ans = isFinite(sv.ans) ? sv.ans : 0; } } catch (e) { history = []; }
  function persist() { try { localStorage.setItem(SK, JSON.stringify({ h: history, ans: ans })); } catch (e) { /* ignore */ } }
  function toast(msg) { var t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function () { t.classList.remove('show'); }, 1800); }
  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  /* ---- navigation dans l'arbre ---- */
  function container(path) { var c = M.root; for (var k = 0; k < path.length; k++) c = c[path[k][0]][path[k][1]]; return c; }
  function cur() { return container(M.cur.path); }
  function lastStep() { return M.cur.path[M.cur.path.length - 1]; }
  function parentOfCursor() { return container(M.cur.path.slice(0, -1)); }
  function isEmptyNode(n) { return FIELDS[n.t].every(function (f) { return n[f].length === 0; }); }

  function autoExit(v) {
    if (M.cur.path.length && lastStep()[1] === 'e' && (v === '+' || v === '×' || v === '÷' || (v === '−' && M.cur.i > 0))) {
      var s = M.cur.path.pop(); M.cur.i = s[0] + 1;
    }
  }
  function insChar(v) { autoExit(v); cur().splice(M.cur.i, 0, { t: 'c', v: v }); M.cur.i++; }
  function insFrac() {
    var c = cur(), i = M.cur.i, j = i;
    while (j > 0 && c[j - 1].t === 'c' && /^[0-9.]$/.test(c[j - 1].v)) j--;
    var num = c.splice(j, i - j);
    c.splice(j, 0, { t: 'frac', n: num, d: [] });
    M.cur.path.push([j, num.length ? 'd' : 'n']); M.cur.i = 0;
  }
  function insPow() { var c = cur(); c.splice(M.cur.i, 0, { t: 'pow', e: [] }); M.cur.path.push([M.cur.i, 'e']); M.cur.i = 0; }
  function insSq() { var c = cur(); c.splice(M.cur.i, 0, { t: 'pow', e: [{ t: 'c', v: '2' }] }); M.cur.i++; }
  function insSqrt() { var c = cur(); c.splice(M.cur.i, 0, { t: 'sqrt', a: [] }); M.cur.path.push([M.cur.i, 'a']); M.cur.i = 0; }

  function left() {
    var c = cur(), i = M.cur.i;
    if (i > 0) {
      var n = c[i - 1];
      if (n.t === 'c') { M.cur.i--; return; }
      var f = FIELDS[n.t], l = f[f.length - 1]; M.cur.path.push([i - 1, l]); M.cur.i = n[l].length; return;
    }
    if (!M.cur.path.length) return;
    var st = lastStep(), node = parentOfCursor()[st[0]], fl = FIELDS[node.t], k = fl.indexOf(st[1]);
    if (k > 0) { M.cur.path[M.cur.path.length - 1] = [st[0], fl[k - 1]]; M.cur.i = node[fl[k - 1]].length; return; }
    M.cur.path.pop(); M.cur.i = st[0];
  }
  function right() {
    var c = cur(), i = M.cur.i;
    if (i < c.length) {
      var n = c[i];
      if (n.t === 'c') { M.cur.i++; return; }
      M.cur.path.push([i, FIELDS[n.t][0]]); M.cur.i = 0; return;
    }
    if (!M.cur.path.length) return;
    var st = lastStep(), node = parentOfCursor()[st[0]], fl = FIELDS[node.t], k = fl.indexOf(st[1]);
    if (k < fl.length - 1) { M.cur.path[M.cur.path.length - 1] = [st[0], fl[k + 1]]; M.cur.i = 0; return; }
    M.cur.path.pop(); M.cur.i = st[0] + 1;
  }
  function backspace() {
    var c = cur(), i = M.cur.i;
    if (i > 0) {
      var n = c[i - 1];
      if (n.t === 'c' || isEmptyNode(n)) { c.splice(i - 1, 1); M.cur.i--; return; }
      var f = FIELDS[n.t], l = f[f.length - 1]; M.cur.path.push([i - 1, l]); M.cur.i = n[l].length; return;
    }
    if (!M.cur.path.length) return;
    var st = lastStep(), parent = parentOfCursor(), node = parent[st[0]], fl = FIELDS[node.t], k = fl.indexOf(st[1]);
    if (k > 0) { M.cur.path[M.cur.path.length - 1] = [st[0], fl[k - 1]]; M.cur.i = node[fl[k - 1]].length; return; }
    M.cur.path.pop();
    if (isEmptyNode(node)) { parent.splice(st[0], 1); }
    M.cur.i = st[0];
  }

  /* ---- évaluation ---- */
  function toks(list, out) {
    var buf = '';
    function flush() { if (buf) { out.push({ k: 'num', v: buf }); buf = ''; } }
    list.forEach(function (n) {
      if (n.t === 'c') {
        if (n.v === '10') { flush(); out.push({ k: 'num', v: '10' }); return; }
        if (/^[0-9.]$/.test(n.v)) { buf += n.v; return; }
        flush(); out.push({ k: n.v });
      } else if (n.t === 'frac') {
        flush(); out.push({ k: '(' }, { k: '(' }); toks(n.n, out); out.push({ k: ')' }, { k: '÷' }, { k: '(' }); toks(n.d, out); out.push({ k: ')' }, { k: ')' });
      } else if (n.t === 'pow') {
        flush(); out.push({ k: '^' }, { k: '(' }); toks(n.e, out); out.push({ k: ')' });
      } else if (n.t === 'sqrt') {
        flush(); out.push({ k: 'sqrt(' }); toks(n.a, out); out.push({ k: ')' });
      }
    });
    flush();
  }
  function evaluate(t) {
    var p = 0;
    function peek() { return t[p]; }
    function bad() { throw new Error('Erreur de syntaxe'); }
    function startsAtom(x) { return x.k === 'num' || x.k === '(' || x.k === 'log(' || x.k === 'ln(' || x.k === 'sqrt(' || x.k === 'Ans'; }
    function expr() {
      var v = term();
      while (peek() && (peek().k === '+' || peek().k === '−')) { var o = t[p++].k; var r = term(); v = o === '+' ? v + r : v - r; }
      return v;
    }
    function term() {
      var v = unary();
      for (;;) {
        var x = peek(); if (!x) break;
        if (x.k === '×') { p++; v *= unary(); }
        else if (x.k === '÷') { p++; v /= unary(); }
        else if (startsAtom(x)) { v *= power(); }
        else break;
      }
      return v;
    }
    function unary() {
      var x = peek(); if (!x) bad();
      if (x.k === '−') { p++; return -unary(); }
      if (x.k === '+') { p++; return unary(); }
      return power();
    }
    function power() {
      var b = atom();
      while (peek() && peek().k === '^') { p++; b = Math.pow(b, atom()); }
      return b;
    }
    function close() { if (peek() && peek().k === ')') p++; }
    function atom() {
      var x = t[p++]; if (!x) bad();
      if (x.k === 'num') { if (!/^(\d+\.?\d*|\.\d+)$/.test(x.v)) bad(); return parseFloat(x.v); }
      if (x.k === 'Ans') return ans;
      if (x.k === '(') { var v = expr(); close(); return v; }
      if (x.k === 'log(') { var a = expr(); close(); return Math.log10(a); }
      if (x.k === 'ln(') { var b = expr(); close(); return Math.log(b); }
      if (x.k === 'sqrt(') { var c = expr(); close(); return Math.sqrt(c); }
      return bad();
    }
    var v = expr();
    if (p < t.length) bad();
    return v;
  }
  function evalModel() {
    var t = []; toks(M.root, t);
    if (!t.length) return { empty: true };
    var plain = t.length === 1 && t[0].k === 'num';
    try {
      var v = evaluate(t);
      if (!isFinite(v)) return { err: 'Erreur math', plain: plain };
      return { v: v, plain: plain };
    } catch (e) { return { err: e.message, plain: plain }; }
  }
  function fmt(x) {
    if (x === 0) return '0';
    var a = Math.abs(x);
    if (sciMode || a >= 1e10 || a < 1e-5) {
      var m = x.toExponential(9).split('e');
      var mant = m[0].replace(/\.?0+$/, '').replace('.', ','), e = parseInt(m[1], 10);
      return e === 0 ? mant : mant + '×10<sup>' + e + '</sup>';
    }
    return String(parseFloat(x.toPrecision(10))).replace('.', ',');
  }

  /* ---- rendu ---- */
  function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
  function renderList(list, path, isField, wc) {
    var show = wc && same(path, M.cur.path), h = '', C = '<i class="cur"></i>';
    if (!list.length) { var inner = show ? C : ''; return isField ? '<span class="ph">' + inner + '</span>' : inner; }
    for (var k = 0; k <= list.length; k++) {
      if (show && k === M.cur.i) h += C;
      if (k < list.length) h += renderNode(list[k], k, path, wc);
    }
    return h;
  }
  function renderNode(n, k, path, wc) {
    if (n.t === 'c') {
      var cls = 'mc' + (OPS[n.v] ? ' mo' : '');
      return '<span class="' + cls + '" data-i="' + k + '">' + (n.v === '.' ? ',' : n.v) + '</span>';
    }
    var fl = FIELDS[n.t], sub = {};
    fl.forEach(function (f) { var p = path.concat([[k, f]]); sub[f] = { p: p, j: JSON.stringify(p), h: renderList(n[f], p, true, wc) }; });
    if (n.t === 'frac') return '<span class="mf" data-i="' + k + '"><span class="mfn" data-path=\'' + sub.n.j + '\'>' + sub.n.h + '</span><span class="mfd" data-path=\'' + sub.d.j + '\'>' + sub.d.h + '</span></span>';
    if (n.t === 'pow') return '<span class="mp" data-i="' + k + '" data-path=\'' + sub.e.j + '\'>' + sub.e.h + '</span>';
    return '<span class="ms" data-i="' + k + '"><span class="msr">√</span><span class="msa" data-path=\'' + sub.a.j + '\'>' + sub.a.h + '</span></span>';
  }
  function render() {
    exprEl.innerHTML = '<div class="ce" data-path="[]">' + renderList(M.root, [], false, true) + '</div>';
    var c = $('.cur', exprEl); if (c) c.scrollIntoView({ inline: 'nearest', block: 'nearest' });
    resEl.className = 'cc-res';
    if (justEq) { resEl.classList.add('done'); resEl.innerHTML = fmt(ans); return; }
    if (status === 'err') { resEl.classList.add('err'); resEl.textContent = errMsg; return; }
    var r = evalModel();
    resEl.innerHTML = (r.v !== undefined && !r.plain) ? fmt(r.v) : '';
  }

  /* ---- actions ---- */
  function press(k) {
    var nav = k === 'left' || k === 'right' || k === 'del' || k === 'ac' || k === 'eq';
    if (k !== 'eq') status = null;
    if (justEq) {
      if (!nav) { justEq = false; M.root = []; M.cur = { path: [], i: 0 }; if (OPS[k] || k === 'pow' || k === 'exp' || k === 'sq') insChar('Ans'); }
      else if (k !== 'eq') justEq = false;
    }
    if (/^[0-9]$/.test(k) || OPS[k] || k === '(' || k === ')') insChar(k);
    else switch (k) {
      case 'dot': insChar('.'); break;
      case 'log': insChar('log('); break;
      case 'ln': insChar('ln('); break;
      case 'ans': insChar('Ans'); break;
      case 'frac': insFrac(); break;
      case 'sqrt': insSqrt(); break;
      case 'pow': insPow(); break;
      case 'sq': insSq(); break;
      case 'p10': insChar('10'); insPow(); break;
      case 'exp': insChar('×'); insChar('10'); insPow(); break;
      case 'left': left(); break;
      case 'right': right(); break;
      case 'del': backspace(); break;
      case 'ac': M.root = []; M.cur = { path: [], i: 0 }; justEq = false; break;
      case 'eq': {
        var r = evalModel();
        if (r.v !== undefined) { ans = r.v; justEq = true; history.unshift({ m: clone(M.root), v: ans }); history = history.slice(0, 30); persist(); }
        else if (!r.empty) { status = 'err'; errMsg = r.err; }
        break;
      }
    }
    render();
  }

  /* ---- touches ---- */
  var KEYS = [
    ['frac', '<span class="kfr"><i></i><b></b><i></i></span>', 'fn', 'Fraction'], ['sqrt', '<span class="kx">√<i class="ksq"></i></span>', 'fn', 'Racine carrée'], ['sq', '<span class="kx"><em>x</em><sup>2</sup></span>', 'fn', 'Au carré'], ['pow', '<span class="kx"><em>x</em><i class="ksq kup"></i></span>', 'fn', 'Puissance'], ['p10', '<span class="kx">10<i class="ksq kup"></i></span>', 'fn', '10 puissance'], ['exp', '<span class="kx">×10<i class="ksq kup"></i></span>', 'fn', 'Fois 10 puissance'],
    ['(', '(', 'fn', 'Parenthèse ouvrante'], [')', ')', 'fn', 'Parenthèse fermante'], ['log', 'log', 'fn', 'Logarithme décimal'], ['ln', 'ln', 'fn', 'Logarithme népérien'], ['ans', 'Ans', 'fn', 'Dernier résultat'], ['ac', 'AC', 'danger', 'Tout effacer'],
    ['7', '7', 'num'], ['8', '8', 'num'], ['9', '9', 'num'], ['÷', '÷', 'op', 'Diviser'], ['×', '×', 'op', 'Multiplier'], ['del', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 6H9l-6 6 6 6h12a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1zM13 10l4 4M17 10l-4 4"/></svg>', 'danger', 'Effacer'],
    ['4', '4', 'num'], ['5', '5', 'num'], ['6', '6', 'num'], ['+', '+', 'op', 'Plus'], ['−', '−', 'op', 'Moins'], ['left', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5.5 8.5 12l6.5 6.5"/></svg>', '', 'Curseur à gauche'],
    ['1', '1', 'num'], ['2', '2', 'num'], ['3', '3', 'num'], ['0', '0', 'num'], ['dot', ',', 'num', 'Virgule'], ['right', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5.5 15.5 12 9 18.5"/></svg>', '', 'Curseur à droite'],
    ['eq', '=', 'eq wide', 'Égal']
  ];
  keysEl.innerHTML = KEYS.map(function (k) { return '<button type="button" class="ck ' + k[2] + '" data-k="' + k[0] + '"' + (k[3] ? ' aria-label="' + k[3] + '"' : '') + '>' + k[1] + '</button>'; }).join('');
  keysEl.addEventListener('click', function (e) { var b = e.target.closest('[data-k]'); if (b) press(b.getAttribute('data-k')); });

  /* ---- placement du curseur au toucher ---- */
  exprEl.addEventListener('click', function (e) {
    var el = e.target.closest('[data-i]'), path, i;
    if (el) {
      var cont = el.parentElement.closest('[data-path]');
      path = JSON.parse(cont.getAttribute('data-path'));
      var r = el.getBoundingClientRect();
      i = +el.getAttribute('data-i') + (e.clientX > r.left + r.width / 2 ? 1 : 0);
    } else {
      var c2 = e.target.closest('[data-path]');
      path = c2 ? JSON.parse(c2.getAttribute('data-path')) : [];
      i = null;
    }
    try { var cc = container(path); M.cur.path = path; M.cur.i = i === null ? cc.length : Math.min(i, cc.length); } catch (err) { /* ignore */ }
    justEq = false; render();
  });

  /* ---- historique ---- */
  function showHist(o) {
    histEl.hidden = !o; if (!o) return;
    var h = '<div class="hh">Historique</div>';
    if (!history.length) h += '<p style="margin:6px 4px;color:var(--lcd-dim)">Aucun calcul pour l\'instant.</p>';
    else {
      history.forEach(function (x, idx) { var ex = ''; try { ex = renderList(x.m, [], false, false); } catch (e) { ex = ''; } h += '<button type="button" class="hi" data-h="' + idx + '"><span class="ce">' + ex + '</span><span class="hr">= ' + fmt(x.v) + '</span></button>'; });
      h += '<button type="button" class="hclr" data-hclr="1">Effacer l\'historique</button>';
    }
    histEl.innerHTML = h;
  }
  $('#cc-dots').addEventListener('click', function () { showHist(histEl.hidden); });
  histEl.addEventListener('click', function (e) {
    if (e.target.closest('[data-hclr]')) { history = []; persist(); showHist(true); return; }
    var b = e.target.closest('[data-h]'); if (!b) return;
    var x = history[+b.getAttribute('data-h')]; if (!x) return;
    M.root = clone(x.m); M.cur = { path: [], i: M.root.length }; justEq = false; status = null; showHist(false); render();
  });

  /* ---- Sci, copie ---- */
  sciBtn.addEventListener('click', function () { sciMode = !sciMode; sciBtn.setAttribute('aria-pressed', String(sciMode)); render(); });
  resEl.addEventListener('click', function () {
    if (!resEl.innerHTML || resEl.classList.contains('err')) return;
    var txt = K.toText(resEl.innerHTML);
    function ok() { toast('Résultat copié : ' + txt); }
    function fallback() {
      var ta = document.createElement('textarea'); ta.value = txt; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;opacity:0'; document.body.appendChild(ta); ta.select();
      var good = false; try { good = document.execCommand('copy'); } catch (e) { good = false; } ta.remove(); if (good) ok(); else toast('Copie impossible');
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(ok, fallback); else fallback();
  });

  /* ---- ouverture / fermeture ---- */
  var ON_KEY = 'labcalc-calc-visible', calcOn = true, tg = $('#calc-toggle');
  try { calcOn = localStorage.getItem(ON_KEY) !== '0'; } catch (e) { calcOn = true; }
  function syncCalc() { if (!calcOn) panel.hidden = true; fab.hidden = !calcOn || !panel.hidden; tg.setAttribute('aria-checked', String(calcOn)); }
  function openCalc(o) { if (o && !calcOn) return; panel.hidden = !o; fab.setAttribute('aria-expanded', String(o)); if (o) { showHist(false); render(); } syncCalc(); }
  tg.addEventListener('click', function () { calcOn = !calcOn; try { localStorage.setItem(ON_KEY, calcOn ? '1' : '0'); } catch (e) { /* ignore */ } syncCalc(); toast(calcOn ? 'Calculatrice affichée' : 'Calculatrice masquée'); });
  syncCalc();
  fab.addEventListener('click', function () { openCalc(true); });
  $('#cc-close').addEventListener('click', function () { openCalc(false); fab.focus(); });

  /* ---- clavier physique ---- */
  var KM = { '+': '+', '-': '−', '*': '×', 'x': '×', '/': '÷', '(': '(', ')': ')', '.': 'dot', ',': 'dot', '^': 'pow', 'Enter': 'eq', '=': 'eq', 'Backspace': 'del', 'ArrowLeft': 'left', 'ArrowRight': 'right' };
  document.addEventListener('keydown', function (e) {
    if (panel.hidden || e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target;
    if (t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable)) return;
    if (e.key === 'Escape') { openCalc(false); return; }
    var k = /^[0-9]$/.test(e.key) ? e.key : KM[e.key];
    if (!k) return;
    if ((k === 'eq' || k === 'del') && t && t.closest && t.closest('a,button,summary')) return;
    e.preventDefault(); press(k);
  });

  render();
})();
</script>
<script>
/* Calculs Coach : lentille de la barre d'onglets et accent de la section active */
(function(){var bar=document.querySelector('.tabbar'),sl=bar.querySelector('.sl'),root=document.documentElement;
function sync(){var a=bar.querySelector('.tab[aria-current="page"]'),s=document.querySelector('.tb[aria-current="page"]');
var m=document.querySelector('.mi[aria-current="page"]'),mb=document.getElementById('menu-btn');if(mb)mb.classList.toggle('on',!!m);root.style.setProperty('--accent',a?a.dataset.c:m?m.dataset.c:s?'var(--c-indigo)':'var(--c-blue)');
if(!a||!a.offsetWidth){sl.style.opacity=0;return}
sl.style.opacity=1;sl.style.width=a.offsetWidth+'px';sl.style.translate=a.offsetLeft+'px 0'}
new MutationObserver(sync).observe(document.body,{attributes:true,attributeFilter:['aria-current'],subtree:true});
addEventListener('resize',sync);addEventListener('load',sync);sync()})();
</script>
</body>
