<script>
/* =====================================================================
   Calculs Coach - noyau de calcul (JavaScript)
   Reprise fonction par fonction de core.py. Aucune evaluation de code dynamique.
   Conventions : masse en g, volume en L, concentration massique en g/L,
   concentration molaire en mol/L, sauf mention contraire.
   ===================================================================== */
(function (root) {
  'use strict';

  class LabError extends Error {
    constructor(msg) { super(msg); this.name = 'LabError'; }
  }

  // ------------------------------------------------------------ unites
  const MASS = { kg: 1e3, g: 1, mg: 1e-3, 'µg': 1e-6, ng: 1e-9, pg: 1e-12 };
  const VOL = { L: 1, mL: 1e-3, 'µL': 1e-6, nL: 1e-9 };
  const CMASS = { 'g/L': 1, 'mg/L': 1e-3, 'µg/L': 1e-6, 'mg/mL': 1, 'µg/mL': 1e-3, 'ng/mL': 1e-6, 'µg/µL': 1, 'ng/µL': 1e-3 };
  const CMOL = { M: 1, mM: 1e-3, 'µM': 1e-6, nM: 1e-9 };
  const TABLES = { masse: MASS, volume: VOL, 'concentration massique': CMASS, 'concentration molaire': CMOL };

  function kindOf(u) {
    for (const k in TABLES) if (Object.prototype.hasOwnProperty.call(TABLES[k], u)) return k;
    return null;
  }

  function isNum(x) { return typeof x === 'number' && Number.isFinite(x); }

  function pos(x, name, allowZero) {
    if (!isNum(x)) throw new LabError(`${name} : valeur manquante ou invalide.`);
    if (allowZero ? x < 0 : x <= 0) throw new LabError(`${name} doit être ${allowZero ? 'positif ou nul' : 'strictement positif'}.`);
    return x;
  }

  function convert(v, from, to) {
    const k1 = kindOf(from), k2 = kindOf(to);
    if (!k1 || k1 !== k2) throw new LabError(`Conversion impossible de ${from} vers ${to} : grandeurs de nature différente.`);
    if (!isNum(v)) throw new LabError('Valeur à convertir invalide.');
    return v * TABLES[k1][from] / TABLES[k1][to];
  }

  // -------------------------------------------- masses et concentrations
  const massFromConc = (c, v) => pos(c, 'Concentration') * pos(v, 'Volume');
  const concFromMass = (m, v) => pos(m, 'Masse') / pos(v, 'Volume');
  const volFromMass = (m, c) => pos(m, 'Masse') / pos(c, 'Concentration');
  const moles = (m, M) => pos(m, 'Masse') / pos(M, 'Masse molaire');
  function massFromMolar(c, v, M, purity) {
    if (purity === undefined) purity = 1;
    if (!(purity > 0 && purity <= 1)) throw new LabError('La pureté doit être comprise entre 0 et 100 %.');
    return pos(c, 'Concentration') * pos(v, 'Volume') * pos(M, 'Masse molaire') / purity;
  }
  const percentToGL = p => 10 * p;

  // ------------------------------------------------------------ dilution
  function c1v1(o) {
    const keys = ['C1', 'V1', 'C2', 'V2'];
    const unknown = keys.filter(k => o[k] === null || o[k] === undefined);
    if (unknown.length !== 1) throw new LabError('Laisser exactement une inconnue.');
    keys.forEach(k => { if (!unknown.includes(k)) pos(o[k], k); });
    const u = unknown[0];
    let r;
    if (u === 'C1') r = o.C2 * o.V2 / o.V1;
    else if (u === 'V1') r = o.C2 * o.V2 / o.C1;
    else if (u === 'C2') r = o.C1 * o.V1 / o.V2;
    else r = o.C1 * o.V1 / o.C2;
    const full = Object.assign({}, o, { [u]: r });
    if (full.C2 > full.C1 * (1 + 1e-12)) throw new LabError('Une dilution ne peut pas augmenter la concentration (C2 > C1).');
    if (full.V1 > full.V2 * (1 + 1e-12)) throw new LabError('Le volume prélevé ne peut pas dépasser le volume final (V1 > V2).');
    return r;
  }

  function dilutionFactor(vt, vf) {
    pos(vt, 'Volume transféré'); pos(vf, 'Volume final');
    if (vt > vf) throw new LabError('Le volume transféré dépasse le volume final.');
    return vf / vt;
  }

  function serial(c0, steps) {
    pos(c0, 'Concentration initiale');
    const out = []; let F = 1, c = c0;
    steps.forEach((s, i) => {
      pos(s[0], 'Volume transféré'); pos(s[1], 'Volume de diluant');
      const f = (s[0] + s[1]) / s[0];
      F *= f; c /= f;
      out.push({ tube: i + 1, f, F, fraction: 1 / F, C: c });
    });
    return { tubes: out, F };
  }

  function tubesNeeded(c0, cTarget, f) {
    pos(c0, 'C0'); pos(cTarget, 'Concentration cible');
    if (!(f > 1)) throw new LabError('Le facteur par étape doit être supérieur à 1.');
    if (cTarget >= c0) return 0;
    const n = Math.log(c0 / cTarget) / Math.log(f);
    return Math.ceil(Math.round(n * 1e9) / 1e9);
  }

  // -------------------------------------------------- tampons concentres
  function bufferFromStock(xs, xf, vf) {
    pos(xs, 'Concentration du stock'); pos(xf, 'Concentration finale'); pos(vf, 'Volume final');
    if (xf > xs) throw new LabError('La concentration finale dépasse celle du stock.');
    const vs = vf * xf / xs;
    return { vs, water: vf - vs };
  }
  function dyeAddToSample(vs, xs, xf) {
    if (xs === undefined) xs = 6; if (xf === undefined) xf = 1;
    pos(vs, "Volume d'échantillon"); pos(xs, 'Concentration du tampon'); pos(xf, 'Concentration finale');
    if (xs <= xf) throw new LabError('Le tampon de charge doit être plus concentré que la concentration finale.');
    const vd = vs * xf / (xs - xf);
    return { vd, vt: vs + vd };
  }
  function dyeFinalFixed(vf, xs, xf) {
    if (xs === undefined) xs = 6; if (xf === undefined) xf = 1;
    pos(vf, 'Volume final'); pos(xs, 'Concentration du tampon'); pos(xf, 'Concentration finale');
    if (xs <= xf) throw new LabError('Le tampon de charge doit être plus concentré que la concentration finale.');
    const vd = vf * xf / xs;
    return { vd, rest: vf - vd };
  }

  // ---------------------------------------------------------- gels, milieux
  const agaroseMass = (p, vmL) => pos(p, 'Pourcentage') * pos(vmL, 'Volume') / 100;
  const mediumPowder = (cgL, vmL) => pos(cgL, 'Concentration') * pos(vmL, 'Volume') / 1000;
  function platesPossible(vt, vp) { pos(vt, 'Volume total'); pos(vp, 'Volume par boîte'); return Math.floor(vt / vp + 1e-9); }
  const volumeForPlates = (n, vp, margin) => n * vp * (1 + (margin || 0));

  // ------------------------------------------------------------------- PCR
  function pcrVolume(cf, cs, vr) {
    pos(cf, 'Concentration finale'); pos(cs, 'Concentration du stock'); pos(vr, 'Volume réactionnel');
    if (cf > cs) throw new LabError('Concentration finale supérieure à celle du stock.');
    return cf * vr / cs;
  }
  function pcrMix(vr, comps, n, surplus) {
    pos(vr, 'Volume réactionnel');
    const rows = []; let tot = 0;
    comps.forEach(c => {
      let v;
      if (c.kind === 'conc') v = pcrVolume(c.final, c.stock, vr);
      else if (c.kind === 'units' || c.kind === 'amount') v = pos(c.final, c.name) / pos(c.stock, c.name);
      else v = pos(c.final, c.name);
      rows.push(Object.assign({}, c, { v }));
      tot += v;
    });
    const water = vr - tot;
    if (water < -1e-9) throw new LabError(`La somme des réactifs (${tot.toFixed(3)} µL) dépasse le volume réactionnel (${vr} µL).`);
    return { rows, water, factor: (n || 1) * (1 + (surplus || 0)) };
  }

  // ---------------------------------------------------------- denombrement
  function cfuSingle(C, V, d) {
    pos(C, 'Nombre de colonies', true); pos(V, 'Volume ensemencé'); pos(d, 'Fraction de dilution');
    if (d > 1) throw new LabError('La fraction de dilution doit être ≤ 1 (exemple : 10^-3), pas un facteur.');
    return C / (V * d);
  }
  function cfuWeighted(sumC, V, n1, n2, d1) {
    pos(V, 'Volume'); pos(d1, 'Fraction de dilution'); pos(sumC, 'Somme des colonies', true);
    if (n1 < 1) throw new LabError('Au moins une boîte doit être retenue à la première dilution.');
    if (d1 > 1) throw new LabError('La fraction de dilution doit être ≤ 1.');
    return sumC / (V * (n1 + 0.1 * n2) * d1);
  }
  const lod = (V, d, n) => 1 / (pos(V, 'Volume') * pos(d, 'Fraction') * (n || 1));
  function initialSuspensionFraction(m, vd) { pos(m, 'Masse'); pos(vd, 'Volume de diluant'); return m / (m + vd); }
  function log10(x) { if (!(x > 0)) throw new LabError('log10 non défini pour une valeur nulle ou négative.'); return Math.log10(x); }

  // ------------------------------------------------------------------ ADN
  const A260_FACTOR = { ADNdb: 50, ARN: 40, ADNsb: 33 };
  const dnaFromA260 = (a, factor, F) => pos(a, 'A260') * pos(factor, 'Facteur') * pos(F, 'Facteur de dilution');

  // --------------------------------------------------------- complementaires
  function mean(xs) { if (!xs.length) throw new LabError('Aucune valeur.'); return xs.reduce((a, b) => a + b, 0) / xs.length; }
  function sd(xs) {
    if (xs.length < 2) throw new LabError('Au moins deux valeurs pour un écart-type.');
    const m = mean(xs);
    return Math.sqrt(xs.reduce((a, x) => a + (x - m) * (x - m), 0) / (xs.length - 1));
  }
  const cv = xs => 100 * sd(xs) / mean(xs);
  function generations(N0, Nt) {
    pos(N0, 'N0'); pos(Nt, 'Nt');
    if (Nt <= N0) throw new LabError('Nt doit être supérieur à N0 (phase de croissance).');
    return (Math.log10(Nt) - Math.log10(N0)) / Math.log10(2);
  }
  const generationTime = (N0, Nt, t) => pos(t, 'Durée') / generations(N0, Nt);
  const recovery = (meas, exp) => 100 * pos(meas, 'Valeur mesurée', true) / pos(exp, 'Valeur attendue');
  function mixConc(pairs) {
    const vt = pairs.reduce((a, p) => a + p[1], 0);
    pos(vt, 'Volume total');
    return pairs.reduce((a, p) => a + p[0] * p[1], 0) / vt;
  }

  // ------------------------------------------------------------ formatage
  const NBSP = ' ';
  function roundHalfUp(x, dec) {
    const m = Math.pow(10, dec);
    const s = Math.sign(x) || 1;
    return s * Math.round(Math.abs(x) * m * (1 + 8 * Number.EPSILON)) / m;
  }
  function group(intStr) {
    const neg = intStr[0] === '-'; let d = neg ? intStr.slice(1) : intStr;
    if (d.length > 4) d = d.replace(/\B(?=(\d{3})+(?!\d))/g, NBSP);
    return (neg ? '-' : '') + d;
  }
  function fixed(x, dec, keep) {
    if (dec === undefined) dec = 2;
    let s = roundHalfUp(x, dec).toFixed(dec);
    if (!keep && s.includes('.')) s = s.replace(/0+$/, '').replace(/\.$/, '');
    if (s === '-0') s = '0';
    const parts = s.split('.');
    return group(parts[0]) + (parts[1] ? ',' + parts[1] : '');
  }
  function sigfig(x, n) {
    if (x === 0) return '0';
    const e = Math.floor(Math.log10(Math.abs(x)));
    return fixed(roundHalfUp(x, n - 1 - e), Math.max(0, n - 1 - e));
  }
  function sciParts(x, n) {
    if (x === 0) return { m: '0', e: 0 };
    let e = Math.floor(Math.log10(Math.abs(x)));
    let m = roundHalfUp(x / Math.pow(10, e), n - 1);
    if (Math.abs(m) >= 10) { m /= 10; e += 1; }
    return { m: fixed(m, n - 1, true), e };
  }
  function sci(x, n, opts) {
    n = n || 2; opts = opts || {};
    if (!isNum(x)) return '—';
    if (x === 0) return '0';
    const p = sciParts(x, n);
    let m = p.m;
    if (opts.trim && m.includes(',')) m = m.replace(/0+$/, '').replace(/,$/, '');
    if (p.e === 0) return m;
    return opts.text ? `${m} × 10^${p.e}` : `${m}${NBSP}×${NBSP}10<sup>${p.e}</sup>`;
  }
  function num(x, n, opts) {
    n = n || 3; opts = opts || {};
    if (!isNum(x)) return '—';
    if (x === 0) return '0';
    const a = Math.abs(x);
    if (a >= 1e5 || a < 1e-3) return sci(x, n, Object.assign({ trim: true }, opts));
    if (a < 100) return sigfig(x, n);
    return fixed(x, Math.max(0, n - String(Math.floor(a)).length));
  }
  // nombre de decimales adapte au pipetage (µL) : 3 decimales max
  const vol = (x, dec) => fixed(x, dec === undefined ? 3 : dec);
  const toText = html => String(html).replace(/<sup>(.*?)<\/sup>/g, '^$1').replace(/<sub>(.*?)<\/sub>/g, '$1').replace(/<[^>]+>/g, '').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&');

  /** Analyse une saisie numerique sans eval : 1,5 ; 1.5 ; 1 500 ; 1,6e7 ; 1,6x10^7 ; 1,6×10^-3 ; 10^-3 ; 1/10 */
  function parseNum(str) {
    if (typeof str === 'number') return str;
    if (str === null || str === undefined) return NaN;
    let s = String(str).trim().replace(/[\s  ]/g, '').replace(/,/g, '.').replace(/−/g, '-');
    if (s === '') return NaN;
    let m = s.match(/^([+-]?(?:\d+\.?\d*|\.\d+))(?:(?:[x×*·]10\^?)([+-]?\d+)|[eE]([+-]?\d+))?$/);
    if (m) {
      const base = parseFloat(m[1]);
      const ex = m[2] !== undefined ? m[2] : m[3];
      return ex !== undefined ? base * Math.pow(10, parseInt(ex, 10)) : base;
    }
    m = s.match(/^10\^([+-]?\d+)$/);
    if (m) return Math.pow(10, parseInt(m[1], 10));
    m = s.match(/^(\d+\.?\d*)\/(\d+\.?\d*)$/);
    if (m) { const den = parseFloat(m[2]); return den === 0 ? NaN : parseFloat(m[1]) / den; }
    return NaN;
  }

  /** Comparaison d'une reponse : tolerance relative ou arrondi a 2-3 chiffres significatifs accepte. */
  function answerOk(given, expected, tol, absTol) {
    if (!isNum(given) || !isNum(expected)) return false;
    if (absTol !== undefined) return Math.abs(given - expected) <= absTol + 1e-12;
    if (expected === 0) return Math.abs(given) < 1e-12;
    const rel = Math.abs(given - expected) / Math.abs(expected);
    if (rel <= (tol === undefined ? 0.02 : tol)) return true;
    for (const n of [2, 3]) {
      const e = Math.floor(Math.log10(Math.abs(expected)));
      const r = roundHalfUp(expected, n - 1 - e);
      if (Math.abs(given - r) <= 1e-9 * Math.abs(expected)) return true;
    }
    return false;
  }

  root.LabCore = {
    LabError, MASS, VOL, CMASS, CMOL, TABLES, kindOf, convert, isNum,
    massFromConc, concFromMass, volFromMass, moles, massFromMolar, percentToGL,
    c1v1, dilutionFactor, serial, tubesNeeded,
    bufferFromStock, dyeAddToSample, dyeFinalFixed,
    agaroseMass, mediumPowder, platesPossible, volumeForPlates,
    pcrVolume, pcrMix,
    cfuSingle, cfuWeighted, lod, initialSuspensionFraction, log10,
    A260_FACTOR, dnaFromA260,
    mean, sd, cv, generations, generationTime, recovery, mixConc,
    roundHalfUp, fixed, sigfig, sci, num, vol, toText, parseNum, answerOk, NBSP
  };
})(typeof window !== 'undefined' ? window : globalThis);

/* =====================================================================
   Calculs Coach - definitions des 13 calculateurs.
   Chaque calculateur declare ses champs, une fonction compute() pure
   (aucun acces au DOM) et des tests numeriques de reference.
   ===================================================================== */
(function (root) {
  'use strict';
  const K = root.LabCore;
  const E = msg => new K.LabError(msg);
  const n3 = x => K.num(x, 3);
  const n4 = x => K.num(x, 4);
  const sub = s => `<sub>${s}</sub>`;

  const MASS_U = ['g', 'mg', 'µg', 'ng'];
  const VOL_U = ['L', 'mL', 'µL'];
  const CM_U = ['g/L', 'mg/mL', 'mg/L', 'µg/mL', 'ng/µL'];
  const CMOL_U = ['M', 'mM', 'µM', 'nM'];
  const ALL_U = [].concat(['kg'], MASS_U, ['pg'], VOL_U, ['nL'], CM_U, ['µg/L', 'ng/mL', 'µg/µL'], CMOL_U);
  const CONC_ANY = CM_U.concat(CMOL_U, ['X', '%', 'UFC/mL', 'U/mL']);

  /** Choix de pipette pour un volume en µL. */
  function pipette(uL) {
    if (!(uL > 0)) return '';
    if (uL < 0.2) return 'volume trop petit pour être pipeté avec justesse : prévoir une dilution intermédiaire ou un master mix';
    const P = [[2, 'P2'], [10, 'P10'], [20, 'P20'], [200, 'P200'], [1000, 'P1000'], [5000, 'P5000 ou pipette sérologique de 5 mL'], [10000, 'pipette sérologique de 10 mL'], [25000, 'pipette sérologique de 25 mL'], [50000, 'pipette sérologique de 50 mL']];
    for (const [max, name] of P) if (uL <= max + 1e-9) return name;
    return 'éprouvette graduée ou fiole jaugée';
  }

  /** Meilleure unite d'affichage pour une masse en g ou un volume en L. */
  function bestMass(g) {
    const a = Math.abs(g);
    if (a >= 1) return [g, 'g']; if (a >= 1e-3) return [g * 1e3, 'mg']; if (a >= 1e-6) return [g * 1e6, 'µg']; return [g * 1e9, 'ng'];
  }
  function bestVol(L) {
    const a = Math.abs(L);
    if (a >= 1) return [L, 'L']; if (a >= 1e-3) return [L * 1e3, 'mL']; return [L * 1e6, 'µL'];
  }
  const fmtMass = g => { const [v, u] = bestMass(g); return `${n4(v)} ${u}`; };
  const fmtVol = L => { const [v, u] = bestVol(L); return `${n4(v)} ${u}`; };

  /** Concentration vers unite de base (g/L ou M) ; X, %, UFC/mL : identite. */
  function concBase(v, u) {
    if (u in K.CMASS) return { v: v * K.CMASS[u], kind: 'mass', base: 'g/L' };
    if (u in K.CMOL) return { v: v * K.CMOL[u], kind: 'mol', base: 'M' };
    return { v, kind: u, base: u };
  }
  function concFromBase(vb, u) {
    if (u in K.CMASS) return vb / K.CMASS[u];
    if (u in K.CMOL) return vb / K.CMOL[u];
    return vb;
  }

  const COMPOUNDS = [
    ['', 'Saisie libre', null], ['NaCl', 'NaCl', 58.44], ['KCl', 'KCl', 74.55], ['Tris', 'Tris base', 121.14],
    ['EDTA', 'EDTA disodique ·2H₂O', 372.24], ['MgCl2a', 'MgCl₂ anhydre', 95.21], ['MgCl2h', 'MgCl₂ ·6H₂O', 203.30],
    ['CaCl2a', 'CaCl₂ anhydre', 110.98], ['CaCl2h', 'CaCl₂ ·2H₂O', 147.01], ['Glc', 'Glucose', 180.16], ['Sac', 'Saccharose', 342.30],
    ['KH2PO4', 'KH₂PO₄', 136.09], ['Na2HPO4', 'Na₂HPO₄ anhydre', 141.96]
  ];

  const BUF_PRESETS = [
    ['', 'Saisie libre', null], ['tae', 'TAE 50X → 1X', [50, 1]], ['tbe105', 'TBE 10X → 0,5X', [10, 0.5]], ['tbe101', 'TBE 10X → 1X', [10, 1]],
    ['tbe55', 'TBE 5X → 0,5X', [5, 0.5]], ['pbs', 'PBS 10X → 1X', [10, 1]], ['ssc', 'SSC 20X → 2X', [20, 2]]
  ];

  // ===================================================================
  const CALCS = [];

  // 1. Conversions ---------------------------------------------------
  CALCS.push({
    id: 'conv', ch: 'm1', icon: 'swap', title: "Conversions d'unités",
    desc: 'Masses, volumes, concentrations massiques et molaires.',
    fields: () => [
      { id: 'v', label: 'Valeur', def: '250' },
      { id: 'from', label: 'Unité de départ', type: 'select', options: ALL_U.map(u => [u, u]), def: 'µL' },
      { id: 'to', label: "Unité d'arrivée", type: 'select', def: 'mL', dependsOn: 'from',
        options: v => { const k = K.kindOf(v.from); return ALL_U.filter(u => K.kindOf(u) === k).map(u => [u, u]); } }
    ],
    compute(v) {
      const r = K.convert(v.v, v.from, v.to);
      const f = K.convert(1, v.from, v.to);
      return {
        formula: 'valeur (unité d\'arrivée) = valeur (unité de départ) × facteur',
        steps: [`Grandeur : ${K.kindOf(v.from)}.`, `Facteur : 1 ${v.from} = ${n4(f)} ${v.to}.`, `${n4(v.v)} × ${n4(f)} = ${n4(r)} ${v.to}.`,
          f > 1 ? "L'unité d'arrivée est plus petite : le nombre augmente." : (f < 1 ? "L'unité d'arrivée est plus grande : le nombre diminue." : 'Unités équivalentes : la valeur ne change pas.')],
        result: [{ label: `${n4(v.v)} ${v.from} =`, value: n4(r), unit: v.to, main: true }],
        values: { r }
      };
    },
    tests: [
      { in: { v: '250', from: 'µL', to: 'mL' }, out: { r: 0.25 } },
      { in: { v: '100', from: 'mg/mL', to: 'µg/mL' }, out: { r: 1e5 } },
      { in: { v: '45', from: 'ng/µL', to: 'µg/mL' }, out: { r: 45 } },
      { in: { v: '0,2', from: 'mM', to: 'µM' }, out: { r: 200 } }
    ]
  });

  // 2. Masse et concentration -----------------------------------------
  CALCS.push({
    id: 'masse', ch: 'm2', icon: 'scale', title: 'Masse à peser et concentration',
    desc: 'm = Cm × V, avec % m/V, g/L, mg/mL…',
    modes: [['m', 'Masse à peser'], ['c', 'Concentration'], ['v', 'Volume réalisable']],
    fields: mode => {
      const C = { id: 'C', label: 'Concentration massique', units: CM_U.concat(['% m/V']), unit: 'g/L', def: '8' };
      const V = { id: 'V', label: 'Volume final', units: VOL_U, unit: 'mL', def: '350' };
      const m = { id: 'm', label: 'Masse', units: MASS_U, unit: 'g', def: '2,8' };
      return mode === 'm' ? [C, V] : mode === 'c' ? [m, V] : [m, C];
    },
    compute(v, mode) {
      const cg = x => v.C_u === '% m/V' ? K.percentToGL(x) : x * K.CMASS[v.C_u];
      const steps = [];
      if (mode === 'm') {
        const C = cg(v.C), V = v.V * K.VOL[v.V_u];
        steps.push(v.C_u === '% m/V' ? `${n4(v.C)} % m/V = ${n4(v.C)} g pour 100 mL = ${n4(C)} g/L.` : `C<sub>m</sub> = ${n4(v.C)} ${v.C_u} = ${n4(C)} g/L.`);
        steps.push(`V = ${n4(v.V)} ${v.V_u} = ${n4(V)} L.`);
        const m = K.massFromConc(C, V);
        steps.push(`m = ${n4(C)} g/L × ${n4(V)} L = ${n4(m)} g.`);
        steps.push('Dissoudre dans un volume inférieur, puis compléter au volume final.');
        return { formula: `m = C${sub('m')} × V`, steps, result: [{ label: 'Masse à peser', value: fmtMass(m).split(' ')[0], unit: fmtMass(m).split(' ')[1], main: true }, { label: 'En grammes', value: n4(m), unit: 'g' }], values: { m } };
      }
      if (mode === 'c') {
        const m = v.m * K.MASS[v.m_u], V = v.V * K.VOL[v.V_u];
        const c = K.concFromMass(m, V);
        steps.push(`m = ${n4(m)} g ; V = ${n4(V)} L.`, `C${sub('m')} = ${n4(m)} / ${n4(V)} = ${n4(c)} g/L.`, `Équivalences : ${n4(c)} g/L = ${n4(c)} mg/mL = ${n4(c * 1000)} µg/mL = ${n4(c / 10)} % m/V.`);
        return { formula: `C${sub('m')} = m / V`, steps, result: [{ label: 'Concentration', value: n4(c), unit: 'g/L', main: true }, { label: 'Soit', value: n4(c * 1000), unit: 'µg/mL' }, { label: 'Soit', value: n4(c / 10), unit: '% m/V' }], values: { c } };
      }
      const m = v.m * K.MASS[v.m_u], C = cg(v.C);
      const V = K.volFromMass(m, C);
      steps.push(`m = ${n4(m)} g ; C${sub('m')} = ${n4(C)} g/L.`, `V = ${n4(m)} / ${n4(C)} = ${n4(V)} L = ${n4(V * 1000)} mL.`);
      return { formula: `V = m / C${sub('m')}`, steps, result: [{ label: 'Volume final réalisable', value: n4(V * 1000), unit: 'mL', main: true }], values: { V } };
    },
    tests: [
      { mode: 'm', in: { C: '8', C_u: 'g/L', V: '350', V_u: 'mL' }, out: { m: 2.8 } },
      { mode: 'm', in: { C: '20', C_u: '% m/V', V: '250', V_u: 'mL' }, out: { m: 50 } },
      { mode: 'c', in: { m: '12', m_u: 'mg', V: '0,24', V_u: 'mL' }, out: { c: 50 } },
      { mode: 'v', in: { m: '1,2', m_u: 'g', C: '4', C_u: 'g/L' }, out: { V: 0.3 } }
    ]
  });

  // 3. Concentration molaire ------------------------------------------
  CALCS.push({
    id: 'molaire', ch: 'm2', icon: 'molecule', title: 'Concentration molaire',
    desc: 'm = C × V × M, hydrates et pureté.',
    modes: [['m', 'Masse à peser'], ['c', 'Concentration obtenue']],
    fields: mode => {
      const cmp = { id: 'cmp', label: 'Composé (remplit M)', type: 'select', options: COMPOUNDS.map(c => [c[0], c[1] + (c[2] ? ` (${K.fixed(c[2], 2)} g/mol)` : '')]), def: '',
        onChange: (val, set) => { const c = COMPOUNDS.find(x => x[0] === val); if (c && c[2]) set('M', K.fixed(c[2], 2)); } };
      const M = { id: 'M', label: 'Masse molaire M', unit: 'g/mol', def: '58,44' };
      const V = { id: 'V', label: 'Volume final', units: VOL_U, unit: 'mL', def: '500' };
      if (mode === 'm') return [cmp, { id: 'C', label: 'Concentration voulue', units: CMOL_U, unit: 'mM', def: '150' }, V, M, { id: 'p', label: 'Pureté', unit: '%', def: '100' }];
      return [cmp, { id: 'm', label: 'Masse pesée', units: MASS_U, unit: 'g', def: '0,4382' }, V, M];
    },
    compute(v, mode) {
      const V = v.V * K.VOL[v.V_u];
      if (mode === 'm') {
        const C = v.C * K.CMOL[v.C_u];
        if (!(v.p > 0 && v.p <= 100)) throw E('La pureté doit être comprise entre 0 et 100 %.');
        const pur = v.p / 100;
        const m = K.massFromMolar(C, V, v.M, pur);
        const steps = [`C = ${n4(v.C)} ${v.C_u} = ${n4(C)} mol/L ; V = ${n4(V)} L.`, `n = C × V = ${n4(C * V)} mol.`, `m = n × M = ${n4(C * V)} × ${n4(v.M)} = ${n4(C * V * v.M)} g.`];
        if (pur < 1) steps.push(`Correction de pureté : ${n4(C * V * v.M)} / ${n4(pur)} = ${n4(m)} g.`);
        return { formula: 'm = C × V × M / pureté', steps, result: [{ label: 'Masse à peser', value: n4(m), unit: 'g', main: true }, { label: 'Quantité de matière', value: n4(C * V * 1000), unit: 'mmol' }],
          notes: ['Utiliser la masse molaire de la forme réellement pesée (sel hydraté ou anhydre).'], values: { m } };
      }
      const m = v.m * K.MASS[v.m_u];
      const n = K.moles(m, v.M), C = n / V;
      return { formula: 'C = n / V = m / (M × V)', steps: [`n = ${n4(m)} / ${n4(v.M)} = ${n4(n)} mol.`, `C = ${n4(n)} / ${n4(V)} = ${n4(C)} mol/L.`],
        result: [{ label: 'Concentration', value: n4(C * 1000), unit: 'mM', main: true }, { label: 'Soit', value: n4(C), unit: 'M' }, { label: 'Concentration massique', value: n4(m / V), unit: 'g/L' }], values: { C } };
    },
    tests: [
      { mode: 'm', in: { cmp: '', C: '150', C_u: 'mM', V: '500', V_u: 'mL', M: '58,44', p: '100' }, out: { m: 4.383 } },
      { mode: 'm', in: { cmp: '', C: '0,2', C_u: 'M', V: '0,5', V_u: 'L', M: '147,01', p: '98' }, out: { m: 0.2 * 0.5 * 147.01 / 0.98 } },
      { mode: 'c', in: { cmp: '', m: '0,4382', m_u: 'g', V: '50', V_u: 'mL', M: '58,44' }, out: { C: 0.4382 / 58.44 / 0.05 } }
    ]
  });

  // 4. C1V1 = C2V2 -----------------------------------------------------
  CALCS.push({
    id: 'dilution', ch: 'm3', icon: 'drop', title: 'Dilution C₁V₁ = C₂V₂',
    desc: 'Volume à prélever, diluant, facteur et fraction.',
    fields: () => [
      { id: 'unk', label: 'Inconnue', type: 'select', options: [['V1', 'V₁ volume à prélever'], ['C2', 'C₂ concentration finale'], ['V2', 'V₂ volume final'], ['C1', 'C₁ concentration du stock']], def: 'V1' },
      { id: 'C1', label: 'C₁ concentration du stock', units: CONC_ANY, unit: 'mg/mL', def: '10', skipIf: v => v.unk === 'C1' },
      { id: 'V1', label: 'V₁ volume prélevé', units: VOL_U, unit: 'mL', def: '0,1', skipIf: v => v.unk === 'V1' },
      { id: 'C2', label: 'C₂ concentration finale', units: CONC_ANY, unit: 'µg/mL', def: '50', skipIf: v => v.unk === 'C2' },
      { id: 'V2', label: 'V₂ volume final', units: VOL_U, unit: 'mL', def: '20', skipIf: v => v.unk === 'V2' }
    ],
    compute(v) {
      const u = v.unk;
      const c1 = concBase(1, v.C1_u), c2 = concBase(1, v.C2_u);
      if (c1.kind !== c2.kind) throw E(`C₁ (${v.C1_u}) et C₂ (${v.C2_u}) ne sont pas des grandeurs compatibles. Utiliser des unités de même nature.`);
      const o = { C1: u === 'C1' ? null : concBase(v.C1, v.C1_u).v, C2: u === 'C2' ? null : concBase(v.C2, v.C2_u).v,
        V1: u === 'V1' ? null : v.V1 * K.VOL[v.V1_u], V2: u === 'V2' ? null : v.V2 * K.VOL[v.V2_u] };
      const steps = [];
      if (c1.kind === 'mass' || c1.kind === 'mol') steps.push(`Conversion des concentrations en ${c1.base} : ` + ['C1', 'C2'].filter(k => k !== u).map(k => `${k.replace('1', '₁').replace('2', '₂')} = ${n4(o[k])} ${c1.base}`).join(' ; ') + '.');
      steps.push('Volumes convertis en L : ' + ['V1', 'V2'].filter(k => k !== u).map(k => `${k.replace('1', '₁').replace('2', '₂')} = ${n4(o[k])} L`).join(' ; ') + '.');
      const r = K.c1v1(o);
      const full = Object.assign({}, o, { [u]: r });
      const F = full.C1 / full.C2, dil = full.V2 - full.V1;
      const exprs = { V1: `V₁ = C₂ × V₂ / C₁ = ${n4(full.C2)} × ${n4(full.V2)} / ${n4(full.C1)}`, C2: `C₂ = C₁ × V₁ / V₂ = ${n4(full.C1)} × ${n4(full.V1)} / ${n4(full.V2)}`,
        V2: `V₂ = C₁ × V₁ / C₂ = ${n4(full.C1)} × ${n4(full.V1)} / ${n4(full.C2)}`, C1: `C₁ = C₂ × V₂ / V₁ = ${n4(full.C2)} × ${n4(full.V2)} / ${n4(full.V1)}` };
      let main;
      if (u === 'V1' || u === 'V2') { const unit = v[u === 'V1' ? 'V2_u' : 'V1_u']; main = { label: u === 'V1' ? 'Volume à prélever V₁' : 'Volume final V₂', value: n4(r / K.VOL[unit]), unit, main: true }; steps.push(`${exprs[u]} = ${fmtVol(r)}.`); }
      else { const unit = v[u === 'C1' ? 'C2_u' : 'C1_u']; const val = concFromBase(r, unit); main = { label: u === 'C2' ? 'Concentration finale C₂' : 'Concentration du stock C₁', value: n4(val), unit, main: true }; steps.push(`${exprs[u]} = ${n4(val)} ${unit}.`); }
      steps.push(`Diluant = V₂ − V₁ = ${fmtVol(dil)}.`, `Facteur F = C₁/C₂ = V₂/V₁ = ${n4(F)} ; fraction d = 1/F = ${K.sci(1 / F, 3, { trim: true })}.`);
      const warnings = [];
      const v1uL = full.V1 * 1e6;
      if (v1uL < 1) warnings.push(`V₁ = ${n4(v1uL)} µL : volume trop faible pour un pipetage fiable. Prévoir une dilution intermédiaire.`);
      return { formula: 'C₁ × V₁ = C₂ × V₂', steps, warnings,
        result: [main, { label: 'Volume de diluant', value: fmtVol(dil).split(' ')[0], unit: fmtVol(dil).split(' ')[1] }, { label: 'Facteur de dilution F', value: n4(F), unit: '' }, { label: 'Fraction d', value: K.sci(1 / F, 3, { trim: true }), unit: '' }],
        notes: [`Pipette suggérée pour V₁ (${fmtVol(full.V1)}) : ${pipette(v1uL)}.`], values: { r, F, dil } };
    },
    tests: [
      { in: { unk: 'V1', C1: '10', C1_u: 'mg/mL', C2: '50', C2_u: 'µg/mL', V2: '20', V2_u: 'mL' }, out: { r: 1e-4, F: 200 } },
      { in: { unk: 'C2', C1: '25', C1_u: 'g/L', V1: '2', V1_u: 'mL', V2: '50', V2_u: 'mL' }, out: { r: 1 } },
      { in: { unk: 'V2', C1: '1', C1_u: 'M', V1: '5', V1_u: 'mL', C2: '100', C2_u: 'mM' }, out: { r: 0.05 } },
      { in: { unk: 'V1', C1: '50', C1_u: 'X', C2: '1', C2_u: 'X', V2: '500', V2_u: 'mL' }, out: { r: 0.01 } }
    ]
  });

  // 5. Dilutions en serie ---------------------------------------------
  CALCS.push({
    id: 'serie', ch: 'm3', icon: 'tubes', title: 'Dilutions en série',
    desc: 'Facteur global, concentration de chaque tube, nombre de tubes.',
    fields: () => [
      { id: 'C0', label: 'Concentration de départ C₀', units: ['UFC/mL', 'cellules/mL', 'µg/mL', 'mg/mL', 'ng/µL', 'g/L', 'mM', 'µM', 'copies/µL'], unit: 'UFC/mL', def: '2e8' },
      { id: 'vt', label: 'Volume transféré par étape', units: ['µL', 'mL'], unit: 'mL', def: '1' },
      { id: 'vd', label: 'Volume de diluant par tube', unit: '(même unité)', def: '9' },
      { id: 'n', label: 'Nombre de tubes', unit: 'tubes', def: '6', int: true },
      { id: 'ct', label: 'Concentration cible (facultatif)', unit: '(unité de C₀)', def: '', optional: true }
    ],
    compute(v) {
      if (!(v.n >= 1 && v.n <= 15)) throw E('Le nombre de tubes doit être compris entre 1 et 15.');
      const s = K.serial(v.C0, Array.from({ length: v.n }, () => [v.vt, v.vd]));
      const f = (v.vt + v.vd) / v.vt;
      const rows = s.tubes.map(t => [`Tube ${t.tube}`, K.sci(t.F, 3, { trim: true }), K.sci(t.fraction, 3, { trim: true }), `${K.sci(t.C, 3, { trim: true })} ${v.C0_u}`]);
      const steps = [`Facteur par étape : f = (${n4(v.vt)} + ${n4(v.vd)}) / ${n4(v.vt)} = ${n4(f)}.`, `Facteur global après ${v.n} tubes : F = f<sup>${v.n}</sup> = ${K.sci(s.F, 3, { trim: true })}.`,
        `Concentration du dernier tube : ${K.sci(v.C0, 3, { trim: true })} / ${K.sci(s.F, 3, { trim: true })} = ${K.sci(s.tubes[v.n - 1].C, 3, { trim: true })} ${v.C0_u}.`,
        `Diluant total : ${v.n} × ${n4(v.vd)} = ${n4(v.n * v.vd)} ${v.vt_u} (prévoir une marge).`];
      const result = [{ label: `Concentration du tube ${v.n}`, value: K.sci(s.tubes[v.n - 1].C, 3, { trim: true }), unit: v.C0_u, main: true }, { label: 'Facteur global', value: K.sci(s.F, 3, { trim: true }), unit: '' }, { label: 'Diluant total', value: n4(v.n * v.vd), unit: v.vt_u }];
      const values = { F: s.F, Clast: s.tubes[v.n - 1].C };
      if (v.ct !== null && v.ct !== undefined) {
        const nt = K.tubesNeeded(v.C0, v.ct, f);
        steps.push(`Tubes nécessaires pour atteindre au plus ${K.sci(v.ct, 3, { trim: true })} : n = ⌈log(C₀/C) / log f⌉ = ${nt}.`);
        result.push({ label: 'Tubes nécessaires pour la cible', value: String(nt), unit: '' });
        values.nt = nt;
      }
      return { formula: 'F = f<sup>n</sup> ; C<sub>n</sub> = C<sub>0</sub> / F', steps, result, values,
        table: { head: ['Tube', 'Facteur cumulé F', 'Fraction d', 'Concentration'], rows }, viz: { type: 'tubes', n: v.n } };
    },
    tests: [
      { in: { C0: '2e8', C0_u: 'UFC/mL', vt: '1', vt_u: 'mL', vd: '9', n: '6', ct: '' }, out: { F: 1e6, Clast: 200 } },
      { in: { C0: '3e9', C0_u: 'UFC/mL', vt: '100', vt_u: 'µL', vd: '900', n: '6', ct: '3000' }, out: { nt: 6 } },
      { in: { C0: '128', C0_u: 'µg/mL', vt: '1', vt_u: 'mL', vd: '1', n: '6', ct: '' }, out: { Clast: 2 } }
    ]
  });

  // 6. Tampons concentres ---------------------------------------------
  CALCS.push({
    id: 'tampon', ch: 'm4', icon: 'flask', title: 'Tampons concentrés (X)',
    desc: 'TAE, TBE, PBS, SSC : stock nX vers solution de travail.',
    fields: () => [
      { id: 'preset', label: 'Tampon courant', type: 'select', options: BUF_PRESETS.map(p => [p[0], p[1]]), def: 'tae',
        onChange: (val, set) => { const p = BUF_PRESETS.find(x => x[0] === val); if (p && p[2]) { set('xs', K.fixed(p[2][0], 2)); set('xf', K.fixed(p[2][1], 2)); } } },
      { id: 'xs', label: 'Concentration du stock', unit: 'X', def: '50' },
      { id: 'xf', label: 'Concentration voulue', unit: 'X', def: '1' },
      { id: 'vf', label: 'Volume final', units: ['mL', 'L', 'µL'], unit: 'mL', def: '500' }
    ],
    compute(v) {
      const r = K.bufferFromStock(v.xs, v.xf, v.vf);
      const F = v.xs / v.xf;

  const PCR_KINDS = { conc: { label: 'Concentration', su: ['X', 'mM', 'µM', 'nM'], fu: ['X', 'mM', 'µM', 'nM'] }, units: { label: 'Enzyme (U)', su: ['U/µL'], fu: ['U'] },

  const PCR_PRESETS = {
    taq25: { label: 'Taq standard, 25 µL (exemple pédagogique)', vr: 25, rows: [
      ['Tampon 10X (sans Mg)', 'conc', 10, 'X', 1, 'X', true], ['MgCl₂', 'conc', 25, 'mM', 1.5, 'mM', true], ['dNTP (chacun)', 'conc', 10, 'mM', 200, 'µM', true],
      ['Amorce sens', 'conc', 10, 'µM', 0.2, 'µM', true], ['Amorce antisens', 'conc', 10, 'µM', 0.2, 'µM', true], ['Taq polymérase', 'units', 5, 'U/µL', 0.625, 'U', true],

    mm2x: { label: 'Master mix commercial 2X, 25 µL', vr: 25, rows: [['Master mix 2X', 'conc', 2, 'X', 1, 'X', true], ['Amorce sens', 'conc', 10, 'µM', 0.4, 'µM', true], ['Amorce antisens', 'conc', 10, 'µM', 0.4, 'µM', true], ['ADN matrice', 'volume', 0, '—', 3, 'µL', false]] },
    qpcr: { label: 'qPCR SYBR 2X, 10 µL', vr: 10, rows: [['Mix SYBR 2X', 'conc', 2, 'X', 1, 'X', true], ['Amorce sens', 'conc', 10, 'µM', 0.3, 'µM', true], ['Amorce antisens', 'conc', 10, 'µM', 0.3, 'µM', true], ['ADN (dilué)', 'volume', 0, '—', 2, 'µL', false]] }
  };
  function pcrCompute(state) {
    const vr = K.parseNum(state.vr), n = K.parseNum(state.n);
    if (!(vr > 0)) throw E('Volume réactionnel invalide.');
    if (!(n >= 1 && Number.isInteger(n))) throw E('Nombre de réactions : entier ≥ 1 (échantillons + témoins).');
    const sp = state.smode === 'n1' ? null : K.parseNum(state.surplus);
    if (state.smode !== 'n1' && !(sp >= 0 && sp <= 100)) throw E('Surplus : pourcentage entre 0 et 100.');
    const factor = state.smode === 'n1' ? n + 1 : n * (1 + sp / 100);
    const comps = state.rows.map((r, i) => {
      const name = (r.name || `Composant ${i + 1}`).trim();
      const stock = K.parseNum(r.stock), fin = K.parseNum(r.final);
      if (!(fin > 0)) throw E(`${name} : valeur finale invalide.`);
      if (r.kind === 'conc') {
        if (!(stock > 0)) throw E(`${name} : concentration du stock invalide.`);
        let s = stock, f = fin;
        if (r.su !== r.fu) {
          if (r.su in K.CMOL && r.fu in K.CMOL) { s = stock * K.CMOL[r.su]; f = fin * K.CMOL[r.fu]; }
          else throw E(`${name} : unités incompatibles (${r.su} et ${r.fu}).`);
        }
        return { name, kind: 'conc', stock: s, final: f, mm: r.mm, disp: r };
      }
      if (r.kind === 'units' || r.kind === 'amount') { if (!(stock > 0)) throw E(`${name} : concentration du stock invalide.`); return { name, kind: r.kind, stock, final: fin, mm: r.mm, disp: r }; }
      return { name, kind: 'volume', stock: 1, final: fin, mm: r.mm, disp: r };
    });
    const mix = K.pcrMix(vr, comps, n, 0);
    const warnings = [];
    let mmPer = mix.water, sepPer = 0;
    const rows = mix.rows.map(r => {
      if (r.mm) mmPer += r.v; else sepPer += r.v;
      let cdisp = '—';
      if (r.kind === 'conc') { let c = r.stock * r.v / vr; if (r.disp.su !== r.disp.fu) c = c / K.CMOL[r.disp.fu]; cdisp = `${K.fixed(c, 3)} ${r.disp.fu}`; }
      if (r.v < 0.5 && r.mm) warnings.push(`${r.name} : ${K.vol(r.v)} µL par réaction, à pipeter uniquement via le master mix (${K.vol(r.v * factor, 2)} µL au total).`);
      if (r.v < 0.5 && !r.mm) warnings.push(`${r.name} : ${K.vol(r.v)} µL par tube, trop faible pour un pipetage fiable : diluer la solution.`);
      return [r.name, r.disp.kind === 'volume' ? '—' : `${K.fixed(K.parseNum(r.disp.stock), 3)} ${r.disp.su}`, `${K.fixed(K.parseNum(r.disp.final), 3)} ${r.disp.fu}`,
        K.vol(r.v), r.mm ? K.vol(r.v * factor, 2) : 'ajout séparé', cdisp];
    });
    rows.push(['Eau sans nucléase', '—', '—', K.vol(mix.water), K.vol(mix.water * factor, 2), '—']);
    rows.push(['Total', '', '', K.vol(vr), K.vol(mmPer * factor, 2), '']);
    const steps = [`Pour chaque composant : V = C<sub>finale</sub> × ${K.fixed(vr, 2)} µL / C<sub>stock</sub> (unités identiques) ; enzyme : V = U / (U/µL) ; ADN : V = ng / (ng/µL).`,
      `Somme des réactifs : ${K.vol(vr - mix.water)} µL ; eau = ${K.fixed(vr, 2)} − ${K.vol(vr - mix.water)} = ${K.vol(mix.water)} µL.`,
      `Facteur du master mix : ${state.smode === 'n1' ? `${n} + 1 = ${factor}` : `${n} × ${K.fixed(1 + sp / 100, 3)} = ${K.fixed(factor, 3)}`}.`,
      `Distribuer ${K.vol(mmPer)} µL de master mix par tube${sepPer ? `, puis ${K.vol(sepPer)} µL d'ajouts séparés (matrice)` : ''}.`,
      `Contrôle : ${K.vol(mmPer)} + ${K.vol(sepPer)} = ${K.vol(mmPer + sepPer)} µL = volume réactionnel.`];
    return { formula: 'V<sub>i</sub> = C<sub>f</sub> × V<sub>r</sub> / C<sub>s</sub> ; V<sub>eau</sub> = V<sub>r</sub> − Σ V<sub>i</sub> ; MM = V × facteur',
      steps, warnings, table: { head: ['Composant', 'Stock', 'Final', '1 réaction (µL)', `Master mix ×${K.fixed(factor, 2)} (µL)`, 'C finale recalculée'], rows },
      result: [{ label: 'Eau par réaction', value: K.vol(mix.water), unit: 'µL', main: true }, { label: 'Master mix par tube', value: K.vol(mmPer), unit: 'µL' }, { label: 'Volume de master mix à préparer', value: K.vol(mmPer * factor, 2), unit: 'µL' }, { label: 'Facteur', value: K.fixed(factor, 3), unit: '' }],
      notes: ['Composition indicative : les concentrations et volumes dépendent du kit, de la polymérase et du protocole validé.', 'Compter les témoins négatif et positif dans le nombre de réactions.'],
      values: { water: mix.water, factor, mmPer, mmTotal: mmPer * factor } };
  }
  function pcrState(key) {
    const p = PCR_PRESETS[key];
    return { preset: key, vr: String(p.vr).replace('.', ','), n: '10', smode: 'pct', surplus: '10',
      rows: p.rows.map(r => ({ name: r[0], kind: r[1], stock: String(r[2]).replace('.', ','), su: r[3], final: String(r[4]).replace('.', ','), fu: r[5], mm: r[6] })) };
  }
  CALCS.push({

  // 11. UFC ------------------------------------------------------------
  function cfuInterp(C, V, d, min, max, unitLbl) {
    const notes = [], warnings = [];
    if (C === 0) { const L = K.lod(V, d); return { text: `&lt; ${K.sci(L, 2)}`, plain: `< ${K.sci(L, 2, { text: true })}`, N: null, L, warnings: ['Aucune colonie : le résultat est inférieur à la limite de détection, ce n\'est pas une concentration nulle.'] }; }
    if (C > max) warnings.push(`${C} colonies > ${max} : boîte hors plage dénombrable. La valeur n'est qu'une estimation minimale ; utiliser une dilution plus élevée.`);
    else if (C < min) warnings.push(`${C} colonies < ${min} : sous le minimum de la plage. Résultat à signaler comme estimé.`);
    const N = K.cfuSingle(C, V, d);
    return { N, warnings, notes, text: `${C > max ? '&gt; ' : ''}${K.sci(N, 2)}`, plain: `${C > max ? '> ' : ''}${K.sci(N, 2, { text: true })} ${unitLbl}` };
  }
  CALCS.push({
    id: 'ufc', ch: 'm9', icon: 'colonies', title: 'Dénombrement UFC/mL et UFC/g',
    desc: 'Une boîte, moyenne pondérée, échantillons solides, limite de détection.',
    modes: [['s', 'Une boîte'], ['w', 'Deux dilutions (pondérée)'], ['g', 'Échantillon solide (UFC/g)']],
    fields: mode => {
      const range = [{ id: 'min', label: 'Plage dénombrable : minimum', unit: 'colonies', def: '30', allowZero: true, int: true }, { id: 'max', label: 'Plage dénombrable : maximum', unit: 'colonies', def: '300', int: true }];

  function readValues(calc, mode, raw) {
    const v = {};

    fields.forEach(f => { if (f.type === 'select') v[f.id] = raw[f.id] !== undefined ? raw[f.id] : f.def; });
    for (const f of fields) {
      if (f.type === 'select') continue;
      if (f.skipIf && f.skipIf(v)) { v[f.id] = null; if (f.units) v[f.id + '_u'] = raw[f.id + '_u'] || f.unit; continue; }
      if (f.units) v[f.id + '_u'] = raw[f.id + '_u'] || f.unit;
      const s = raw[f.id] !== undefined ? raw[f.id] : f.def;
      if (f.type === 'list') {
        const parts = String(s || '').split(/[;\n]+/).map(x => x.trim()).filter(Boolean);
        if (!parts.length) { if (f.optional) { v[f.id] = []; continue; } throw E(`${f.label} : saisir au moins une valeur.`); }
        v[f.id] = parts.map(p => { const x = K.parseNum(p); if (!Number.isFinite(x)) throw E(`${f.label} : « ${p} » n'est pas un nombre.`); return x; });
        continue;
      }
      if (String(s || '').trim() === '') { if (f.optional) { v[f.id] = null; continue; } throw E(`${f.label} : valeur manquante.`); }
      const x = K.parseNum(s);
      if (!Number.isFinite(x)) throw E(`${f.label} : « ${s} » n'est pas un nombre valide (exemples : 2,5 ; 1,6e7 ; 10^-3).`);
      if (x < 0 || (x === 0 && !f.allowZero)) throw E(`${f.label} : la valeur doit être ${f.allowZero ? 'positive ou nulle' : 'strictement positive'}.`);
      if (f.int && !Number.isInteger(x)) throw E(`${f.label} : un nombre entier est attendu.`);

  function runTests() {
    const out = [];

 10^-4 » sur la calculatrice (touche EXP ou ×10<sup>x</sup> déjà incluse)."], "quick": ["Écrire en notation scientifique 0,000 25 et 3 400 000.", "2,5 × 10<sup>-4</sup> ; 3,4 × 10<sup>6</sup>."], "tables": []}, {"code": "1.5", "t": "Masse à peser, volume à prélever, volume final", "use": "Ce sont les trois questions de toute préparation : combien je pèse, combien je prélève, à quel volume je complète.", "def": "La masse à peser se déduit d'une concentration et d'un volume final. Le volume à prélever se déduit d'une concentration de stock. Le volume final est le volume total après mélange, et non le volume de solvant ajouté.", "f": ["m = C<sub>m</sub> × V<sub>final</sub>", "V<sub>prélevé</sub> = C<sub>finale</sub> × V<sub>final</sub> / C<sub>stock</sub>", "V<sub>solvant</sub> = V<sub>final</sub> − V<sub>prélevé</sub>"], "vars": [["m", "masse à peser", "g"], ["C<sub>m</sub>", "concentration massique visée", "g/L"], ["V<sub>final</sub>", "volume final", "L"], ["C<sub>stock</sub>", "concentration du stock", "même unité que C<sub>finale</sub>"]], "units": "C<sub>m</sub> en g/L impose V en L pour obtenir m en g. Pour les dilutions, C<sub>finale</sub> et C<sub>stock</sub> doivent être dans la même unité.", "method": ["Écrire ce qui est connu et ce qui est cherché, avec unités.", "Choisir la formule (poudre → masse ; stock liquide → volume).", "Convertir dans des unités compatibles.", "Calculer, puis déduire le volume de solvant si nécessaire."], "ex": {"q": "Préparer 200 mL d'une solution à 5 g/L à partir d'une poudre, puis 50 mL à 0,5 g/L à partir de cette solution.", "steps": ["Masse : m = 5 g/L × 0,200 L = 1 g.", "Volume à prélever : V = 0,5 × 50 / 5 = 5 mL.", "Solvant : 50 − 5 = 45 mL."], "r": "Peser 1 g et compléter à 200 mL ; prélever 5 mL de cette solution et compléter à 50 mL (45 mL de solvant)."}, "check": "La deuxième solution est 10 fois moins concentrée : on prélève bien 1/10 du volume final.", "err": ["Utiliser V = 200 (mL) avec C en g/L : résultat 1000 fois trop grand (1000 g).", "Ajouter 50 mL de solvant au lieu de compléter à 50 mL."], "quick": ["Quelle masse faut-il pour 750 mL à 2 g/L ?", "1,5 g."], "tables": []}, {"code": "1.6", "t": "Chiffres significatifs et arrondis", "use": "Rendre un résultat avec une précision réaliste : la balance, la pipette et le comptage de colonies ne sont pas infiniment précis.", "def": "Les chiffres significatifs sont les chiffres connus avec certitude plus le premier chiffre incertain. Les zéros de tête ne sont pas significatifs.", "f": ["Produit/quotient : garder le nombre de chiffres significatifs de la donnée la moins précise.", "Somme/différence : garder le nombre de décimales de la donnée la moins précise."], "vars": [["CS", "chiffres significatifs", "sans unité"]], "units": "L'arrondi se fait à la fin du calcul, jamais sur les résultats intermédiaires.", "method": ["Garder tous les chiffres pendant le calcul.", "Identifier la donnée la moins précise.", "Arrondir le résultat final (règle du 5 : on arrondit au supérieur).", "Adapter la précision à l'instrument : une pipette P20 ne délivre pas 3,456 µL."], "ex": {"q": "On pèse 0,4382 g de NaCl (M = 58,44 g/mol) dissous dans 50,0 mL. Calculer la concentration molaire.", "steps": ["n = 0,4382 / 58,44 = 0,007498 mol.", "C = n / V = 0,007498 / 0,0500 = 0,14997 mol/L.", "Données à 4, 4 et 3 chiffres significatifs : on garde 3 CS."], "r": "C = 0,150 mol/L (150 mM)."}, "check": "0,15 M est la concentration de la solution saline isotonique classique, ordre de grandeur plausible.", "err": ["Arrondir n à 0,0075 avant de diviser : erreur relative inutile.", "Donner 1,5625 × 10<sup>7</sup> UFC/mL : un comptage de colonies justifie au plus 2 chiffres significatifs.", "Supprimer les zéros significatifs : 0,150 n'est pas 0,15 du point de vue de la précision."], "quick": ["Arrondir 0,024 56 et 18 750 à 2 chiffres significatifs.", "0,025 ; 1,9 × 10<sup>4</sup>."], "tables": []}, {"code": "1.7", "t": "Vérification des unités et des ordres de grandeur", "use": "Détecter une erreur avant de peser ou de pipeter : c'est la dernière barrière avant de gaspiller un réactif ou une manipulation.", "def": "L'analyse dimensionnelle consiste à calculer avec les unités comme avec des nombres. L'ordre de grandeur compare le résultat à ce qui est physiquement plausible.", "f": ["(g/L) × L = g", "(mg/mL) × mL = mg", "(UFC) / (mL × sans unité) = UFC/mL"], "vars": [["—", "unités traitées comme des facteurs algébriques", "—"]], "units": "Si les unités ne se simplifient pas pour donner l'unité attendue, la formule ou la conversion est fausse.", "method": ["Écrire les unités à chaque ligne de calcul.", "Simplifier les unités et vérifier l'unité finale.", "Comparer à des repères : un tube Eppendorf contient 1,5 ou 2 mL, une réaction PCR 10 à 50 µL, une boîte de Petri 15 à 25 mL, une culture d'une nuit 10<sup>8</sup> à 10<sup>9</sup> UFC/mL.", "Refaire le calcul par un autre chemin si un doute persiste."], "ex": {"q": "Un calcul indique de prélever 2 500 µL de dNTP pour une réaction PCR de 25 µL. Diagnostiquer.", "steps": ["Le volume prélevé (2 500 µL) dépasse le volume réactionnel (25 µL) : impossible.", "Le résultat est 5 000 fois trop grand : c'est la signature d'une erreur de conversion (mM et µM mélangés) ou d'une formule inversée.", "Calcul correct : 0,2 mM × 25 µL / 10 mM = 0,5 µL."], "r": "Le bon volume est 0,5 µL."}, "check": "0,5 µL représente 2 % du volume réactionnel, ordre de grandeur habituel pour les dNTP.", "err": ["Mélanger mM et µM dans C<sub>1</sub>V<sub>1</sub> = C<sub>2</sub>V<sub>2</sub>.", "Accepter un volume prélevé supérieur au volume final.", "Ne pas noter les unités dans le cahier de laboratoire."], "quick": ["Un étudiant trouve qu'il faut peser 250 g d'agarose pour un gel de 50 mL à 0,5 %. Quel est le bon résultat ?", "0,25 g (erreur d'un facteur 1000)."], "tables": []}]}, {"id": "m2", "num": 2, "title": "Masses et concentrations", "intro": "Préparer une solution à partir d'une poudre ou d'un stock, en concentration massique ou molaire, à partir d'une fiche technique.", "notions": [{"code": "2.1", "t": "Concentration massique", "use": "Exprimer la composition d'un milieu (g/L), d'un stock d'antibiotique (mg/mL), d'un extrait d'ADN (ng/µL).", "def": "La concentration massique est la masse de soluté dissoute par unité de volume de solution finale.", "f": ["C<sub>m</sub> = m / V"], "vars": [["C<sub>m</sub>", "concentration massique", "g/L"], ["m", "masse de soluté", "g"], ["V", "volume de solution", "L"]], "units": "Combinaisons compatibles : g et L → g/L ; mg et mL → mg/mL ; ng et µL → ng/µL. Ne pas mélanger g et mL sans conversion.", "method": ["Convertir la masse et le volume dans des unités compatibles.", "Diviser la masse par le volume final."], "ex": {"q": "On dissout 12 mg de kanamycine dans un volume final de 0,24 mL. Concentration ?", "steps": ["C<sub>m</sub> = 12 mg / 0,24 mL = 50 mg/mL.", "Soit 50 g/L."], "r": "50 mg/mL."}, "check": "50 mg/mL est une concentration de stock usuelle pour la kanamycine (utilisation finale autour de 50 µg/mL).", "err": ["Diviser par le volume d'eau ajouté plutôt que par le volume final.", "Oublier que mg/mL = g/L."], "quick": ["2,5 g de saccharose dans 125 mL. C<sub>m</sub> en g/L ?", "20 g/L."], "tables": []}, {"code": "2.2", "t": "Masse à peser à partir d'une poudre", "use": "Préparer un tampon, un milieu, une solution d'un sel à partir d'un produit sec.", "def": "La masse à peser est le produit de la concentration massique visée par le volume final.", "f": ["m = C<sub>m</sub> × V"], "vars": [["m", "masse à peser", "g"], ["C<sub>m</sub>", "concentration visée", "g/L"], ["V", "volume final", "L"]], "units": "C<sub>m</sub> en g/L et V en L donnent m en g. Avec V en mL, diviser par 1000.", "method": ["Convertir le volume final en L.", "Calculer m = C<sub>m</sub> × V.", "Peser, dissoudre dans environ 80 % du volume, ajuster le pH si demandé, compléter au volume final."], "ex": {"q": "Préparer 350 mL de solution de NaCl à 8 g/L.", "steps": ["V = 350 mL = 0,350 L.", "m = 8 × 0,350 = 2,8 g."], "r": "Peser 2,8 g de NaCl et compléter à 350 mL."}, "check": "Pour 1 L il faudrait 8 g ; pour un peu plus d'un tiers de litre, un peu moins de 3 g : cohérent.", "err": ["Multiplier par 350 au lieu de 0,350.", "Ajuster le pH après avoir complété au volume final (le volume change)."], "quick": ["Masse de Tris pour 600 mL à 6 g/L ?", "3,6 g."], "tables": []}, {"code": "2.3", "t": "Volume ou concentration inconnus", "use": "Savoir quel volume préparer avec la poudre disponible, ou retrouver la concentration d'une solution déjà préparée.", "def": "La relation C<sub>m</sub> = m / V se réarrange pour isoler l'inconnue.", "f": ["V = m / C<sub>m</sub>", "C<sub>m</sub> = m / V"], "vars": [["V", "volume final", "L"], ["m", "masse", "g"], ["C<sub>m</sub>", "concentration", "g/L"]], "units": "Même compatibilité qu'à la notion précédente.", "method": ["Identifier l'inconnue.", "Isoler l'inconnue algébriquement avant de remplacer par les valeurs.", "Convertir le résultat dans l'unité pratique (mL)."], "ex": {"q": "Il reste 1,2 g d'un supplément à utiliser à 4 g/L. Quel volume de solution peut-on préparer ?", "steps": ["V = 1,2 / 4 = 0,3 L = 300 mL."], "r": "300 mL."}, "check": "300 mL × 4 g/L = 0,3 × 4 = 1,2 g : on retrouve la masse disponible.", "err": ["Écrire V = C<sub>m</sub> / m (formule inversée).", "Rendre 0,3 sans unité."], "quick": ["Quelle concentration si 0,9 g est dissous dans 150 mL ?", "6 g/L."], "tables": []}, {"code": "2.4", "t": "Quantité de matière et masse molaire", "use": "Indispensable dès qu'une concentration est donnée en M, mM ou µM (Tris, EDTA, MgCl<sub>2</sub>, NaCl).", "def": "La quantité de matière n (en mol) est le rapport de la masse m à la masse molaire M du composé, lue sur le flacon ou la fiche technique.", "f": ["n = m / M", "m = n × M"], "vars": [["n", "quantité de matière", "mol"], ["m", "masse", "g"], ["M", "masse molaire", "g/mol"]], "units": "Utiliser la masse molaire de la forme réellement pesée (sel anhydre ou hydraté : MgCl<sub>2</sub> = 95,21 g/mol ; MgCl<sub>2</sub>·6H<sub>2</sub>O = 203,30 g/mol).", "method": ["Lire M sur le flacon (forme hydratée incluse).", "Convertir m en g.", "Calculer n = m / M."], "ex": {"q": "Combien de moles dans 2,92 g de NaCl (M = 58,44 g/mol) ?", "steps": ["n = 2,92 / 58,44 = 0,05 mol."], "r": "n ≈ 0,0500 mol = 50,0 mmol."}, "check": "58,44 g correspond à 1 mol ; 2,92 g est environ 1/20 de cette masse : 0,05 mol.", "err": ["Utiliser la masse molaire de la forme anhydre alors qu'on pèse un hydrate.", "Confondre mol et mmol."], "quick": ["Quelle masse de glucose (M = 180,16 g/mol) correspond à 0,025 mol ?", "4,504 g ≈ 4,50 g."], "tables": []}, {"code": "2.5", "t": "Concentration molaire et préparation à partir d'une poudre", "use": "Préparer Tris 1 M, EDTA 0,5 M, MgCl<sub>2</sub> 1 M, NaCl 5 M : les stocks de base de la biologie moléculaire.", "def": "La concentration molaire C est la quantité de matière par litre de solution. En combinant avec n = m / M, on obtient directement la masse à peser.", "f": ["C = n / V", "m = C × V × M", "m<sub>à peser</sub> = C × V × M / pureté   (pureté en fraction, ex. 0,98)"], "vars": [["C", "concentration molaire", "mol/L (M)"], ["V", "volume final", "L"], ["M", "masse molaire", "g/mol"]], "units": "1 M = 1 mol/L ; 1 mM = 10<sup>-3</sup> mol/L ; 1 µM = 10<sup>-6</sup> mol/L. Convertir C en mol/L et V en L.", "method": ["Convertir C en mol/L et V en L.", "Calculer m = C × V × M.", "Corriger par la pureté si elle est indiquée et utile.", "Dissoudre, ajuster le pH si nécessaire, compléter au volume final."], "ex": {"q": "Préparer 500 mL de NaCl 150 mM (M = 58,44 g/mol).", "steps": ["C = 150 mM = 0,150 mol/L ; V = 0,500 L.", "m = 0,150 × 0,500 × 58,44 = 4,383 g."], "r": "Peser 4,38 g de NaCl et compléter à 500 mL."}, "check": "n = 0,075 mol ; 0,075 × 58,44 = 4,383 g. Autres exemples : Tris 1 M, 250 mL : 30,29 g ; EDTA disodique dihydraté 0,5 M, 100 mL : 18,61 g ; MgCl<sub>2</sub>·6H<sub>2</sub>O 1 M, 100 mL : 20,33 g.", "err": ["Laisser C en mM : résultat 1000 fois trop grand.", "Oublier que l'EDTA disodique ne se dissout qu'à pH proche de 8 : la masse est juste mais la solution reste trouble.", "Négliger la pureté pour un réactif à 90 % lorsqu'une concentration exacte est requise."], "quick": ["Masse de CaCl<sub>2</sub>·2H<sub>2</sub>O (M = 147,01 g/mol, pureté 98 %) pour 500 mL à 0,2 M ?", "15 g."], "tables": []}, {"code": "2.6", "t": "Passer d'une concentration molaire à une concentration massique", "use": "Comparer une fiche technique en g/L à un protocole en mM, ou vérifier la cohérence d'une recette.", "def": "La concentration massique est le produit de la concentration molaire par la masse molaire.", "f": ["C<sub>m</sub> = C × M", "C = C<sub>m</sub> / M"], "vars": [["C<sub>m</sub>", "concentration massique", "g/L"], ["C", "concentration molaire", "mol/L"], ["M", "masse molaire", "g/mol"]], "units": "(mol/L) × (g/mol) = g/L.", "method": ["Convertir C en mol/L.", "Multiplier par M."], "ex": {"q": "Le TAE 50X contient 242 g/L de Tris base (M = 121,14 g/mol). Quelle est sa concentration molaire en Tris, et celle du TAE 1X ?", "steps": ["C = 242 / 121,14 = 1,998 mol/L ≈ 2 M.", "TAE 1X = 50 fois moins concentré : 40 mM ≈ 40 mM."], "r": "Environ 2 M dans le 50X et 40 mM dans le 1X."}, "check": "On retrouve la composition publiée du TAE 1X (40 mM Tris-acétate, 1 mM EDTA).", "err": ["Diviser M par C<sub>m</sub>.", "Oublier le facteur 50 entre stock et solution de travail."], "quick": ["Exprimer NaCl 0,9 % m/V en mM (M = 58,44 g/mol).", "9 g/L / 58,44 = 0,154 M = 154 mM."], "tables": []}, {"code": "2.7", "t": "Préparer une solution à partir d'une fiche technique", "use": "Les fiches de produits et les protocoles donnent souvent la composition sous une forme différente de celle dont on a besoin.", "def": "Lire une fiche technique consiste à repérer pour chaque composant : la forme chimique, la masse molaire, la concentration finale et le volume de référence.", "f": ["m<sub>i</sub> (pour V) = m<sub>i</sub> (pour 1 L) × V(L)", "m<sub>i</sub> = C<sub>i</sub> × V × M<sub>i</sub>"], "vars": [["i", "composant de la recette", "—"]], "units": "Vérifier si la recette est donnée pour 1 L, pour 100 mL ou en concentration finale.", "method": ["Recopier la recette dans un tableau : composant, forme, M, concentration, masse pour 1 L.", "Mettre à l'échelle du volume voulu.", "Repérer les étapes imposées (pH, ordre de dissolution, stérilisation)."], "ex": {"q": "Préparer 250 mL du tampon du tableau ci-dessus (Tris 50 mM, NaCl 150 mM, EDTA 1 mM).", "steps": ["Chaque masse pour 1 L est multipliée par 0,250.", "Une masse de 0,093 g d'EDTA se pèse mal : il est plus juste d'ajouter 0,5 mL d'EDTA 0,5 M (0,5 M × 0,5 mL / 250 mL = 1 mM)."], "r": "1,514 g de Tris, 2,192 g de NaCl, 0,5 mL d'EDTA 0,5 M, ajuster le pH puis compléter à 250 mL."}, "check": "La solution d'EDTA 0,5 M diluée 500 fois donne bien 1 mM.", "err": ["Recopier la masse pour 1 L alors qu'on prépare 250 mL.", "Peser des masses inférieures à la précision de la balance au lieu d'utiliser un stock."], "quick": ["Une recette donne 5 g/L d'extrait de levure. Masse pour 400 mL ?", "2 g."], "tables": [{"head": ["Composant (recette pédagogique)", "Concentration finale", "M (g/mol)", "Masse pour 1 L", "Masse pour 250 mL"], "rows": [["Tris base", "50 mM", "121,14", "6,057 g", "1,514 g"], ["NaCl", "150 mM", "58,44", "8,766 g", "2,192 g"], ["EDTA disodique ·2H<sub>2</sub>O", "1 mM", "372,24", "0,372 g", "0,0931 g"]]}]}]}, {"id": "m3", "num": 3, "title": "Dilutions simples et en série", "intro": "Module central : toutes les manipulations (solutions de travail, tampons, dénombrements, ADN) reposent sur la même logique de dilution.", "notions": [{"code": "3.1", "t": "Vocabulaire : facteur, fraction, volumes", "use": "Éviter la confusion la plus fréquente des comptes rendus : « dilution 10<sup>-3</sup> » et « facteur 1000 » désignent la même opération vue de deux côtés.", "def": "Le facteur de dilution F est le rapport volume final / volume transféré (F ≥ 1). La fraction de dilution d est son inverse (d ≤ 1). Le volume final est la somme du volume transféré et du volume de diluant.", "f": ["F = V<sub>final</sub> / V<sub>transféré</sub> = C<sub>initiale</sub> / C<sub>finale</sub>", "d = 1 / F = V<sub>transféré</sub> / V<sub>final</sub>", "V<sub>final</sub> = V<sub>transféré</sub> + V<sub>diluant</sub>"], "vars": [["F", "facteur de dilution", "sans unité, ≥ 1 (ex. 10)"], ["d", "fraction de dilution", "sans unité, ≤ 1 (ex. 1/10 = 10<sup>-1</sup>)"], ["V<sub>transféré</sub>", "volume de solution mère prélevé", "mL ou µL"], ["V<sub>diluant</sub>", "volume de diluant ajouté", "même unité"], ["V<sub>final</sub>", "volume total après mélange", "même unité"]], "units": "F et d sont sans unité. Les trois volumes doivent être exprimés dans la même unité.", "method": ["Lire si l'énoncé donne un facteur (« diluer 10 fois ») ou une fraction (« au 1/10 », « 10<sup>-1</sup> »).", "Calculer V<sub>transféré</sub> = V<sub>final</sub> / F.", "Calculer V<sub>diluant</sub> = V<sub>final</sub> − V<sub>transféré</sub>."], "ex": {"q": "Diluer au 1/10 une suspension pour obtenir 5 mL. Donner F, d, les volumes.", "steps": ["F = 10 ; d = 1/10 = 10<sup>-1</sup>.", "V<sub>transféré</sub> = 5 / 10 = 0,5 mL.", "V<sub>diluant</sub> = 5 − 0,5 = 4,5 mL."], "r": "0,5 mL de suspension + 4,5 mL de diluant."}, "check": "Le rapport 5 / 0,5 = 10 redonne bien le facteur.", "err": ["Ajouter 5 mL de diluant à 0,5 mL : on obtient 1/11 et non 1/10.", "Écrire « dilution 10 » quand on veut dire 10<sup>-1</sup> : préciser facteur ou fraction.", "Utiliser F au lieu de d dans la formule de dénombrement."], "quick": ["Pour une dilution au 1/4 dans 2 mL, quels volumes ?", "0,5 mL de solution + 1,5 mL de diluant."], "tables": [{"head": ["Expression", "Facteur F", "Fraction d", "Transféré pour 10 mL", "Diluant"], "rows": [["« au 1/2 »", "2", "0,5", "5 mL", "5 mL"], ["« au 1/5 »", "5", "0,2", "2 mL", "8 mL"], ["« au 1/10 », 10<sup>-1</sup>", "10", "0,1", "1 mL", "9 mL"], ["« au 1/20 »", "20", "0,05", "0,5 mL", "9,5 mL"], ["« au 1/100 », 10<sup>-2</sup>", "100", "0,01", "0,1 mL", "9,9 mL"], ["« au 1/1000 », 10<sup>-3</sup>", "1000", "0,001", "10 µL", "9,99 mL"]]}]}, {"code": "3.2", "t": "Relation C<sub>1</sub>V<sub>1</sub> = C<sub>2</sub>V<sub>2</sub>", "use": "Préparer une solution de travail à partir d'un stock : antibiotique, tampon, amorce, ADN.", "def": "Lors d'une dilution, la quantité de soluté prélevée se retrouve entièrement dans la solution finale. Le produit concentration × volume est conservé.", "f": ["C<sub>1</sub> × V<sub>1</sub> = C<sub>2</sub> × V<sub>2</sub>", "V<sub>1</sub> = C<sub>2</sub> × V<sub>2</sub> / C<sub>1</sub>"], "vars": [["C<sub>1</sub>", "concentration de la solution mère", "unité au choix"], ["V<sub>1</sub>", "volume de solution mère à prélever", "unité au choix"], ["C<sub>2</sub>", "concentration finale voulue", "même unité que C<sub>1</sub>"], ["V<sub>2</sub>", "volume final", "même unité que V<sub>1</sub>"]], "units": "C<sub>1</sub> et C<sub>2</sub> dans la même unité (g/L avec g/L, mM avec mM, X avec X) ; V<sub>1</sub> et V<sub>2</sub> dans la même unité. Conditions : C<sub>2</sub> ≤ C<sub>1</sub> et V<sub>1</sub> ≤ V<sub>2</sub>.", "method": ["Mettre C<sub>1</sub> et C<sub>2</sub> dans la même unité.", "Isoler l'inconnue.", "Vérifier V<sub>1</sub> ≤ V<sub>2</sub>.", "Calculer le diluant : V<sub>2</sub> − V<sub>1</sub>."], "ex": {"q": "Préparer 20 mL d'une solution de glucose à 2 g/L à partir d'un stock à 200 g/L.", "steps": ["V<sub>1</sub> = 2 × 20 / 200 = 0,2 mL.", "Diluant : 20 − 0,2 = 19,8 mL."], "r": "0,2 mL (200 µL) de stock + 19,8 mL de diluant."}, "check": "F = 200 / 2 = 100 et 20 / 0,2 = 100 : cohérent.", "err": ["C<sub>1</sub> en mg/mL et C<sub>2</sub> en µg/mL sans conversion.", "Utiliser la formule pour un mélange de deux solutions de soluté différent.", "Inverser C<sub>1</sub> et C<sub>2</sub> : volume prélevé supérieur au volume final."], "quick": ["Volume d'EDTA 0,5 M pour 200 mL à 5 mM ?", "2 mL."], "tables": []}, {"code": "3.3", "t": "Dilutions décimales successives", "use": "Atteindre des facteurs élevés (10<sup>6</sup>, 10<sup>8</sup>) pour le dénombrement, impossibles en une seule étape avec une précision acceptable.", "def": "Une série de dilutions au 1/10 consiste à transférer un volume dans 9 volumes de diluant, puis à répéter l'opération à partir du tube précédent.", "f": ["Tube k : d<sub>k</sub> = 10<sup>-k</sup>", "C<sub>k</sub> = C<sub>0</sub> × 10<sup>-k</sup>"], "vars": [["k", "rang du tube", "1, 2, 3…"], ["C<sub>0</sub>", "concentration de la suspension de départ", "UFC/mL, g/L…"]], "units": "La concentration de chaque tube garde l'unité de C<sub>0</sub>.", "method": ["Préparer k tubes de 9 mL (ou 900 µL) de diluant stérile.", "Transférer 1 mL (ou 100 µL) du tube précédent avec un cône neuf.", "Homogénéiser avant chaque prélèvement.", "Noter la fraction de dilution de chaque tube."], "ex": {"q": "Une culture contient environ 2 × 10<sup>8</sup> UFC/mL. Concentration attendue dans chacun des 6 tubes d'une série au 1/10 ?", "steps": ["Chaque tube divise la concentration par 10.", "Tube 1 : 2 × 10<sup>7</sup> UFC/mL", "Tube 2 : 2 × 10<sup>6</sup> UFC/mL", "Tube 3 : 2 × 10<sup>5</sup> UFC/mL", "Tube 4 : 2 × 10<sup>4</sup> UFC/mL", "Tube 5 : 2 × 10<sup>3</sup> UFC/mL", "Tube 6 : 2 × 10<sup>2</sup> UFC/mL"], "r": "Tube 6 : 2 × 10<sup>2</sup> UFC/mL, soit environ 20 colonies pour 0,1 mL étalé."}, "check": "Facteur global = 10<sup>6</sup> ; 2 × 10<sup>8</sup> / 10<sup>6</sup> = 2 × 10<sup>2</sup>.", "err": ["Réutiliser le même cône : entraînement de bactéries, surestimation.", "Ne pas homogénéiser : sous-estimation ou surestimation selon la sédimentation.", "Numéroter les tubes sans noter la fraction de dilution correspondante."], "quick": ["Quelle fraction de dilution au tube 4 d'une série au 1/10 ?", "10<sup>-4</sup>."], "tables": []}, {"code": "3.4", "t": "Facteur global et concentration finale", "use": "Calculer la concentration après des dilutions de facteurs différents (1/2 puis 1/10 puis 1/5…).", "def": "Lorsque plusieurs dilutions se succèdent, les facteurs se multiplient et les fractions se multiplient aussi.", "f": ["F<sub>global</sub> = F<sub>1</sub> × F<sub>2</sub> × … × F<sub>n</sub>", "d<sub>global</sub> = d<sub>1</sub> × d<sub>2</sub> × … × d<sub>n</sub>", "C<sub>finale</sub> = C<sub>0</sub> / F<sub>global</sub>"], "vars": [["F<sub>i</sub>", "facteur de l'étape i", "sans unité"], ["C<sub>0</sub>", "concentration initiale", "toute unité"]], "units": "Les facteurs ne s'additionnent jamais.", "method": ["Calculer chaque facteur : F<sub>i</sub> = (V<sub>transféré</sub> + V<sub>diluant</sub>) / V<sub>transféré</sub>.", "Multiplier les facteurs.", "Diviser C<sub>0</sub> par le facteur global."], "ex": {"q": "Une solution à 500 µg/mL subit : 100 µL + 400 µL, puis 50 µL + 950 µL, puis 200 µL + 200 µL. Concentration finale ?", "steps": ["F<sub>1</sub> = 500 / 100 = 5 ; F<sub>2</sub> = 1000 / 50 = 20 ; F<sub>3</sub> = 400 / 200 = 2.", "F<sub>global</sub> = 5 × 20 × 2 = 200.", "C = 500 / 200 = 2,5 µg/mL."], "r": "2,5 µg/mL (fraction globale 1/200 = 5 × 10<sup>-3</sup>)."}, "check": "Une addition des facteurs (5 + 20 + 2 = 27) donnerait 18,5 µg/mL : valeur fausse. Le produit est la seule règle valable.", "err": ["Additionner les facteurs.", "Calculer F = V<sub>diluant</sub> / V<sub>transféré</sub> (400/100 = 4 au lieu de 5)."], "quick": ["Facteur global de trois dilutions : 1/10, 1/10, 1/4 ?", "400."], "tables": []}, {"code": "3.5", "t": "Nombre de tubes et volumes de transfert", "use": "Planifier une série : combien de tubes préparer pour atteindre la concentration voulue, quel volume de diluant prévoir.", "def": "Le nombre minimal d'étapes n au facteur f pour passer de C<sub>0</sub> à C<sub>cible</sub> est le plus petit entier tel que f<sup>n</sup> ≥ C<sub>0</sub> / C<sub>cible</sub>.", "f": ["n = ⌈ log(C<sub>0</sub> / C<sub>cible</sub>) / log(f) ⌉", "V<sub>transféré</sub> = V<sub>final</sub> / f ; V<sub>diluant</sub> = V<sub>final</sub> × (f − 1) / f"], "vars": [["n", "nombre de tubes de dilution", "entier"], ["f", "facteur par étape", "sans unité"]], "units": "Le crochet ⌈ ⌉ signifie arrondir à l'entier supérieur.", "method": ["Calculer le facteur global nécessaire.", "Déterminer n.", "Choisir le volume final par tube selon l'usage (ensemencement, réserve).", "Calculer le diluant total : n × V<sub>diluant</sub> (+ marge)."], "ex": {"q": "On veut passer d'environ 3 × 10<sup>9</sup> UFC/mL à moins de 3 000 UFC/mL par dilutions au 1/10 de 10 mL finaux. Combien de tubes, quel volume de diluant ?", "steps": ["Rapport : 3 × 10<sup>9</sup> / 3 × 10<sup>3</sup> = 10<sup>6</sup>.", "n = log(10<sup>6</sup>) / log(10) = 6 tubes.", "Par tube : 1 mL transféré + 9 mL de diluant.", "Diluant total : 6 × 9 = 54 mL (prévoir environ 60 mL)."], "r": "6 tubes, 54 mL de diluant minimum."}, "check": "Après 6 tubes : 3 × 10<sup>9</sup> × 10<sup>-6</sup> = 3 × 10<sup>3</sup> UFC/mL.", "err": ["Oublier le tube de départ dans le comptage ou au contraire le compter comme une dilution.", "Ne pas prévoir de marge de diluant."], "quick": ["Combien d'étapes au 1/100 pour un facteur 10<sup>6</sup> ?", "3."], "tables": []}, {"code": "3.6", "t": "Choix des pipettes adaptées aux volumes calculés", "use": "Un calcul juste ne sert à rien si le volume est pipeté avec un instrument inadapté.", "def": "Chaque micropipette a une plage d'utilisation. La justesse et la répétabilité sont meilleures dans la partie haute de la plage. On choisit la plus petite pipette capable de délivrer le volume en une seule fois.", "f": ["Règle pratique : volume compris dans la plage nominale, idéalement ≥ 10 % (mieux ≥ 35 %) du volume maximal."], "vars": [["V<sub>nom</sub>", "volume nominal (maximal) de la pipette", "µL ou mL"]], "units": "Les plages exactes dépendent du fabricant et sont données dans la notice ; les exigences de performance sont décrites par la norme ISO 8655.", "method": ["Lister les volumes calculés.", "Pour chacun, choisir la plus petite pipette qui le couvre.", "Si un volume est inférieur à 0,5–1 µL, prévoir une dilution intermédiaire ou un master mix.", "Éviter de fractionner un volume en plusieurs prises."], "ex": {"q": "Choisir les pipettes pour : 0,125 µL de Taq, 16,875 µL d'eau, 450 µL de diluant, 9 mL de bouillon.", "steps": ["0,125 µL : en dessous de toute plage fiable : préparer un master mix (pour 10 réactions : 1,25 µL avec une P2).", "16,875 µL : P20 (réglée à 16,9 µL, précision réelle de l'instrument).", "450 µL : P1000 (la P200 est trop petite).", "9 mL : pipette sérologique de 10 mL."], "r": "Master mix + P2, P20, P1000, sérologique 10 mL."}, "check": "Aucun volume n'est pipeté sous 10 % de la capacité de l'instrument choisi.", "err": ["Pipeter 2 µL avec une P200.", "Faire 3 prises de 200 µL pour 600 µL au lieu d'une P1000.", "Afficher sur la pipette plus de décimales que son réglage ne le permet."], "quick": ["Quelle pipette pour 75 µL ? pour 3 µL ?", "75 µL : P200 (37,5 % de sa capacité). 3 µL : P10 (30 % de sa capacité), préférable à une P20 (15 %)."], "tables": [{"head": ["Pipette", "Plage usuelle", "Exemples de volumes adaptés"], "rows": [["P2", "0,2 à 2 µL", "0,5 µL ; 1,25 µL"], ["P10", "0,5 (ou 1) à 10 µL", "2,5 µL ; 8 µL"], ["P20", "2 à 20 µL", "5 µL ; 16,9 µL"], ["P200", "20 à 200 µL", "50 µL ; 180 µL"], ["P1000", "100 (ou 200) à 1000 µL", "250 µL ; 900 µL"], ["Pipette sérologique", "1 à 50 mL", "4,5 mL ; 9 mL ; 25 mL"]]}]}]}, {"id": "m4", "num": 4, "title": "Solutions mères et tampons concentrés", "intro": "Les tampons sont conservés sous forme concentrée (2X à 50X) et dilués au moment de l'usage. Le calcul est un C<sub>1</sub>V<sub>1</sub> = C<sub>2</sub>V<sub>2</sub> dans lequel l'unité est « X ».", "notions": [{"code": "4.1", "t": "Le facteur X d'un tampon", "use": "Lire correctement l'étiquette « TAE 50X », « PBS 10X », « Buffer 5X » et savoir combien diluer.", "def": "« nX » signifie que la solution est n fois plus concentrée que la solution de travail (1X). Ce n'est pas une concentration massique ni molaire : c'est un rapport à la composition de référence du tampon.", "f": ["F = X<sub>stock</sub> / X<sub>final</sub>"], "vars": [["X<sub>stock</sub>", "concentration relative du stock", "X"], ["X<sub>final</sub>", "concentration relative voulue", "X"]], "units": "X est une unité relative propre à chaque tampon : 1X TAE et 1X TBE n'ont pas la même composition. Ne jamais supposer que tous les stocks d'un même tampon sont à la même concentration : le TBE existe en 5X et en 10X, le PBS en 10X ou 20X.", "method": ["Lire la concentration du stock sur l'étiquette.", "Identifier la concentration de travail exigée par le protocole (1X, 0,5X…).", "Calculer F."], "ex": {"q": "Le protocole demande du TBE 0,5X et le stock est à 10X. Facteur de dilution ?", "steps": ["F = 10 / 0,5 = 20."], "r": "Diluer 20 fois."}, "check": "1X serait une dilution par 10 ; 0,5X est deux fois plus dilué : 20.", "err": ["Croire que 0,5X signifie « diluer par 0,5 ».", "Supposer qu'un TBE « stock » est forcément 10X sans lire l'étiquette."], "quick": ["Facteur pour passer d'un tampon 5X à 1X ?", "5."], "tables": []}, {"code": "4.2", "t": "Préparer un tampon 1X à partir d'un stock concentré", "use": "Tampon de migration, tampon de lavage, tampon d'élution, PBS de travail.", "def": "Application directe de C<sub>1</sub>V<sub>1</sub> = C<sub>2</sub>V<sub>2</sub> avec les concentrations en X.", "f": ["V<sub>stock</sub> = V<sub>final</sub> × X<sub>final</sub> / X<sub>stock</sub>", "V<sub>eau</sub> = V<sub>final</sub> − V<sub>stock</sub>"], "vars": [["V<sub>stock</sub>", "volume de stock à prélever", "mL"], ["V<sub>final</sub>", "volume final de tampon", "mL"]], "units": "Volumes dans la même unité.", "method": ["Calculer V<sub>stock</sub>.", "Calculer V<sub>eau</sub>.", "Mélanger, puis vérifier si le protocole impose un contrôle du pH."], "ex": {"q": "Préparer 500 mL de TAE 1X à partir de TAE 50X.", "steps": ["V<sub>stock</sub> = 500 × 1 / 50 = 10 mL.", "V<sub>eau</sub> = 500 − 10 = 490 mL."], "r": "10 mL de TAE 50X + 490 mL d'eau."}, "check": "Concentration finale : 50X × 10 / 500 = 1X.", "err": ["Prendre 500 / 50 = 10 mL et ajouter 500 mL d'eau (concentration 0,98X ; erreur faible ici mais grande avec un 5X).", "Utiliser le même calcul pour un TBE 5X que pour un 10X."], "quick": ["Volume de PBS 20X pour 1 L de PBS 1X ?", "50 mL (+ 950 mL d'eau)."], "tables": [{"head": ["Stock → travail", "V<sub>final</sub>", "Volume de stock", "Volume d'eau"], "rows": [["TAE 50X → 1X", "500 mL", "10 mL", "490 mL"], ["TAE 50X → 1X", "2 L", "40 mL", "1960 mL"], ["TBE 10X → 0,5X", "1 L", "50 mL", "950 mL"], ["TBE 5X → 0,5X", "2 L", "200 mL", "1800 mL"], ["TBE 10X → 1X", "500 mL", "50 mL", "450 mL"], ["PBS 10X → 1X", "250 mL", "25 mL", "225 mL"]]}]}, {"code": "4.3", "t": "Composition des tampons d'électrophorèse TAE et TBE", "use": "Préparer le stock lui-même à partir des poudres et comprendre ce que contient la solution 1X.", "def": "Le TAE 50X d'usage courant contient, pour 1 L : 242 g de Tris base, 57,1 mL d'acide acétique glacial et 100 mL d'EDTA 0,5 M pH 8,0. Dilué 50 fois, il donne 40 mM Tris-acétate et 1 mM EDTA. Une recette fréquente de TBE 5X contient, pour 1 L : 54 g de Tris base, 27,5 g d'acide borique et 20 mL d'EDTA 0,5 M pH 8,0 ; le 0,5X contient environ 45 mM Tris-borate et 1 mM EDTA.", "f": ["m (pour V) = m (pour 1 L) × V(L)", "C<sub>1X</sub> = C<sub>stock</sub> / X<sub>stock</sub>"], "vars": [["C<sub>stock</sub>", "concentration molaire d'un composant dans le stock", "M"]], "units": "Ces recettes sont des recettes de référence (Cold Spring Harbor Protocols) ; le protocole validé du laboratoire prime.", "method": ["Mettre la recette à l'échelle du volume de stock voulu.", "Calculer la concentration finale de chaque composant après dilution."], "ex": {"q": "Préparer 250 mL de TAE 50X ; vérifier la concentration en EDTA du TAE 1X.", "steps": ["Tris : 242 × 0,25 = 60,5 g ; acide acétique : 57,1 × 0,25 = 14,275 mL (≈ 14,3 mL) ; EDTA 0,5 M : 100 × 0,25 = 25 mL.", "EDTA dans le 50X : 0,5 M × 25 mL / 250 mL = 0,05 M = 50 mM.", "EDTA dans le 1X : 50 / 50 = 1 mM."], "r": "60,5 g Tris, 14,3 mL acide acétique, 25 mL EDTA 0,5 M, compléter à 250 mL. EDTA 1X : 1 mM."}, "check": "On retrouve la composition publiée du TAE 1X (1 mM EDTA).", "err": ["Confondre la recette du 50X avec celle du 1X.", "Remplacer l'EDTA 0,5 M par de l'EDTA en poudre sans recalculer la masse."], "quick": ["Masse d'acide borique pour 500 mL de TBE 5X ?", "13,75 g."], "tables": []}, {"code": "4.4", "t": "Solutions de travail, de lavage et d'élution", "use": "Tris-HCl 10 mM d'élution, éthanol 70 % de lavage, EDTA, NaCl : les dilutions quotidiennes de la paillasse.", "def": "Les solutions de travail sont obtenues par dilution d'un stock en unités molaires, massiques, en X ou en pourcentage V/V. Le calcul est toujours C<sub>1</sub>V<sub>1</sub> = C<sub>2</sub>V<sub>2</sub> avec des unités identiques.", "f": ["V<sub>1</sub> = C<sub>2</sub> × V<sub>2</sub> / C<sub>1</sub>"], "vars": [["C<sub>1</sub>, C<sub>2</sub>", "concentrations stock et travail", "M, mM, %, X…"]], "units": "Pour l'éthanol, les pourcentages sont V/V. Le mélange eau-éthanol présente une contraction de volume : compléter au volume final.", "method": ["Mettre C<sub>1</sub> et C<sub>2</sub> dans la même unité.", "Calculer V<sub>1</sub>.", "Compléter au volume final (et non ajouter un volume d'eau calculé, pour l'éthanol)."], "ex": {"q": "Préparer 100 mL d'éthanol 70 % à partir d'éthanol 96 %, et 50 mL de Tris-HCl 10 mM à partir de Tris-HCl 1 M.", "steps": ["Éthanol : V<sub>1</sub> = 70 × 100 / 96 = 72,9 mL, compléter à 100 mL avec de l'eau.", "Tris : 10 mM = 0,010 M ; V<sub>1</sub> = 0,010 × 50 / 1 = 0,5 mL ; eau : 49,5 mL."], "r": "72,9 mL d'éthanol 96 % complétés à 100 mL ; 0,5 mL de Tris 1 M + 49,5 mL d'eau."}, "check": "Tris : 1 M / 10 mM = 100 ; 50 mL / 0,5 mL = 100. Cohérent.", "err": ["Préparer l'éthanol 70 % avec 70 mL d'éthanol 96 % + 30 mL d'eau (on obtient environ 67 %).", "Utiliser 1 et 10 sans convertir M et mM (V<sub>1</sub> = 500 mL)."], "quick": ["Volume de NaCl 5 M pour 200 mL de NaCl 150 mM ?", "6 mL."], "tables": []}, {"code": "4.5", "t": "Volumes de stock pour différents volumes finaux", "use": "Ajuster rapidement la préparation à la taille de la cuve, au nombre de gels ou au volume d'une colonne.", "def": "Le volume de stock est proportionnel au volume final : doubler le volume final double le volume de stock, le facteur de dilution restant constant.", "f": ["V<sub>stock</sub> = V<sub>final</sub> / F"], "vars": [["F", "facteur de dilution X<sub>stock</sub>/X<sub>final</sub>", "sans unité"]], "units": "Préparer un tableau à l'avance évite les calculs répétés et les erreurs à la paillasse.", "method": ["Calculer F une seule fois.", "Diviser chaque volume final par F."], "ex": {"q": "Une cuve nécessite 350 mL de tampon 1X ; le stock est 20X.", "steps": ["F = 20.", "V<sub>stock</sub> = 350 / 20 = 17,5 mL ; eau : 332,5 mL."], "r": "17,5 mL de stock + 332,5 mL d'eau."}, "check": "17,5 × 20 = 350 : cohérent.", "err": ["Garder le volume de stock d'une préparation précédente pour un autre volume final."], "quick": ["Volume de stock 5X pour 750 mL de 1X ?", "150 mL."], "tables": [{"head": ["V<sub>final</sub>", "Stock 5X → 1X", "Stock 10X → 1X", "Stock 20X → 1X", "Stock 50X → 1X"], "rows": [["100 mL", "20 mL", "10 mL", "5 mL", "2 mL"], ["250 mL", "50 mL", "25 mL", "12,5 mL", "5 mL"], ["500 mL", "100 mL", "50 mL", "25 mL", "10 mL"], ["1000 mL", "200 mL", "100 mL", "50 mL", "20 mL"], ["2000 mL", "400 mL", "200 mL", "100 mL", "40 mL"]]}]}]}, {"id": "m5", "num": 5, "title": "Tampons de charge pour électrophorèse", "intro": "Le tampon de charge (loading dye) alourdit l'échantillon et le colore. Il est fourni concentré (souvent 6X) et doit se trouver à 1X dans le puits.", "notions": [{"code": "5.1", "t": "Ajouter le tampon 6X à un échantillon de volume imposé", "use": "Cas le plus courant : on dispose de 10 µL de produit PCR et on veut le charger.", "def": "Le tampon ajouté augmente le volume total. Le volume final n'est donc pas le volume de l'échantillon mais la somme échantillon + tampon.", "f": ["X<sub>s</sub> × V<sub>dye</sub> = X<sub>f</sub> × (V<sub>éch</sub> + V<sub>dye</sub>)", "V<sub>dye</sub> = V<sub>éch</sub> × X<sub>f</sub> / (X<sub>s</sub> − X<sub>f</sub>)", "Pour 6X → 1X : V<sub>dye</sub> = V<sub>éch</sub> / 5"], "vars": [["V<sub>dye</sub>", "volume de tampon de charge à ajouter", "µL"], ["V<sub>éch</sub>", "volume d'échantillon", "µL"], ["X<sub>s</sub>", "concentration du tampon de charge", "X (ex. 6X)"], ["X<sub>f</sub>", "concentration finale", "X (1X)"]], "units": "X est une unité relative ; elle ne se convertit pas en g/L.", "method": ["Calculer V<sub>dye</sub> = V<sub>éch</sub> / (X<sub>s</sub> − 1) pour une concentration finale de 1X.", "Calculer le volume final.", "Vérifier : X<sub>s</sub> × V<sub>dye</sub> / V<sub>final</sub> = 1X."], "ex": {"q": "Charger 10 µL de produit PCR avec du loading dye 6X, concentration finale 1X.", "steps": ["V<sub>dye</sub> = 10 / (6 − 1) = 2 µL.", "V<sub>final</sub> = 10 + 2 = 12 µL."], "r": "Ajouter 2 µL de 6X ; volume total 12 µL."}, "check": "6X × 2 / 12 = 1X.", "err": ["Calculer V<sub>dye</sub> = 10 / 6 = 1,67 µL : on obtient 6 × 1,67 / 11,67 = 0,86X.", "Confondre le facteur 6X avec une concentration de 6 g/L."], "quick": ["Volume de 6X pour 20 µL d'échantillon ?", "4 µL (volume final 24 µL)."], "tables": [{"head": ["V<sub>échantillon</sub>", "V<sub>6X</sub> à ajouter", "V<sub>final</sub>", "Contrôle"], "rows": [["5 µL", "1 µL", "6 µL", "1X"], ["10 µL", "2 µL", "12 µL", "1X"], ["15 µL", "3 µL", "18 µL", "1X"], ["20 µL", "4 µL", "24 µL", "1X"], ["25 µL", "5 µL", "30 µL", "1X"]]}]}, {"code": "5.2", "t": "Préparer un mélange à volume final imposé", "use": "Le puits accepte un volume maximal (ex. 12 µL ou 20 µL) ou l'on ve
