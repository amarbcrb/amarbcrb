<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Arcane</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Assistant de scène pour magicien : révélations de cartes, écran noir, tours de cartes et de chiffres.">
<meta name="theme-color" content="#07060a">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Arcane">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/cinzel.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/cormorant.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <symbol id="su-H" viewBox="0 0 100 100"><path d="M50 92C47 88 6 60 6 32 6 16 18 6 31 6c9 0 16 5 19 13 3-8 10-13 19-13 13 0 25 10 25 26 0 28-41 56-44 60z"/></symbol>
  <symbol id="su-D" viewBox="0 0 100 100"><path d="M50 3c10 17 24 33 38 47-14 14-28 30-38 47C40 80 26 64 12 50 26 36 40 20 50 3z"/></symbol>
  <symbol id="su-S" viewBox="0 0 100 100"><path d="M50 4c6 14 42 34 42 58 0 14-11 22-22 22-8 0-14-4-17-10 1 10 5 17 13 22H34c8-5 12-12 13-22-3 6-9 10-17 10-11 0-22-8-22-22C8 38 44 18 50 4z"/></symbol>
  <symbol id="su-C" viewBox="0 0 100 100"><circle cx="50" cy="27" r="20"/><circle cx="27" cy="59" r="20"/><circle cx="73" cy="59" r="20"/><path d="M40 44h20v12H40zM45 52h10l1 20c1 12 5 19 12 24H32c7-5 11-12 12-24z"/></symbol>
  <symbol id="orn" viewBox="0 0 240 24"><path d="M0 12h96M144 12h96" stroke="currentColor" stroke-width="1.2"/><path d="M120 2l10 10-10 10-10-10z" fill="currentColor"/><path d="M98 12l8-5 8 5-8 5zM126 12l8-5 8 5-8 5z" fill="none" stroke="currentColor" stroke-width="1.2"/><circle cx="92" cy="12" r="2" fill="currentColor"/><circle cx="148" cy="12" r="2" fill="currentColor"/></symbol>
  <symbol id="i-gear" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM19.4 13.5l1.6 1.2-2 3.4-1.9-.7a7 7 0 0 1-1.8 1l-.3 2h-4l-.3-2a7 7 0 0 1-1.8-1l-1.9.7-2-3.4 1.6-1.2a7 7 0 0 1 0-3L3 9.3l2-3.4 1.9.7a7 7 0 0 1 1.8-1L9 3.6h4l.3 2a7 7 0 0 1 1.8 1l1.9-.7 2 3.4-1.6 1.2a7 7 0 0 1 0 3z"/></symbol>
  <symbol id="i-show" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2.5l1.8 4.6 4.9.3-3.8 3.1 1.2 4.8L12 12.6l-4.1 2.7 1.2-4.8-3.8-3.1 4.9-.3z"/><path d="M5 21l3-5M19 21l-3-5M8 21h8"/></g></symbol>
  <symbol id="i-cards" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="7" y="3" width="11" height="16" rx="2"/><path d="M5.5 6.5 4 7.2a1.6 1.6 0 0 0-.8 2.1l4.4 10.1"/><path d="M12.5 8.5c-1.6 1.5-3 2.6-3 4a1.6 1.6 0 0 0 3 .7 1.6 1.6 0 0 0 3-.7c0-1.4-1.4-2.5-3-4z"/></g></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><g fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></g></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10 8.2v7.6l6-3.8z" fill="currentColor"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4.4h-4.4"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></symbol>
  <symbol id="i-hand" viewBox="0 0 48 48"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 25V9.5a3 3 0 0 1 6 0V22M25 21v-3a3 3 0 0 1 6 0v4M31 21a3 3 0 0 1 6 0v8c0 7-4 13-11 13h-2c-5 0-8-3-11-7l-5-7a3 3 0 0 1 4.6-3.8L19 30"/><path d="M14 9a8 8 0 0 1 16 0" opacity=".55"/><path d="M9.5 9a12.5 12.5 0 0 1 25 0" opacity=".3"/></g></symbol>
</svg>

<main id="app">

  <!-- ONGLET RÉGLAGES SECRETS -->
  <section class="view" data-view="secret" data-tab="secret">
    <header class="top"><span class="top-side"></span><h1>Réglages secrets</h1><button class="icon-btn" data-go="prefs" aria-label="Réglages généraux"><svg><use href="#i-gear"/></svg></button></header>
    <div id="secret-body"></div>
  </section>

  <!-- ONGLET SPECTACLE -->
  <section class="view view-show" data-view="show" data-tab="show" hidden></section>

  <!-- ONGLET TOURS -->
  <section class="view" data-view="tours" data-tab="tours" hidden>
    <header class="top"><span class="top-side"></span><h1>Tours</h1><span class="top-side"></span></header>
    <div id="tours-body"></div>
  </section>

  <!-- ONGLET PLUS -->
  <section class="view" data-view="plus" data-tab="plus" hidden>
    <header class="top"><span class="top-side"></span><h1>Plus</h1><span class="top-side"></span></header>
    <div class="list" id="plus-body"></div>
  </section>

  <!-- Sous-pages : contenu généré par app.js -->
  <section class="view" data-view="sub" hidden>
    <header class="top"><button class="icon-btn back" data-back aria-label="Retour">‹</button><h1 id="sub-title"></h1><span class="top-side"></span></header>
    <div id="sub-body"></div>
  </section>

</main>

<nav class="tabbar" aria-label="Navigation">
  <button data-tabgo="secret"><svg><use href="#i-gear"/></svg><span>Réglages</span></button>
  <button data-tabgo="show"><svg><use href="#i-show"/></svg><span>Spectacle</span></button>
  <button data-tabgo="tours"><svg><use href="#i-cards"/></svg><span>Tours</span></button>
  <button data-tabgo="plus"><svg><use href="#i-more"/></svg><span>Plus</span></button>
</nav>

<!-- Scène plein écran : ce que voit le public -->
<div id="stage" class="stage" hidden></div>

<script src="app.js"></script>
</body>
</html>
